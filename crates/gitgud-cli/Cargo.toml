[package]
name = "gitgud-cli"
version = "0.1.1"
edition = "2024"
publish = false

[[bin]]
name = "gitgud-cli"
path = "src/main.rs"

[dependencies]
gitgud-core = { path = "../gitgud-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
gitgud-core = { path = "../gitgud-core", features = ["test-util"] }
tempfile = "3.27.0"
