[package]
name = "gitgud-core"
version = "0.1.3"
edition = "2024"
publish = false

[features]
# Exposes `testing::TestRepo` to other crates' tests.
test-util = ["dep:tempfile"]

[dependencies]
csv = "1.4.0"
ebur128 = "0.1.11"
flate2 = "1"
gix = { version = "0.90", features = ["status", "parallel", "blob-diff"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "exr", "hdr", "tiff", "rayon"] }
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image", "encode"] }
notify = "9"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
symphonia = { version = "0.6.1", features = ["all"] }
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
ttf-parser = "0.25.1"
woff2-patched = "0.4.0"
which = "8.0.6"
xxhash-rust = { version = "0.8.21", features = ["xxh64"] }
yaml-rust2 = "0.13.2"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

[dev-dependencies]
gitgud-core = { path = ".", features = ["test-util"] }
proptest = "1.12.0"
serde_json = "1.0.154"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
