[package]
name = "gitgud-core"
version = "0.1.2"
edition = "2024"
publish = false

[features]
# Exposes `testing::TestRepo` to other crates' tests.
test-util = ["dep:tempfile"]

[dependencies]
gix = { version = "0.90", features = ["status", "parallel", "blob-diff"] }
image = { version = "0.25.10", default-features = false, features = ["png", "exr", "hdr", "tiff", "rayon"] }
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }
notify = "9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
which = "8.0.6"
xxhash-rust = { version = "0.8.21", features = ["xxh64"] }
yaml-rust2 = "0.13.2"

[dev-dependencies]
gitgud-core = { path = ".", features = ["test-util"] }
proptest = "1.12.0"
serde_json = "1.0.154"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
