tbucket's LFS lock API support before the spec relies on it. | gamedev.md §2.9 |\n| Q3 | Solo, or with artists/designers? | **Solo first, artists later** (artist mode after v1). | gamedev.md §6 |\n| Q4 | Lore (Epic, 2026): ignore, or keep `gitgud-core` VCS-agnostic? | **Ignore, Git-only core.** | gamedev.md §2.5 |\n| Q5 | Unity editor package in v1? | **After v1.** v1 = locks inside gitgud only. | gamedev.md T13 |\n| Q6 | Binary previews in the MVP? | **Textures + prefab object list**: image diff (side-by-side/swipe/onion) plus a structural prefab diff of changed objects and fields; rendered prefab thumbnails later. | gamedev.md T7–T8 |\n| Q7 | Sparse checkout / `lfs.fetchinclude` UI in v1? | **Later.** LFS-aware status speed first. | gamedev.md T9 |\n| Q8 | Stacked branches: show, or manage? | **Show + restack** via `rebase --update-refs`; PR links per level via browser URLs. | workflows.md W3 |\n\n## Safety and history\n\n| # | Question | Answer (decided 2026-11-21) | Source |\n|---|---|---|---|\n| Q9 | Undo model? | **Own op log behind Ctrl+Z**: snapshot refs, index and working tree under a private ref before every action. | ux-principles.md, handson.md |\n| Q10 | Use Git's experimental `git history`, or own the rewrite logic? | **Own it in core** (gix + `git replay`/rebase), with conflict prediction and a result-graph preview. | workflows.md W4 |\n| Q11 | Record conflicts and continue, or classic stop? | **Classic stop + preview**: predict conflicts before starting, persistent Continue/Abort banner. | landscape.md, handson.md |\n\n## Agents and AI\n\n| # | Question | Answer (decided 2026-11-21) | Source |\n|---|---|---|---|\n| Q12 | Agent flow? | **Proposals under `refs/gitgud/proposals/<id>` + review inbox**; the index is untouched until approval; approve commits through the git CLI. | agents.md §6 |\n| Q13 | AI commit messages: installed CLI or API key? | **Installed CLI first, API key optional.** | landscape.md |\n| Q14 | Which Unity checks block an agent proposal? | **Flag all three, block none**; Max decides on review. | agents.md |\n\n## From the spikes and the hands-on round\n\n| # | Question | Answer (decided 2026-11-21) | Source |\n|---|---|---|---|\n| Q15 | Git 2.45.1 breaks LFS clones. Upgrade? | **Claude upgrades it.** Done: Git for Windows 2.56.1, git-lfs 3.8.1. | spikes.md 4.6 |\n| Q16 | Remove `GIT_CURL_VERBOSE=0` from the environment? | **Claude removes it.** Done: user variable deleted (new terminals pick it up). | spikes.md 4.6 |\n| Q17 | Minimum Git version? | **Bundle our own Git; use the system Git by default when it meets the floor, bundled Git as fallback.** Floor: 2.45.2. Claude's pick was \"≥ 2.45.2, recommend ≥ 2.54, no bundle\"; the system-first default keeps hooks, credential helpers and signing identical to the terminal. | spikes.md, workflows.md |\n| Q18 | lazygit hands-on column? | **Skip it.** | handson.md |\n| Q19 | Keep the test repos (rust 1.2 GB, BoatAttack 1.1 GB) in the old session scratchpad? | **Keep until the spec is done.** They live in Temp, so a cleanup could still wipe them. | — |\n\nDownloads approved by Max on 2026-11-21 (\"ok all downloads\"). Used for the Unity repo: Unity-Technologies/BoatAttack (public, Claude's pick, since none was named).\n\n## Challenges to section 0 or the stack\n\n- **Binary previews (answer 4)**: textures are cheap; prefab previews mean rendering or a structural diff\n  of Unity YAML with GUID resolution: weeks, not days. Settled by Q6: textures + structural diff in the\n  MVP, rendered thumbnails later.\n- **Stack**: no challenge, now measured (spikes.md). WebView2 held 100 fps scrolling 349k commits; `gix`\n  walks the full graph topology in 106 ms. Two `gix` rules: rename detection off or capped for big ranges,\n  and refresh the index after a mass touch (status doesn't write it back).\n- **\"No in-app PR APIs\" (answer 3)**: GitHub stacked PRs went GA 2026-10-06; opening the right base for each\n  stack level works through browser URLs, so no change needed.\n- **Bundled Git (Q17)**: CLAUDE.md says writes go through the `git` CLI so hooks and credentials behave as in\n  a terminal. Running the system Git by default keeps that; the bundled copy only covers machines with no\n  Git or one below the floor.\n"}, "shots": [{"id": "gui-gitkraken-client", "file": "img/gui-gitkraken-client.webp", "tool": "GitKraken", "title": "GitKraken graph with Undo/Redo toolbar and agent WIP nodes", "source": "https://www.gitkraken.com/git-client", "checked": "2026-11-21", "tags": ["graph", "undo", "agents"], "pins": [{"x": 39, "y": 13, "note": "Undo/Redo in the toolbar: reverts only the most recent supported action"}, {"x": 41, "y": 31, "note": "WIP node per worktree, here an agent session 'Awaiting Approval'"}, {"x": 19, "y": 23, "note": "Sidebar toggles List vs Agents view"}, {"x": 10, "y": 50, "note": "Remotes grouped by person in the sidebar"}], "insight": "GitKraken now frames the graph as a control surface for parallel coding agents, each with its own WIP node; undo is single-step.", "gitgud": "Claude's pick: steal WIP/agent nodes in the graph, but back them with a multi-step op-log undo instead of last-action-only.", "track": "gui"}, {"id": "gui-fork-home", "file": "img/gui-fork-home.webp", "tool": "Fork", "title": "Fork main window: tabs, folder-grouped branches, graph, commit detail", "source": "https://fork.dev", "checked": "2026-11-21", "tags": ["graph", "sidebar", "palette"], "pins": [{"x": 15, "y": 51, "note": "Branches grouped by folder prefix (aozgaa/, dev/, lego/)"}, {"x": 14, "y": 9, "note": "Quick Launch: command palette for checkout, file history, custom commands"}, {"x": 27, "y": 32, "note": "Compact graph lanes beside one-line commits"}, {"x": 30, "y": 55, "note": "Commit / Changes / File Tree tabs for the selected commit"}], "insight": "Dense native UI, one repo per tab, palette-driven; the reference 'fast and friendly' classic client at $59.99 one-time.", "gitgud": "Claude's pick: match Fork's density and rpoint.app/git/file-locking/", "checked": "2026-11-21", "tags": ["locking", "git", "lfs"], "pins": [{"x": 50, "y": 20, "note": "Locked files are write-protected; a user thumbnail shows who holds the lock"}, {"x": 50, "y": 70, "note": "Binaries auto-lock on modify, unlock on push; text files opt-in"}, {"x": 50, "y": 85, "note": "With the Unreal plugin, editor checkout replaces auto-locking"}, {"x": 86, "y": 23, "note": "Separate section: Git LFS locks are a different system, not used"}], "insight": "Anchorpoint makes locking invisible: modifying a binary locks it, pushing releases it, and an avatar shows the owner. It does this with its own metadata server, not Git LFS locks.", "gitgud": "Claude's pick: copy the auto-lock-on-modify and release-on-push mechanics, but on standard LFS locks so it works with any host and no extra server.", "track": "gamedev"}, {"id": "gd-anchorpoint-home", "file": "img/gd-anchorpoint-home.webp", "tool": "Anchorpoint", "title": "Anchorpoint main window: timeline, changed files with thumbnails, 3D preview", "source": "https://www.anchorpoint.app/", "checked": "2026-11-21", "tags": ["previews", "staging", "artists"], "pins": [{"x": 21, "y": 61, "note": "Timeline of commits per person replaces a branch graph"}, {"x": 49, "y": 27, "note": "Single message box + Sync button: commit and push in one step"}, {"x": 40, "y": 70, "note": "Changed files grouped by folder, each with a thumbnail"}, {"x": 77, "y": 50, "note": "FBX opened in an inline 3D viewer with version picker"}], "insight": "The artist-facing flow is one list of changed files with thumbnails and a single Sync action; the 3D preview sits next to the list.", "gitgud": "Claude's pick: give binary rows real thumbnails and an inline preview pane, but keep stage/commit/push explicit for a programmer like Max.", "track": "gamedev"}, {"id": "gd-anchorpoint-unity-docs", "file": "img/gd-anchorpoint-unity-docs.webp", "tool": "Anchorpoint", "title": "Anchorpoint Unity guide: lock scenes/prefabs, 26-11-21", "tags": ["locking", "branches", "unity"], "pins": [{"x": 50, "y": 38, "note": "Checkout vs Lock and checkout; rules turn checkout into a lock"}, {"x": 50, "y": 54, "note": "Only the latest revision can be locked, so no stale edits"}, {"x": 50, "y": 66, "note": "One org-wide lock rule plus per-repo rules"}, {"x": 50, "y": 80, "note": "Check-in on a side branch = Retained until merged to main"}], "insight": "Smart Locks tie locks to a destination branch: you can only lock the newest version, and the lock follows your change until it is merged.", "gitgud": "Claude's pick: warn before locking if your local copy of the file is behind origin/main (cheap with gix), mirroring the latest-revision rule.", "track": "gamedev"}, {"id": "gd-uvcs-gluon-configure", "file": "img/gd-uvcs-gluon-configure.webp", "tool": "Unity Version Control (Gluon)", "title": "Gluon: pick files to load into a partial workspace", "source": "https://docs.unity.com/en-us/unity-version-control/gluon/configure-workspace", "checked": "2026-11-21", "tags": ["partial-checkout", "artists", "previews"], "pins": [{"x": 50, "y": 33, "note": "Configure: tick files and folders to download"}, {"x": 55, "y": 37, "note": "Search by pattern (*.jpg, *.psd) to select"}, {"x": 38, "y": 71, "note": "MaxPreviewFileSize key in client.conf"}, {"x": 50, "y": 76, "note": "Unloaded files preview only up to 1 MiB"}], "insight": "Artists work in a partial workspace chosen file by file, with previews of files they have not downloaded.", "gitgud": "Claude's pick: a folder-tree 'load / unload' view that drives git sparse-checkout plus lfs.fetchinclude, with previews fetched lazily.", "track": "gamedev"}, {"id": "gd-p4v-icons", "file": "img/gd-p4v-icons.webp", "tool": "Perforce P4V", "title": "P4V file badges: yours red, other users blue, lock, out of date", "source": "https://www.perforce.com/manuals/p4v/Content/P4V/using.icons.html", "checked": "2026-11-21", "tags": ["locking", "status", "who-has-it"], "pins": [{"x": 37, it lfs track --lockable marks a pattern lockable"}, {"x": 25, "y": 37, "note": ".gitattributes gets the lockable attribute"}, {"x": 45, "y": 47, "note": "Lockable files become read-only until you lock them"}, {"x": 20, "y": 64, "note": "git lfs locks lists path, owner, lock ID"}, {"x": 40, "y": 93, "note": "Push continues if the server lacks the locking API"}], "insight": "The whole locking model is already in git-lfs (attribute, read-only enforcement, lock IDs, push verification); it just has no good GUI.", "gitgud": "Claude's pick: build the lock panel on git lfs locks --verify --json and git lfs lock/unlock --json, no custom server.", "track": "gamedev"}, {"id": "gd-unity-smartmerge-docs", "file": "img/gd-unity-smartmerge-docs.webp", "tool": "Unity (UnityYAMLMerge)", "title": "Unity 6.3 Smart merge: what UnityYAMLMerge merges and how it's wired", "source": "https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/smart-merge", "checked": "2026-11-21", "tags": ["unity", "merge", "prefab"], "pins": [{"x": 52, "y": 25, "note": "Merges .unity, .prefab and .meta semantically"}, {"x": 52, "y": 34, "note": ".asset/.mat/.controller need --force, else fallback tool"}, {"x": 52, "y": 48, "note": "With exclusive locks on scenes/prefabs you don't need Smart Merge"}, {"x": 52, "y": 94, "note": "Premerge/Ask modes exist only for Perforce in the editor"}], "insight": "Unity documents UnityYAMLMerge only as an interactive mergetool for Git; scope is scenes, prefabs and metas, and other YAML assets are excluded by default.", "gitgud": "Claude's pick: register it as a git merge driver for .unity/.prefab/.meta (spike to verify exit codes) and always show a structural review of 'clean' merges.", "track": "gamedev"}, {"id": "gd-unity-vcs-integration", "file": "img/gd-unity-vcs-integration.webp", "tool": "Unity", "title": "Unity 6.3 editor VCS operations: Perforce vs UVCS, none for Git", "source": "https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/versioncontrolintegration", "checked": "2026-11-21", "tags": ["unity", "integration", "meta"], "pins": [{"x": 46, "y": 26, "note": "Only Perforce and UVCS columns: Git has no editor integration"}, {"x": 62, "y": 38, "note": "UVCS cannot Get Latest from the Project view"}, {"x": 30, "y": 62, "note": "Perforce can check out asset and .meta together or separately"}, {"x": 62, "y": 91, "note": "UVCS conflicts must be resolved in its own GUI"}, {"x": 10, "y": 98, "note": "Lock/Unlock: Perforce yes, UVCS no"}], "insight": "Unity's built-in VCS hooks give Perforce users checkout, lock and resolve in the editor; Git users get only visible .meta files.", "gitgud": "Claude's pick: treat asset+meta as one unit in gitgud's own UI, since Unity won't help Git users do it.", "track": "gamedev"}, {"id": "gd-ue-gitplugin-readme", "file": "img/gd-ue-gitplugin-readme.webp", "tool": "UEGitPlugin (ProjectBorealis)", "title": "Unreal Git plugin: fast LFS locking and Status Branches", "source": "https://github.com/ProjectBorealis/UEGitPlugin", "checked": "2026-11-21", "tags": ["unreal", "lfs", "locking"], "pins": [{"x": 46, "y": 20, "note": "Multi-threaded lock/unlock for many files at once"}, {"x": 46, "y": 41, "note": "Status Branches: flag files changed on other remote branches"}, {"x": 46, "y": 76, "note": "No prebuilt binaries; compile it yourself"}, {"x": 46, "y": 86, "note": "Needs explicit *.uasset / *.umap .gitattributes lines"}], "insight": "Production Unreal teams on Git needed lock batching, a local lock cache and cross-branch 'outdated' detection to make LFS locks usable.", "gitgud": "Claude's pick: batch lock/unlock calls, cache lock state locally, and flag files modified on configured remote branches (a Status Branches equivalent).", "track": "gamedev"}, {"id": "gd-github-lfs-billing", "file": "img/gd-github-lfs-billing.webp", "tool": "GitHub", "title": "GitHub Git LFS billing: metered storage and bandwidth", "source": "https://docs.github.com/en/billing/concepts/product-billing/git-lfs", "checked": "2026-11-21", "tags": ["lfs", "pricing", "hosting"], "pins": [{"x": 30, "y": 36, "note": "$0 budget: LFS blocked for the rest of the month"}, {"x": 50, "y": 63, "note": "Every download bills the repo owner's bandwidth"}, {"x": 50, "y": 84, "note": "1-byte change to a 500 MB file = another 500 MB stored"}, {"x": 50, "y": 96, "note": "GitHub Actions LFS downloads count too"}], "insight": "LFS cost is driven by whole-file re-uploads and every clone/CI download, which is why game teams get surprise budget lockouts.", "gitgud": "Claude's pick: show the LFS bytes a push will add before pushing, and a local cache/prune panel.", "track": "gamedev"}, {"id": "gd-gitlab-file-lock", "file": "img/gd-gitlab-file-lock.webp", "tool": "GitLab", "title": "GitLab file locking: LFS exclusive locks vs default-branch locks", "source": "https://docs.gitlab.com/user/project/file_lock/", "checked": "2026-11-21", "tags": ["locking", "hosting", "lfs"], "pins": [{"x": 50, "y": 33, "note": "Exclusive LFS locks on all tiers, block every branch"}, {"x": 50, "y": 53, "note": "UI default-branch locks are Premium/Ultimate only"}, {"x": 50, "y": 85, "note": "Other branches stay editable but show Lock status"}, {"x": 50, "y": 95, "note": "Fork sync bypasses default-branch locks"}], "insight": "GitLab exposes standard LFS locks everywhere and adds a host-side lock that blocks merge requests into the default branch.", "gitgud": "Claude's pick: rely on standard LFS locks (portable across GitHub, GitLab, Azure, Gitea) and only link out to host-specific lock pages.", "track": "gamedev"}, {"id": "gd-jetbrains-gamedev-vcs", "file": "img/gd-jetbrains-gamedev-vcs.webp", "tool": "Survey (JetBrains 2025)", "title": "Version control and asset sharing tools by studio size, 2025", "source": "https://lp.jetbrains.com/the-state-of-gamedev-2025/", "checked": "2026-11-21", "tags": ["data", "usage"], "pins": [{"x": 9, "y": 17, "note": "Perforce: 45% AAA, 10% mid/indie, 3% hobbyist"}, {"x": 22, "y": 21, "note": "GitHub: 61% mid/indie, 79% hobbyist"}, {"x": 18, "y": 35, "note": "Unity Version Control: 0% AAA, 9% mid/indie"}, {"x": 28, "y": 74, "note": "Google Drive still used for art by a third of teams"}], "insight": "Below AAA, game dev runs on GitHub and Git; Perforce is an AAA tool and UVCS is niche. Art still travels outside version control a lot.", "gitgud": "Claude's pick: target Git + LFS on GitHub-class hosts for Unity indies and mid-size teams, Max's own segment.", "track": "gamedev"}, {"id": "gd-fork-lfs-unlock-issue", "file": "img/gd-fork-lfs-unlock-issue.webp", "tool": "Fork", "title": "Fork issue: artists want unlock-on-push for LFS locks", "source": "https://github.com/fork-dev/TrackerWin/issues/1862", "checked": "2026-11-21", "tags": ["locking", "artists", "user-pain"], "pins": [{"x": 40, "y": 27, "note": "Request: 'unlock pushed files' checkbox after push"}, {"x": 40, "y": 70, "note": "Fork dev: technically impossible, push is per branch"}, {"x": 45, "y": 81, "note": "Manual unlocking after every push is too much for artists"}, {"x": 20, "y": 94, "note": "Fork has only a manual Repository > Git LFS > Locks list"}], "insight": "A mainstream Git GUI has lock/unlock but leaves the post-push unlock to the user, and artists drop it; the dev considers automatic unlock infeasible.", "gitgud": "Claude's pick: after a push, diff the pushed range against my locks and offer a pre-ticked unlock list; that is computable from the pushed commits.", "track": "gamedev"}, {"id": "gd-lore-readme", "file": "img/gd-lore-readme.webp", "tool": "Lore (Epic Games)", "title": "Epic's Lore repo: open-source VCS for game-scale binaries", "source": "https://github.com/EpicGames/lore", "checked": "2026-11-21", "tags": ["newcomer", "vcs", "rust"], "pins": [{"x": 94, "y": 16, "note": "9.2k stars within months of the June 2026 release"}, {"x": 80, "y": 65, "note": "v0.14.0: pre-1.0, formats may still change"}, {"x": 6, "y": 73, "note": "lore-fuse: virtual filesystem for lazy file loading"}, {"x": 80, "y": 94, "note": "Written in Rust, like gitgud-core"}, {"x": 7, "y": 34, "note": "Repo ships .claude/skills: agent-assisted development"}], "insight": "Epic's Lore is a centralized, chunked, Rust VCS aimed at Perforce users; locking is advisory today and Unity/Git interop is not on its roadmap.", "gitgud": "Claude's pick: watch it, don't target it in v1; keep gitgud-core's VCS calls behind one module so a Lore backend stays possible (open).", "track": "gamedev"}, {"id": "wf-github-stacked-prs", "file": "img/wf-github-stacked-prs.webp", "tool": "GitHub", "title": "GitHub native stacked PRs: each PR targets the branch below", "source": "https://docs.github.com/en/pull-requests/get-started/about-stacked-prs", "checked": "2026-11-21", "tags": ["stacked-prs", "workflow"], "pins": [{"x": 45, "y": 44, "note": "Stack model: bottom PR targets main, each layer targets the branch below"}, {"x": 50, "y": 61, "note": "Each PR shows only its layer's diff"}, {"x": 50, "y": 66, "note": "Key rule: dependencies must live in the same or a lower layer"}], "insight": "Stacks are now a host-native concept (GA 2026-10-06) driven by the gh stack CLI, with server-side cascading rebase when a lower layer merges.", "gitgud": "Claude's pick: show stacks as a unit in the graph and restack descendants locally after an amend; leave PR creation to the browser.", "track": "workflows"}, {"id": "wf-graphite-cli", "file": "img/wf-graphite-cli.webp", "tool": "Graphite", "title": "Graphite CLI quick start: stacking workflow", "source": "https://graphite.com/docs/cli-quick-start", "checked": "2026-11-21", "tags": ["stacked-prs", "cli", "ai-review"], "pins": [{"x": 50, "y": 21, "note": "Two goals: simplify sharp git edges (rebasing) and enable stacking"}, {"x": 9, "y": 41, "note": "AI Reviews and Agents sections: review is the product now"}, {"x": 7, "y": 89, "note": "GT MCP listed: Graphite exposes stacking to agents"}, {"x": 88, "y": 22, "note": "Workflow: create, stack, address feedback, sync from trunk"}], "insight": "The incumbent stacking tool wraps rebasing behind create/modify/restack/sync verbs and now sits inside Cursor (acquired Dec 2025).", "gitgud": "Claude's pick: steal the verb set (modify = amend + restack above) as GUI actions; don't depend on Graphite's service.", "track": "workflows"}, {"id": "wf-gitbutler-agents", "file": "img/wf-gitbutler-agents.webp", "tool": "GitButler", "title": "GitButler for coding agents: but agent setup", "source": "https://docs.gitbutler.com/ai-agents/overview", "checked": "2026-11-21", "tags": ["agents", "cli", "hunks", "undo"], "pins": [{"x": 28, "y": 54, "note": "One command installs a skill + VCS policy for the agent"}, {"x": 50, "y": 81, "note": "Agents commit selected hunks by ID; rest stays uncommitted"}, {"x": 50, "y": 37, "note": "Vendor benchmark: ~80% fewer commands vs plain Git"}, {"x": 50, "y": 97, "note": "but oplog restores earlier state before publishing"}], "insight": "GitButler steers agents through a skill file and a CLI with hunk IDs, history-edit commands and an op log; the human reviews the same branches in the desktop app.", "gitgud": "Claude's pick: steal hunk IDs, op log and a setup command; avoid requiring a virtual-branch workspace.", "track": "workflows"}, {"id": "wf-gitbutler-parallel", "file": "img/wf-gitbutler-parallel.webp", "tool": "GitButler", "title": "Parallel agents in one workspace vs worktrees", "source": "https://docs.gitbutler.com/ai-agents/parallel-agents", "checked": "2026-11-21", "tags": ["agents", "worktrees", "parallel"], "pins": [{"x": 50, "y": 37, "note": "Branch routing is the agent's job; prompt stays small"}, {"x": 50, "y": 42, "note": "Agents must call out overlap when touching the same file"}, {"x": 57, "y": 85, "note": "Comparison table: one shared dir vs one dir per agent"}, {"x": 67, "y": 94, "note": "Setup cost: reuse one install and dev server"}], "insight": "GitButler's answer to worktree setup cost is several active branches in one working directory, at the price of shared runtime state.", "gitgud": "Claude's pick: support both, but gitgud's proposals need neither: agents propose commits from the one working copy without moving branches.", "track": "workflows"}, {"id": "wf-codex-review-pane", "file": "img/wf-codex-review-pane.webp", "tool": "Codex app", "title": "Codex review pane: review scopes and inline findings", "source": "https://developers.openai.com/codex/app/review", "checked": "2026-11-21", "tags": ["agents", "review", "staging"], "pins": [{"x": 50, "y": 12, "note": "Review pane: line feedback, then stage, revert, commit or push"}, {"x": 50, "y": 36, "note": "Scopes: Unstaged, Staged, Commit, Branch, Last turn"}, {"x": 50, "y": 32, "note": "Shows all repo changes, not only what Codex edited"}, {"x": 50, "y": 80, "note": "Review findings rendered as inline comments in the diff"}], "insight": "OpenAI built a mini Git GUI inside the agent app: diff scopes including 'last turn', chunk staging and revert, commit/push/PR.", "gitgud": "Claude's pick: a 'by agent turn / by proposal' diff scope is worth stealing; gitgud should be the place this review happens, not each agent app.", "track": "workflows"}, {"id": "wf-mcp-git-server", "file": "img/wf-mcp-git-server.webp", "tool": "mcp-server-git (official)", "title": "Official MCP git server: tool list", "source": "https://github.com/modelcontextprotocol/servers/tree/main/src/git", "checked": "2026-11-21", "tags": ["mcp", "agents"], "pins": [{"x": 30, "y": 30, "note": "Tools mirror plain git verbs: status, diffs, commit, add..."}, {"x": 31, "y": 78, "note": "git_commit commits directly: no review gate"}, {"x": 30, "y": 99, "note": "git_add takes file paths only, no hunks"}], "insight": "The reference server is a thin, hardened CLI mirror: it disables hooks, signing and repo-defined drivers, and offers no proposal/approval concept.", "gitgud": "Claude's pick: gitgud's MCP should expose hunk-level 'propose', not 'commit'; real commits (with hooks and signing) happen when Max approves.", "track": "workflows"}, {"id": "wf-git-254-history", "file": "img/wf-git-254-history.webp", "tool": "Git 2.54", "title": "git history reword / split", "source": "https://github.blog/open-source/git/highlights-from-git-2-54/", "checked": "2026-11-21", "tags": ["history-edit", "git-release"], "pins": [{"x": 39, "y": 13, "note": "Why: rebase -i can leave you in a conflicted state"}, {"x": 39, "y": 43, "note": "reword: no worktree/index touch, updates descendant branches"}, {"x": 30, "y": 65, "note": "split: pick hunks like add -p into a new parent commit"}, {"x": 39, "y": 89, "note": "Refuses merge commits and any conflicting operation"}], "insight": "Git now ships targeted, refuse-on-conflict history edits (reword/split 2.54, fixup 2.55, drop 2.56) built on git replay.", "gitgud": "Claude's pick: map these to direct-manipulation actions with a preview, falling back to own replay logic where git history is still experimental.", "track": "workflows"}, {"id": "wf-octoverse-2026", "file": "img/wf-octoverse-2026.webp", "tool": "GitHub Octoverse 2026", "title": "Agents start >40% of PRs; commits 34.3B", "source": "https://github.blog/news-insights/octoverse/octoverse-commits-pushes-reach-new-highs-in-2026-as-developers-build-with-agents/", "checked": "2026-11-21", "tags": ["data", "agents"], "pins": [{"x": 40, "y": 14, "note": "More than 40% of PRs start with an agent (17% in March)"}, {"x": 40, "y": 5, "note": "Repos with agent config file: 8x commits"}, {"x": 36, "y": 78, "note": "Commits 12.9B (2025) to 34.3B (2026)"}, {"x": 60, "y": 85, "note": "Merged PRs 1.3B in the 12 months to Sept 2026"}], "insight": "Commit volume nearly tripled in a year and review is now how developers shape agent output.", "gitgud": "Claude's pick: optimise gitgud for reviewing many agent-made changes fast, not for authoring.", "track": "workflows"}, {"id": "wf-claude-worktrees", "file": "img/wf-claude-worktrees.webp", "tool": "Claude Code", "title": "Claude Code: parallel sessions with worktrees", "source": "https://code.claude.com/docs/en/worktrees", "checked": "2026-11-21", "tags": ["agents", "worktrees"], "pins": [{"x": 49, "y": 28, "note": "--worktree flag, .worktreeinclude, cleanup, non-git hooks"}, {"x": 49, "y": 40, "note": "Each session gets its own checkout and branch"}, {"x": 88, "y": 39, "note": "Enforced isolation: edits to main checkout blocked"}, {"x": 88, "y": 61, "note": "Copy gitignored files into worktrees"}], "insight": "Claude Code defaults parallel work to worktrees under .claude/worktrees with branch worktree-<name>, and skips repo-local filter drivers (LFS pointers result).", "gitgud": "Claude's pick: list these worktrees in gitgud's sidebar and offer an LFS 'hydrate' and 'turn into proposal' action.", "track": "workflows"}, {"id": "wf-git-absorb", "file": "img/wf-git-absorb.webp", "tool": "git-absorb", "title": "git absorb: automatic fixup targets", "source": "https://github.com/tummychow/git-absorb", "checked": "2026-11-21", "tags": ["history-edit", "fixup"], "pins": [{"x": 88, "y": 10, "note": "5.8k stars: real demand for automatic fixups"}, {"x": 39, "y": 54, "note": "Port of hg absorb: fold fixes into the right ancestor"}, {"x": 39, "y": 71, "note": "One command: absorb --and-rebase"}, {"x": 25, "y": 84, "note": "Or inspect fixup! commits, then autosquash"}], "insight": "Absorb finds the target commit per staged hunk by commutation, removing the 'find the SHA, rebase -i' chore.", "gitgud": "Claude's pick: an 'Absorb' button that previews hunk → commit assignments before applying.", "track": "workflows"}, {"id": "wf-so-2025-ai", "file": "img/wf-so-2025-ai.webp", "tool": "Stack Overflow Survey 2025", "title": "AI in the development workflow: committing and reviewing", "source": "https://survey.stackoverflow.co/2025/ai", "checked": "2026-11-21", "tags": ["data", "ai"], "pins": [{"x": 60, "y": 75, "note": "Committing and reviewing code: only 10.2% mostly AI"}, {"x": 67, "y": 21, "note": "Search for answers: 54.1% mostly AI"}, {"x": 19, "y": 34, "note": "Most resistance for high-responsibility tasks"}], "insight": "Developers hand search and docs to AI but keep committing and reviewing for themselves (58.7% don't plan to use AI there).", "gitgud": "Claude's pick: AI drafts, human decides: proposals and opt-in messages, never silent commits.", "track": "workflows"}, {"id": "ux-nng-response-times", "file": "img/ux-nng-response-times.webp", "tool": "Nielsen Norman Group", "title": "Response times: the 0.1 s / 1 s / 10 s limits", "source": "https://www.nngroup.com/articles/response-times-3-important-limits/", "checked": "2026-11-21", "tags": ["latency", "feedback"], "pins": [{"x": 10, "y": 55, "note": "0.1 s: feels instantaneous, just show the result"}, {"x": 10, "y": 64, "note": "1 s: flow of thought survives, feeling of direct control lost"}, {"x": 10, "y": 80, "note": "10 s: attention limit, needs progress and expected finish"}], "insight": "Three perceptual budgets (source 1993) still frame every latency target; past 10 s users need percent-done and a way out.", "gitgud": "Claude's pick: budget every action into one of the three bands; fetch/LFS pull get progress plus Cancel.", "track": "ux"}, {"id": "ux-lawsofux-doherty", "file": "img/ux-lawsofux-doherty.webp", "tool": "Laws of UX", "title": "Doherty threshold: interact under 400 ms", "source": "https://lawsofux.com/doherty-threshold/", "checked": "2026-11-21", "tags": ["latency"], "pins": [{"x": 48, "y": 70, "note": "Productivity rises when neither side waits; <400 ms"}, {"x": 30, "y": 97, "note": "Takeaway: feedback within 400 ms; perceived performance counts"}], "insight": "IBM's 1982 finding sets a looser outer bound than 100 ms; perceived speed (progress, animation) also counts.", "gitgud": "Claude's pick: 400 ms is the hard ceiling for anything non-network; aim for 50 ms like Superhuman.", "track": "ux"}, {"id": "ux-superhuman-100ms", "file": "img/ux-superhuman-100ms.webp", "tool": "Superhuman", "title": "Applying the 100 ms rule to email", "source": "https://blog.superhuman.com/superhuman-is-built-for-speed/", "checked": "2026-11-21", "tags": ["latency", "keyboard"], "pins": [{"x": 23, "y": 26, "note": "Speed as the product's headline promise (2022)"}, {"x": 50, "y": 91, "note": "Every interaction under 100 ms; internal target <50 ms"}], "insight": "Superhuman treats 100 ms as a ceiling, buckets events into <50/<100/<1000 ms, keeps a local DB and prerenders likely next views.", "gitgud": "Claude's pick: steal the bucketed latency metric and prefetch the diff of the next commit in the list.", "track": "ux"}, {"id": "ux-zed-gpui", "file": "img/ux-zed-gpui.webp", "tool": "Zed", "title": "GPUI: rendering UI at 120 FPS", "source": "https://zed.dev/blog/videogame", "checked": "2026-11-21", "tags": ["performance", "rendering"], "pins": [{"x": 39, "y": 45, "note": "8.33 ms per frame at 120 Hz: state, layout, paint"}, {"x": 39, "y": 62, "note": "Atom/Electron: GC pause or relayout = missed frame"}, {"x": 39, "y": 95, "note": "Built own GPU UI framework to hit the budget"}], "insight": "Frame budget, not average speed, is what makes an app feel solid; web stacks lose frames to GC and DOM layout (source 2023).", "gitgud": "Claude's pick: gitgud runs in WebView2, so draw the graph on canvas from Rust-precomputed lanes and virtualize every list.", "track": "ux"}, {"id": "ux-linear-shortcuts-help", "file": "img/ux-linear-shortcuts-help.webp", "tool": "Linear", "title": "Searchable keyboard shortcut help on ?", "source": "https://linear.app/changelog/2021-03-25-keyboard-shortcuts-help", "checked": "2026-11-21", "tags": ["keyboard", "command-palette", "discoverability"], "pins": [{"x": 54, "y": 33, "note": "Shortcut sheet is itself searchable"}, {"x": 61, "y": 40, "note": "Cmd/Ctrl+K opens the command menu"}, {"x": 48, "y": 66, "note": "? opens help from anywhere"}], "insight": "Linear pairs a command menu that runs any action with a searchable shortcut sheet to convert mouse users to keys (source 2021).", "gitgud": "Claude's pick: Ctrl+K palette showing each command's shortcut, plus ? for a searchable keymap generated from the same keymap file.", "track": "ux"}, {"id": "ux-linear-redesign", "file": "img/ux-linear-redesign.webp", "tool": "Linear", "title": "2024 redesign: less noise, more density and hierarchy", "source": "https://linear.app/now/how-we-redesigned-the-linear-ui", "checked": "2026-11-21", "tags": ["density", "themes"], "pins": [{"x": 50, "y": 4, "note": "March 2024 redesign write-up"}, {"x": 50, "y": 56, "note": "Goal: reduce noise, increase hierarchy and density"}, {"x": 50, "y": 81, "note": "Sidebar, list and detail panels tightened"}], "insight": "Linear got denser by removing chrome, and generates every theme from base, accent and contrast in LCH.", "gitgud": "Claude's pick: few theme tokens in OKLCH with a contrast knob; hierarchy from type and contrast instead of borders.", "track": "ux"}, {"id": "ux-fluent-spacing", "file": "img/ux-fluent-spacing.webp", "tool": "Windows / Fluent", "title": "Windows content layout and spacing ramp", "source": "https://learn.microsoft.com/en-us/windows/apps/design/basics/content-basics", "checked": "2026-11-21", "tags": ["density", "desktop-conventions"], "pins": [{"x": 61, "y": 47, "note": "8 epx between related controls"}, {"x": 61, "y": 82, "note": "12 epx between content areas"}, {"x": 62, "y": 91, "note": "16 epx surface-to-edge text"}], "insight": "Windows groups UI by a small fixed spacing ramp; WinUI also offers a Compact density for pointer-driven, information-rich apps.", "gitgud": "Claude's pick: 4 px grid with the 8/12/16 ramp at Compact density, so gitgud feels at home on Windows while staying dense.", "track": "ux"}, {"id": "ux-tower-undo", "file": "img/ux-tower-undo.webp", "tool": "Tower", "title": "Undo anything with Ctrl+Z", "source": "https://www.git-tower.com/features/undo", "checked": "2026-11-21", "tags": ["undo", "safety"], "pins": [{"x": 50, "y": 23, "note": "Undo as a headline feature"}, {"x": 32, "y": 68, "note": "Standard Ctrl+Z, no special mode"}, {"x": 62, "y": 95, "note": "Covers delete, stage/unstage, discard chunk"}], "insight": "Tower maps the OS undo shortcut onto git: staging, discards, commits, branch ops, merges, interactive rebases and stashes.", "gitgud": "Claude's pick: same Ctrl+Z contract, backed by an op log so it survives restarts and covers discards.", "track": "ux"}, {"id": "ux-gitbutler-oplog", "file": "img/ux-gitbutler-oplog.webp", "tool": "GitButler", "title": "Operations history: snapshot before every action", "source": "https://docs.gitbutler.com/features/timeline", "checked": "2026-11-21", "tags": ["undo", "oplog", "safety"], "pins": [{"x": 50, "y": 30, "note": "Snapshots branch state, uncommitted work, conflicts into git ODB"}, {"x": 36, "y": 47, "note": "Each entry names the operation and time"}, {"x": 37, "y": 61, "note": "Even DiscardChanges is listed, so discards are recoverable"}, {"x": 50, "y": 88, "note": "Revert restores state to just before that op"}], "insight": "GitButler's oplog covers what reflog misses (working tree, conflict state) by snapshotting before each major action.", "gitgud": "Claude's pick: same model in gitgud-core under a private ref; the list is the visible undo history.", "track": "ux"}, {"id": "ux-jj-oplog", "file": "img/ux-jj-oplog.webp", "tool": "Jujutsu (jj)", "title": "Operation log: undo, revert, restore", "source": "https://docs.jj-vcs.dev/latest/operation-log/", "checked": "2026-11-21", "tags": ["undo", "oplog"], "pins": [{"x": 50, "y": 25, "note": "Every op stores a view: refs, heads, working-copy commit"}, {"x": 50, "y": 39, "note": "undo last, revert any op, restore whole repo"}, {"x": 50, "y": 96, "note": "--at-op: inspect the repo as it was"}], "insight": "jj makes the operation, not the commit, the unit of undo; any past state is viewable and restorable.", "gitgud": "Claude's pick: offer 'view repo at this op' (read-only graph) before restoring, which fixes the fear in P3.", "track": "ux"}, {"id": "ux-gitbutler-drag", "file": "img/ux-gitbutler-drag.webp", "tool": "GitButler", "title": "Commit editing by drag and drop", "source": "https://docs.gitbutler.com/features/branch-management/commits", "checked": "2026-11-21", "tags": ["direct-manipulation", "history-editing"], "pins": [{"x": 50, "y": 25, "note": "Replaces rebase -i: most edits are drag-and-drop"}, {"x": 88, "y": 19, "note": "Squash, split, move, undo commits"}, {"x": 40, "y": 57, "note": "Commit editor inline in the branch lane"}], "insight": "GitButler turns squash, reorder, amend-into and split into drags on the commit list, no rebase todo file.", "gitgud": "Claude's pick: steal the drags, add a hover preview of the result and a keyboard twin for each.", "track": "ux"}, {"id": "ux-lazygit-vision", "file": "img/ux-lazygit-vision.webp", "tool": "lazygit", "title": "Vision and design principles", "source": "https://github.com/jesseduffield/lazygit/blob/master/VISION.md", "checked": "2026-11-21", "tags": ["principles", "discoverability", "safety"], "pins": [{"x": 30, "y": 46, "note": "Seven principles; safety and simplicity win conflicts"}, {"x": 45, "y": 77, "note": "'YOU ARE HERE' marker while rebasing"}, {"x": 45, "y": 83, "note": "Toast only when the affected entity is off-screen"}, {"x": 40, "y": 85, "note": "Disabled keybinding explains why"}], "insight": "lazygit codifies discoverability, safety and speed: disable rather than hide, confirm only hard-to-reverse actions, respect git config.", "gitgud": "Claude's pick: adopt its tie-break (safety and simplicity first, power via palette and keys) as gitgud's own.", "track": "ux"}, {"id": "ux-nng-confirmation", "file": "img/ux-nng-confirmation.webp", "tool": "Nielsen Norman Group", "title": "Confirmation dialogs: only when not overused", "source": "https://www.nngroup.com/articles/confirmation-dialog/", "checked": "2026-11-21", "tags": ["safety", "dialogs"], "pins": [{"x": 35, "y": 16, "note": "Overused warnings get clicked through"}, {"x": 37, "y": 74, "note": "Good: dialog names the exact file and its details"}, {"x": 33, "y": 97, "note": "Weak: '2 items', generic Yes/No"}], "insight": "Confirm only serious, irreversible actions; restate the target; label buttons by outcome; prefer undo where possible.", "gitgud": "Claude's pick: confirm only force-push and remote deletes, naming branch, remote and commits lost.", "track": "ux"}], "tracks": {"gui": "Git GUIs", "handson": "Hands-on", "gamedev": "Game dev", "workflows": "Workflows & agents", "ux": "UX"}};
const view = document.getElementById('view');
const tabs = document.getElementById('tabs');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let shotFilter = { q: '', track: '', tag: '' };

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

/* theme toggle */
const themeBtn = document.getElementById('themebtn');
function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); themeBtn.textContent = t ? t : 'system'; }
applyTheme(store('gg-theme') || '');
themeBtn.onclick = () => { const order = ['', 'light', 'dark']; const cur = document.documentElement.getAttribute('data-theme') || ''; const next = order[(order.indexOf(cur) + 1) % 3]; store('gg-theme', next); applyTheme(next); };

tabs.innerHTML = DATA.nav.map(([k, l]) => `<a href="#${k}" data-k="${k}">${esc(l)}</a>`).join('');

function labelize(html) {
  return html
    .replace(/(`?)(Claude's pick|Claude’s pick)\1/g, '<span class="tag t-pick">Claude\'s pick</span>')
    .replace(/<code>(fact|open|proposal)<\/code>/g, (m, w) => `<span class="tag ${w === 'fact' ? 't-fact' : 't-open'}">${w}</span>`)
    .replace(/<strong>(fact|open)\.?<\/strong>/g, (m, w) => `<span class="tag ${w === 'fact' ? 't-fact' : 't-open'}">${w}</span>`)
    .replace(/⚠/g, '<span class="tag t-warn">⚠</span>');
}

function pinsHtml(s, big) {
  return (s.pins || []).map((p, i) => `<span class="pin" data-i="${i}" style="left:${p.x}%;top:${p.y}%">${i + 1}</span>`).join('');
}

function shotCard(s, i) {
  return `<button class="card" type="button" data-shot="${i}">
    <div class="shot"><div class="pinwrap"><img loading="lazy" src="${esc(s.file)}" alt="${esc(s.title)}">${pinsHtml(s)}</div></div>
    <div class="meta"><div class="tool"><span>${esc(s.tool)}</span><span>${esc(DATA.tracks[s.track])}</span></div>
    <h3>${esc(s.title)}</h3><p>${esc(s.insight)}</p></div></button>`;
}

function matches(s) {
  const f = shotFilter;
  if (f.track && s.track !== f.track) return false;
  if (f.tag && !(s.tags || []).includes(f.tag)) return false;
  if (f.q) {
    const hay = [s.title, s.tool, s.insight, s.gitgud, (s.tags || []).join(' '), (s.pins || []).map(p => p.note).join(' ')].join(' ').toLowerCase();
    return f.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
  }
  return true;
}

function renderShots() {
  const tagCount = {};
  DATA.shots.forEach(s => (s.tags || []).forEach(t => tagCount[t] = (tagCount[t] || 0) + 1));
  const topTags = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 14).map(([t]) => t);
  view.innerHTML = `<div class="section-h" style="margin-top:0"><h2>Annotated screenshots</h2><span class="eyebrow">click a card for pinned notes</span></div>
  <div class="filters">
    <input id="shotq" type="search" placeholder="Search notes: lfs, undo, rebase, prefab…" value="${esc(shotFilter.q)}" aria-label="Search screenshots">
    <button class="chip" type="button" data-track="" aria-pressed="${!shotFilter.track}">All tracks</button>
    ${Object.entries(DATA.tracks).map(([k, l]) => `<button class="chip" type="button" data-track="${k}" aria-pressed="${shotFilter.track === k}">${esc(l)}</button>`).join('')}
    <span class="sep"></span>
    ${topTags.map(t => `<button class="chip" type="button" data-tag="${esc(t)}" aria-pressed="${shotFilter.tag === t}">#${esc(t)}</button>`).join('')}
    <span class="count" id="shotcount"></span>
  </div>
  <div class="grid" id="shotgrid"></div>`;
  const draw = () => {
    const list = DATA.shots.map((s, i) => [s, i]).filter(([s]) => matches(s));
    document.getElementById('shotgrid').innerHTML = list.length ? list.map(([s, i]) => shotCard(s, i)).join('') : '<div class="empty">No screenshot matches. Clear the search or pick another track.</div>';
    document.getElementById('shotcount').textContent = `${list.length} / ${DATA.shots.length}`;
  };
  draw();
  const q = document.getElementById('shotq');
  q.oninput = () => { shotFilter.q = q.value; draw(); };
  view.querySelectorAll('[data-track]').forEach(b => b.onclick = () => { shotFilter.track = b.dataset.track; renderShots(); });
  view.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { shotFilter.tag = shotFilter.tag === b.dataset.tag ? '' : b.dataset.tag; renderShots(); });
}

let sheetEl = null;
function openShot(i) {
  const s = DATA.shots[i];
  if (!s) return;
  closeShot();
  const visible = DATA.shots.map((x, j) => j).filter(j => matches(DATA.shots[j]));
  const order = visible.includes(i) ? visible : DATA.shots.map((x, j) => j);
  const pos = order.indexOf(i);
  sheetEl = document.createElement('div');
  sheetEl.className = 'sheet';
  sheetEl.setAttribute('role', 'dialog');
  sheetEl.setAttribute('aria-modal', 'true');
  sheetEl.setAttribute('aria-label', s.title);
  sheetEl.innerHTML = `<div class="box">
    <div class="left"><div class="pinwrap"><img src="${esc(s.file)}" alt="${esc(s.title)}">${pinsHtml(s, true)}</div></div>
    <div class="right">
      <div class="eyebrow">${esc(s.tool)} · ${esc(DATA.tracks[s.track])}</div>
      <h2>${esc(s.title)}</h2>
      <ol>${(s.pins || []).map((p, k) => `<li data-i="${k}"><i>${k + 1}</i><span>${esc(p.note)}</span></li>`).join('')}</ol>
      <div class="callout ins"><b>Insight</b>${esc(s.insight)}</div>
      <div class="callout gg"><b>For gitgud</b>${esc(s.gitgud)}</div>
      <div class="src">Source: <a href="${esc(s.source)}" target="_blank" rel="noopener">${esc(s.source)}</a><br>checked ${esc(s.checked)}${(s.tags || []).length ? ' · #' + s.tags.map(esc).join(' #') : ''}</div>
      <div class="nav"><button class="btn" type="button" data-go="${order[(pos - 1 + order.length) % order.length]}">← Prev</button><button class="btn" type="button" data-go="${order[(pos + 1) % order.length]}">Next →</button><button class="btn" type="button" data-close style="margin-left:auto">Close (Esc)</button></div>
    </div></div>`;
  document.body.appendChild(sheetEl);
  document.body.style.overflow = 'hidden';
  const pins = sheetEl.querySelectorAll('.left .pin');
  sheetEl.querySelectorAll('ol li').forEach(li => {
    li.onmouseenter = () => pins[li.dataset.i]?.classList.add('hot');
    li.onmouseleave = () => pins[li.dataset.i]?.classList.remove('hot');
  });
  sheetEl.onclick = e => {
    if (e.target === sheetEl || e.target.closest('[data-close]')) closeShot();
    const go = e.target.closest('[data-go]');
    if (go) openShot(+go.dataset.go);
  };
  sheetEl.querySelector('[data-close]').focus();
}
function closeShot() { if (sheetEl) { sheetEl.remove(); sheetEl = null; document.body.style.overflow = ''; } }
document.addEventListener('keydown', e => {
  if (!sheetEl) return;
  if (e.key === 'Escape') closeShot();
  if (e.key === 'ArrowRight') sheetEl.querySelectorAll('[data-go]')[1].click();
  if (e.key === 'ArrowLeft') sheetEl.querySelectorAll('[data-go]')[0].click();
});
view.addEventListener('click', e => {
  const c = e.target.closest('[data-shot]');
  if (c) openShot(+c.dataset.shot);
  const q = e.target.closest('a[data-q]');
  if (q) { shotFilter = { q: q.dataset.q, track: '', tag: '' }; }
});

const DOC_TRACK = { landscape: 'gui', handson: 'handson', gamedev: 'gamedev', workflows: 'workflows', agents: 'workflows', ux: 'ux' };
const DOC_FILES = { 'landscape.md': 'landscape', 'handson.md': 'handson', 'gamedev.md': 'gamedev', 'workflows.md': 'workflows', 'agents.md': 'agents', 'ux-principles.md': 'ux', 'spikes.md': 'spikes', 'open-questions.md': 'questions' };

function renderDoc(k) {
  const md = DATA.docs[k];
  if (!md) { view.innerHTML = '<div class="empty">This document has not been written yet.</div>'; return; }
  let html = labelize(marked.parse(md, { gfm: true }));
  const holder = document.createElement('div');
  holder.innerHTML = html;
  holder.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t); });
  holder.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    const local = h.replace(/^\.?\/?(research\/)?/, '').split('#')[0];
    if (DOC_FILES[local]) a.setAttribute('href', '#' + DOC_FILES[local]);
    else if (/^https?:/.test(h)) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  const heads = [...holder.querySelectorAll('h2, h3')];
  heads.forEach((h, i) => h.id = 'h-' + i);
  const tr = DOC_TRACK[k];
  const related = tr ? DATA.shots.map((s, i) => [s, i]).filter(([s]) => s.track === tr) : [];
  view.innerHTML = `<div class="doc"><nav class="toc" aria-label="Contents">${heads.map(h => `<a class="${h.tagName.toLowerCase()}" href="javascript:void 0" data-h="${h.id}">${esc(h.textContent)}</a>`).join('')}</nav>
    <article class="md">${related.length ? `<div class="docshots"><span class="eyebrow">Screenshots for this track</span><a class="chip" href="#shots" data-track-link="${tr}">${related.length} annotated →</a></div>` : ''}${holder.innerHTML}</article></div>`;
  view.querySelectorAll('[data-h]').forEach(a => a.onclick = () => document.getElementById(a.dataset.h).scrollIntoView({ behavior: 'smooth', block: 'start' }));
  view.querySelectorAll('[data-track-link]').forEach(a => a.onclick = () => { shotFilter = { q: '', track: a.dataset.trackLink, tag: '' }; });
}

function route() {
  closeShot();
  let k = (location.hash || '#overview').slice(1);
  if (!DATA.nav.some(([n]) => n === k)) k = 'overview';
  tabs.querySelectorAll('a').forEach(a => { if (a.dataset.k === k) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (k === 'overview') view.innerHTML = document.getElementById('overview-tpl').innerHTML;
  else if (k === 'shots') renderShots();
  else renderDoc(k);
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
