<template id="overview-tpl">
  <section class="hero">
    <div>
      <div class="eyebrow">Research plan §1–4 · status: research and spikes done, spec not started</div>
      <h1>What today's Git clients do, where they fail game devs, and where gitgud can win</h1>
      <p>Four research tracks: Git GUIs, game-dev version control, developer and agent workflows, and UX for dense pro tools, plus a hands-on round in Fork, Sublime Merge and GitButler. Every claim in the docs is linked and was checked on 2026-11-21. Labels: <span class="tag t-fact">fact</span> sourced, <span class="tag t-pick">Claude's pick</span> a recommendation, <span class="tag t-open">open</span> unverified or yours to decide. Nothing here is decided beyond section 0 of the plan.</p>
    </div>
    <div class="stats">
      <div class="stat"><b>77</b><span>annotated screenshots</span></div>
      <div class="stat"><b>30+</b><span>tools surveyed</span></div>
      <div class="stat"><b>19/19</b><span>questions answered</span></div>
    </div>
  </section>

  <div class="section-h"><h2>Max's four pains, and what the research says</h2><span class="eyebrow">from plan §0.6</span></div>
  <div class="pains">
    <article class="pain" style="color:var(--lane1)">
      <header><span class="lane"></span><h3 style="color:var(--fg)">P1 · Slow on big / LFS repos</h3></header>
      <div class="now">Sourcetree today</div>
      <ul style="color:var(--fg)">
        <li>Sourcetree on Windows runs LFS one file at a time during clone, and its bundled git-lfs pins the CPU while staging. <span class="tag t-fact">fact</span></li>
        <li>Batched, background <code>git lfs</code> calls and status read through <code>gix</code> without smudging fix most of it. <span class="tag t-pick">Claude's pick</span></li>
        <li>Git 2.49–2.56 added <code>backfill</code>, <code>last-modified</code> and fsmonitor on Linux. gitgud can turn on maintenance and commit-graph when a repo is first opened. <span class="tag t-pick">Claude's pick</span></li>
      </ul>
      <div class="see"><a class="chip" href="#shots" data-q="lfs">LFS shots</a><a class="chip" href="#workflows">W7 monorepo</a></div>
    </article>
    <article class="pain" style="color:var(--lane2)">
      <header><span class="lane"></span><h3 style="color:var(--fg)">P2 · Unity merge conflicts</h3></header>
      <div class="now">mergetool by hand</div>
      <ul style="color:var(--fg)">
        <li>Unity documents UnityYAMLMerge only as a manual <code>git mergetool</code>. It handles <code>.unity</code>, <code>.prefab</code> and <code>.meta</code>, and has known silent-merge bugs on prefab variants. <span class="tag t-fact">fact</span></li>
        <li>Unity 6.3's editor VCS integration covers Perforce and UVCS. Git gets nothing. <span class="tag t-fact">fact</span></li>
        <li>Plan: register Smart Merge as a merge driver automatically, open a per-file mine/theirs list first, and show a structural prefab diff instead of raw YAML. <span class="tag t-pick">Claude's pick</span></li>
      </ul>
      <div class="see"><a class="chip" href="#shots" data-q="unity">Unity shots</a><a class="chip" href="#gamedev">gamedev §3.3</a></div>
    </article>
    <article class="pain" style="color:var(--lane3)">
      <header><span class="lane"></span><h3 style="color:var(--fg)">P3 · Scary history edits</h3></header>
      <div class="now">reflog or nothing</div>
      <ul style="color:var(--fg)">
        <li>Of the mainstream GUIs, only Tower and GitButler have real multi-step undo. GitKraken undoes only the last action, and lazygit's reflog undo skips the working tree and stashes. <span class="tag t-fact">fact</span></li>
        <li>Git 2.54–2.56 shipped an experimental <code>git history</code> command (reword, split, fixup, drop) that refuses to run if a conflict would result. <span class="tag t-fact">fact</span></li>
        <li>Plan: an op log that snapshots refs, the index and the working tree before every action, behind Ctrl+Z, with a preview of the resulting graph. <span class="tag t-pick">Claude's pick</span></li>
      </ul>
      <div class="see"><a class="chip" href="#shots" data-q="undo">Undo shots</a><a class="chip" href="#ux">UX principles</a></div>
    </article>
    <article class="pain" style="color:var(--lane4)">
      <header><span class="lane"></span><h3 style="color:var(--fg)">P4 · Clunky UI / workflow</h3></header>
      <div class="now">click-heavy, no locks</div>
      <ul style="color:var(--fg)">
        <li>No Git GUI makes LFS locking usable. Unlock-after-push has been an open git-lfs issue since 2017. <span class="tag t-fact">fact</span></li>
        <li>Fork's most-reacted request is keyboard shortcuts, open since 2019. <span class="tag t-fact">fact</span></li>
        <li>Plan: a Ctrl+K palette, single-key verbs, hunk staging with "stage and next", and a lock panel with an unlock-on-push checklist. <span class="tag t-pick">Claude's pick</span></li>
      </ul>
      <div class="see"><a class="chip" href="#shots" data-q="lock">Locking shots</a><a class="chip" href="#landscape">Steal list</a></div>
    </article>
  </div>

  <div class="section-h"><h2>Biggest findings</h2><span class="eyebrow">verified spot-checks</span></div>
  <div class="findings">
    <div class="finding"><h3>Game devs below AAA use Git, and their tools ignore them</h3><p>In the JetBrains 2025 game-dev survey, <b>61% of mid-size/indie</b> respondents use GitHub, against <b>10%</b> for Perforce and 9% for Unity VCS. Even so, Unity 6.3 integrates only Perforce and UVCS, and no Git GUI handles locks well.</p></div>
    <div class="finding"><h3>Locking is the gap nobody closes</h3><p>The LFS lock API is complete (<code>--json</code>, ours/theirs verify), but Sourcetree has no lock support, GitKraken only has a feature request, and Fork has a manual list. Anchorpoint built its own lock server instead, and is now <b>moving to Epic's Lore and dropping Git</b>, which leaves the Unity + Git niche open.</p></div>
    <div class="finding"><h3>Multi-step undo is rare, and it is the fix for "scary"</h3><p>Tower has Ctrl+Z across actions. GitButler snapshots the working tree, index and conflicts into the git object store before each action. jj has an op log. Every other tool undoes one step at most, or only what the reflog covers.</p></div>
    <div class="finding"><h3>Agents are now a first-class git user</h3><p>Agents start <b>over 40% of GitHub PRs</b> (Octoverse, Sept 2026). The official git MCP server commits straight to the branch, can only add whole files, and turns off hooks and repo merge drivers. <b>No server found has a human approval step.</b> GitButler's <code>but</code> CLI (hunk IDs, op log) comes closest.</p></div>
    <div class="finding"><h3>The stack is validated by peers</h3><p>GG (a jj GUI) uses Tauri, Rust and Svelte and ships op-log undo. GitComet uses Rust and <code>gix</code> on GPUI. The old prototype's <code>git2</code> shortcuts each turned into a missing feature: pull was fast-forward only, hooks never ran, and your token was saved in plain text. That supports reads through <code>gix</code> and writes through the <code>git</code> CLI.</p></div>
    <div class="finding"><h3>The name is taken</h3><p><code>zeuros/gitgud</code>, an open-source Git GUI "with undo for any action", was a Show HN on 2026-10-17. Its pitch overlaps exactly. Max's call (Q1, 2026-11-21): keep the name gitgud anyway.</p></div>
  </div>

  <div class="section-h"><h2>Where gitgud can win</h2><span class="eyebrow"><span class="tag t-pick">Claude's pick</span> positioning hypotheses</span></div>
  <div class="win">
    <div><h3>The best Git client for Unity</h3><p>LFS locks as a first-class panel (owner on every file row, a warning before you edit a locked file, an unlock-on-push checklist), a <code>.meta</code> guard that treats an asset and its meta as one unit, Smart Merge set up automatically, and lazy texture previews. No new VCS and no extra server: plain LFS on any host.</p></div>
    <div><h3>Every action undoable</h3><p>An op log under a private ref, behind Ctrl+Z, covering discards, stashes, rebases and branch deletes. Each history edit shows the resulting graph before it runs. Confirm dialogs only for what can't be undone, such as a force push.</p></div>
    <div><h3>Agents propose, you approve</h3><p>A CLI and MCP server built on the same core. Agents call <code>propose(hunks, message, why)</code>, and the result becomes a draft under <code>refs/gitgud/proposals/</code> with risk flags (LFS, <code>.meta</code> pairs, unlocked lockable files). You review it in an inbox. Approving commits through the <code>git</code> CLI, so hooks and signing run.</p></div>
  </div>

  <div class="section-h"><h2>Challenges to section 0 and the stack</h2><span class="eyebrow">push-back</span></div>
  <div class="challenges">
    <div><b>Binary previews (§0.4)</b><span>Texture previews are cheap. Rendered prefab previews mean rendering scenes or resolving GUIDs across the project, which is <b>weeks of work, not days</b>. My pick: textures plus a structural diff that lists changed objects in the MVP, thumbnails later. <span class="tag t-pick">Claude's pick</span></span></div>
    <div><b>Stack</b><span>No change, now measured. WebView2's engine held 100 fps scrolling 349k commits with a canvas graph, and <code>gix</code> walks the whole graph in 106 ms. It comes with two rules: cap rename detection (13× slower than git), and refresh the index after a mass touch, because <code>gix</code> status re-hashes LFS files on every call otherwise. <span class="tag t-fact">fact</span></span></div>
    <div><b>Host APIs (§0.3)</b><span>GitHub stacked PRs went GA on 2026-10-06. Opening the right base branch for each level works through browser URLs, so "no in-app PR APIs" holds. <span class="tag t-fact">fact</span></span></div>
    <div><b>Spikes</b><span>All seven are done (<a href="#spikes">Spikes</a>). UnityYAMLMerge works as an automatic merge driver only with <code>--force</code>. It merged 3 of 5 prefab conflicts that plain git couldn't, and <b>silently dropped one side</b> in a prefab-variant case, so gitgud needs a check after every merge. The agent proposal flow worked end to end over MCP. Your Git (2.45.1) breaks LFS clones: upgrade (Q15). The hands-on round (<a href="#handson">Hands-on</a>) found that only GitButler can recover a discard, that GitButler bypasses LFS filters, and that none of Fork, Sublime Merge or GitButler offers UnityYAMLMerge.</span></div>
  </div>

tible API, conventional-commit helper [SG1].\n- **Complaints:** maintainer asking for volunteers (#2722, 47 👍), no auto-updater, can't edit text in\n  the merge window (#2168), no custom shortcuts (#2655), no uncommitted/stash nodes in graph (#1673);\n  status checks of unopened repos saturate HDD on Linux (#2891) [SG3].\n- Sources: [SG1 README](https://github.com/sourcegit-org/sourcegit) · [SG3 issues](https://github.com/sourcegit-org/sourcegit/issues/2722)\n\n### GitButler\n- **Model:** **parallel (virtual) branches** — all applied branches live in one working dir; Git sees\n  a synthetic merge commit on `gitbutler/workspace`; you choose which branch each hunk goes to;\n  `but unapply` hides a branch [GB1]. **Stacked branches** for dependent work [GB1], [GB6].\n- **Licence/price:** FSL-1.1-MIT (fair source, converts to MIT later) [GB4]; free app; [$17M Series A, Apr\n  2026](https://blog.gitbutler.com/series-a). Stack: Rust + Tauri + Svelte (repo languages) [M1]. Desktop + `but` CLI + TUI on one state [GB1].\n- **Undo:** operations history — snapshot of branch state, uncommitted work and conflict state stored in\n  the Git object DB **before every major action**; hover an entry → Revert; file snapshots viewable [GB3].\n- **Conflicts:** rebase never stops: conflicted commits are stored as \"conflicted\", marked in UI,\n  resolved later one at a time in an edit mode that checks out only that commit [GB2].\n- **Agents:** positioned as \"Version Control for your Agents\"; `but agent setup` installs a Claude Code\n  skill; `but commit <file/hunk ids>`, `but amend`, `but squash`, `but uncommit`, `but oplog`, `but pr`;\n  each agent commits to its own branch, stacking when dependent; vendor claims 60 % faster / 80 % fewer\n  tool calls than vanilla git (vcbench) [GB6].\n- **Gaps (👍):** line-level moves 51, **Git LFS 38 (open since 2024-02)**, VS Code extension 37, Azure\n  DevOps 32, revert commits 17, worktrees/bare repos 15 [GB5]. `fact`: no LFS = unusable for Max's\n  Unity repos today.\n- Sources: [GB1 docs](https://docs.gitbutler.com/), [parallel branches](https://docs.gitbutler.com/parallel-branches) · [GB2 conflicts](https://docs.gitbutler.com/features/branch-management/merging) · [GB3 timeline](https://docs.gitbutler.com/features/timeline) · [GB4 LICENSE](https://github.com/gitbutlerapp/gitbutler/blob/master/LICENSE.md) · [GB5 issues](https://github.com/gitbutlerapp/gitbutler/issues/2595) · [GB6 agents](https://docs.gitbutler.com/ai-agents/overview), [home](https://gitbutler.com/)\n\n### SmartGit\n- **Model:** classic; three window styles (Standard workflow-oriented, Log graph, Working Tree\n  file-oriented) chosen at setup [SmG2].\n- **Price:** commercial from $5/user/mo or perpetual; free Hobby / Education / Open-Source licences [SmG3].\n- **Stack:** Java/SWT (long-standing; not stated on the new site, `open`). Win/Mac/Linux [SmG1].\n- **Mechanics:** Conflict Solver (side-by-side 3-way, one-click take left/right), split/squash/reorder\n  (\"Clean commits\"), guided Git Flow / GitHub Flow, Distributed Reviews add-on (offline review), LFS\n  with faster refresh in 25.1 [SmG1], [SmG2]. An agent-branch screenshot names Claude Code; no AI\n  feature text [SmG1].\n- Sources: [SmG1 home](https://www.smartgit.dev/) · [SmG2 features](https://www.smartgit.dev/features/) · [SmG3 pricing](https://www.smartgit.dev/pricing/)\n\n### Sourcetree (baseline Max uses)\n- **Model:** classic. Free, Atlassian, Bitbucket-flavoured; Win 3.4.x / Mac 4.2.x [ST1]. Git + Hg.\n- **Status:** maintenance mode in practice: 2025–26 Windows releases are mostly fixes (3.4.25 Git 2.51\n  + LFS 3.7; 3.4.27 shortcuts for custom actions, branch filter; 3.4.28 expired signing cert; 3.4.29\n  \"stuck loading commits\"; 3.4.30 history not refreshing) [ST2].\n- **Perf (Max's pain 1):** long record of Windows slowness: per-file LFS operations during clone vs one\n  batched `git lfs fetch` on Mac; staging hangs while embedded git-lfs.exe pegs CPU (SRCTREEWIN-6667);\n  2025 clone stalls on 3.4.25; a Windows 11 update hang [ST3].\n- **Praise:** still loved for \"pleasant\" everyday use (top HN comment in a 2025 lazygit thread) [F4].\n- Sources: [ST1 home](https://www.sourcetreeapp.com/) · [ST2 3.4.30 notes](https://product-downloads.atlassian.com/software/sourcetree/windows/ga/ReleaseNotes_3.4.30.html), [3.4.27](https://product-downloads.atlassian.com/software/sourcetree/windows/ga/ReleaseNotes_3.4.27.html) · [ST3 SRCTREEWIN-6667](https://jira.atlassian.com/browse/SRCTREEWIN-6667), [LFS clone thread](https://community.atlassian.com/t5/Sourcetree-questions/Clone-for-large-LFS-project-very-slow-on-windows/qaq-p/681959) (older), [2025 clone thread](https://community.atlassian.com/forums/Sourcetree-questions/Cloning-a-fresh-repo-taking-a-long-time/qaq-p/3115353), [KB5064401 hang](https://jira.atlassian.com/browse/SRCTREEWIN-14595)\n\n### lazygit\n- **Model:** TUI, numbered panels (Status/Files/Branches/Commits/Stash), single-key actions, command log\n  panel. Go, MIT, 84k ★, v0.66.3 [L1]. Founder handed over to co-maintainer Stefan Haller, June 2025 [L2].\n- **Mechanics:** `space` stages hunk, `a` line mode, `v` range; `i` interactive rebase with\n  s/f/d/e and ctrl+j/k moves, also on single commits without starting a rebase; **custom patches**\n  (pick hunks out of an old commit → move to new commit); `z`/`Z` undo/redo via reflog (not working\n  tree or stash); `/` filter everywhere; bisect; worktrees; custom command keybindings [L1].\n- **Wants (👍):** full-screen diff 44, stacked PRs 43 (#2527), git-based log search 41, GPG flow 39 [L2].\n  HN: praised for fast everyday git-fu; a tip to disable force-push because it is easy to fat-finger [F4].\n- Sources: [L1 README](https://github.com/jesseduffield/lazygit) · [L2 issues](https://github.com/jesseduffield/lazygit/issues/4655), [#2527](https://github.com/jesseduffield/lazygit/issues/2527)\n\n### Magit\n- **Model:** Emacs text UI where \"every bit of visible information is also actionable\"; auto-refresh;\n  shows the git commands it runs; transient (popup) menus with mnemonic keys [M2]. GPL, 7.3k ★.\n- Benchmark for discoverable keyboard menus, not a competitor for Max.\n- Sources: [M2 magit.vc](https://magit.vc/) · M1\n\n### VS Code built-in (+ GitLens)\n- Line staging, Source Control Graph (incoming/outgoing), 3-way merge editor, worktrees, stashes,\n  timeline (git + local saves), blame [VSC1]. Merge editor: Incoming / Current / **Result** panes,\n  per-conflict \"Accept Incoming / Accept Combination\", \"N conflicts remaining\", Complete Merge;\n  experimental AI conflict resolution [VSC2]. No interactive-rebase UI (CLI).\n- GitLens (GitKraken-owned, ~10k ★) adds graph/blame; free with Copilot for AI, GitKraken account for\n  its own AI [GK6].\n- HN: \"fast enough for common workflows\" sentiment; abandoned \"Git Graph\" extension missed [F4], [HN 45645120](https://news.ycombinator.com/item?id=45645120).\n- Sources: [VSC1 overview](https://code.visualstudio.com/docs/sourcecontrol/overview) · [VSC2 merge conflicts](https://code.visualstudio.com/docs/sourcecontrol/merge-conflicts)\n\n### JetBrains IDEs (built-in git)\n- Changelists, Shelf, Git log graph, worktrees, GPG signing [JB1]. History edits from the log: reword,\n  amend, fixup, squash-into, squash commits, drop, **extract selected changes to a separate commit** [JB2].\n- **Local History:** IDE-side snapshots of every file edit (also external changes), labels on test\n  runs/commits, 5 working days default, restores deleted files [JB3].\n- **Conflicts:** dialog lists all conflicted files with **Accept Yours / Accept Theirs per file**,\n  \"Resolve All Simple Conflicts\", then a 3-pane editor (yours | result from base | theirs) [JB4].\n  Unity devs on Rider get this UI; whether it calls UnityYAMLMerge is track B's question.\n- Sources: [JB1 git docs](https://www.jetbrains.com/help/idea/using-git-integration.html) · [JB2 edit history](https://www.jetbrains.com/help/idea/edit-project-history.html) · [JB3 Local History](https://www.jetbrains.com/help/idea/local-history.html) · [JB4 resolve conflicts](https://www.jetbrains.com/help/idea/resolve-conflicts.html)\n\n### Newcomers 2025–26\n| Tool | What | Why it matters to gitgud | Source |\n|---|---|---|---|\n| **GitComet** (Jan 2026) | Rust + GPUI, **uses `gix`**, AGPL free + paid Pro (PR review, forges, AI). Claims responsiveness on Chromium-size repos (no numbers). **LFS status, download, locks, tracking** + git-annex; 2/3-way merge usable as `git mergetool`; worktrees, embedded terminal | Closest open-source peer to gitgud's stack and game-dev wish list; watch for LFS locking UX | [GitHub](https://github.com/Auto-Explore/GitComet) |\n| **GG** (jj GUI) | **Tauri + Rust + Svelte** (same stack as gitgud), Apache-2.0. Drag revisions to rebase, drag files to squash, drag bookmarks; op-log Undo button; `gg web` mode. \"What if you were always in the middle of an interactive rebase\" | Proof the stack works; mechanics map to pain 3 | [GitHub](https://github.com/gulbanana/gg) |\n| jjui / lazyjj | TUIs for jj, 2.2k / 1.2k ★ | jj ideas (op log, conflicts as data) spreading | [HN 44093334](https://news.ycombinator.com/item?id=44093334) |\n| Zed git panel | Hunk staging with \"stage and next\", Uncommit (soft reset), AI commit message with own model + instructions, per-conflict keep ours/theirs/both | Editor built-ins keep rising | [Zed docs](https://zed.dev/docs/git) |\n| Graphite | Stacked-PR CLI/service, bought by Cursor Dec 2025 | Stacks are mainstream; gitgud stays host-agnostic | [TechCrunch](https://techcrunch.com/2025/12/19/cursor-continues-acquisition-spree-with-graphite-deal) |\n| Tauri hobby clients (Gitnado/Leviathan, GitLite, Gitmun, l8git, ArezGit) | Many tiny 2025–26 Tauri git GUIs, <50 ★ each | Crowded \"fast Tauri git GUI\" niche; gitgud's edge must be game-dev + agents, not speed alone `Claude's pick` | [Gitnado](https://github.com/hegsie/Leviathan), [search](https://github.com/cst8t/gitmun) |\n| Gitnuro, Gittyup, Git Extensions | Kotlin Compose / Qt / WinForms OSS clients, 2–9k ★ | Steady but not growing | GitHub API |\n\n## 4. Steal this mechanic\n\nRanked by fit with Max's section-0 answers (game-dev, Windows, any host, opt-in AI + agent review).\nPains: **P1** slow big/LFS · **P2** Unity merge conflicts · **P3** scary history edits · **P4** clunky UI.\nAll rankings `Claude's pick`.\n\n| # | Mechanic | From | Why | Pains |\n|---|---|---|---|---|\n| 1 | **Snapshot op log before every mutating action** (refs + index + working tree + conflict state into the git ODB), list with per-entry Revert | GitButler [GB3], GG/jj | Makes every action reversible, including discards; pure git, no extra store | P3 |\n| 2 | **Global Ctrl+Z / Ctrl+Shift+Z** over that log, scoped to stage/discard/commit/branch/merge/rebase/stash | Tower [T2] (GitKraken only does the last action [GK2]) | Muscle memory beats a history panel for the common case | P3, P4 |\n| 3 | **Per-file \"take mine / take theirs\" conflict list + \"resolve all simple\"** before any text merge | JetBrains [JB4] | For prefabs, scenes and binaries the honest answer is usually whole-file; Unity YAML smart-merge plugs in here (track B) | P2 |\n| 4 | **Rebase that doesn't stop**: conflicted commits recorded and resolved later one by one | GitButler [GB2], jj | Removes the \"stuck mid-rebase\" fear; Fork's **conflict preview before rebasing** [F2] is the cheap first step | P2, P3 |\n| 5 | **LFS as first-class**: lock/unlock from the file list, lock owner shown, LFS badge per file, batched background `git lfs` (never per-file) | GitComet [GC1], Fork [F3]; anti-pattern Sourcetree [ST3] | Locks prevent unmergeable asset conflicts; batching is exactly Max's Sourcetree slowness | P1, P2 |\n| 6 | **Drag to rewrite** (commit onto commit = squash, Alt = fixup; drag to reorder; drag commit to HEAD = cherry-pick) with a confirm that says how to undo | Tower [T3], GG, Fork 2.55 [F2] | Direct manipulation for history edits, made safe by #1–2 | P3, P4 |\n| 7 | **Agent work as reviewable units**: each agent's changes as its own branch/WIP node, commit by hunk IDs, range diff, revert hunk, drop session | GitButler `but` [GB6], GitKraken agents [GK5] | Direct template for gitgud's CLI/MCP + review screen (track C) | answer 5, P4 |\n| 8 | **AI through the user's already-installed agent CLI** (Claude Code/Codex) instead of API keys | Fork 2.59–2.70 [F2] | Opt-in, no key management, no vendor lock | answer 5 |\n| 9 | **Command palette + single-key verbs + visible command log** | Fork Quick Launch [F3], Sublime Merge [SM1], lazygit [L1], Magit [M2] | Speed plus trust: you see the exact git command run | P4, P3 |\n| 10 | **Hunk/line staging with \"stage and next\"**, custom patch (lift hunks out of an old commit) | Zed, lazygit [L1], Sublime Merge [SM1] | Fast commit composition; lazygit's custom patch replaces most interactive rebases | P4, P3 |\n| 11 | **Uncommitted changes and stashes as nodes in the graph** | GitKraken [GK1], GitComet; top request in Fork (#308) and SourceGit (#1673) | Where you are, at a glance | P4 |\n| 12 | **Image diff modes** (side-by-side / swipe / onion-skin) extended to textures | SourceGit [SG1], Fork [F3] | Base for game-asset previews (answer 4) | P2, P4 |\n| 13 | **Extract selected changes to a new commit** from the log | JetBrains [JB2] | Splitting commits without an interactive rebase | P3 |\n| 14 | **Custom actions with shortcuts** | lazygit [L1], SourceGit [SG1], Sourcetree 3.4.27 [ST2] | Escape hatch for Unity-specific scripts | P4 |\n\nAvoid (`Claude's pick`): GitKraken-style account wall and AI-credit tiers; GitButler's single-folder\nvirtual-branch model as the default (no LFS, confuses other tools; good ideas, wrong base for Unity\nrepos); Electron footprint for a tool that sits open all day.\n\n## Game-dev tools\n\nSummary of [gamedev.md](gamedev.md) (track B, links checked 2026-11-21).\n\n- **Git is the game-dev default below AAA** (fact): GitHub used by 61% of mid/indie and 79% of hobbyist\n  respondents; Perforce 45% at AAA but 10% mid/indie; Unity VCS 9% / 7%\n  ([JetBrains 2025](https://lp.jetbrains.com/the-state-of-gamedev-2025/)).\n- **Anchorpoint**: Git client for game teams: auto-lock, previews, Unity plugin, but its own lock server rather\n  than LFS locks ([docs](https://docs.anchorpoint.app/git/file-locking/)); now rewriting as a **Lore** client and\n  dropping Git for now ([docs](https://docs.anchorpoint.app/lore/quick-start/)) (fact).\n- **Unity VCS (Plastic)**: smart locks (lock only on latest), Gluon partial workspaces for artists; cloud seat\n  fees removed 2026-03-01 ([Unity](https://unity.com/en/products/pricing-updates)) (fact).\n- **Perforce P4V**: exclusive checkout and streams; still the AAA norm (fact, see survey above).\n- **Diversion**, **Lore** (Epic, open-sourced June 2026, Rust, MIT, advisory locks, no Git interop on roadmap,\n  [repo](https://github.com/EpicGames/lore)) (fact).\n- **LFS locks in Git GUIs** (fact): API complete (`--json`, `/locks/verify`)\n  ([API](https://github.com/git-lfs/git-lfs/blob/main/docs/api/locking.md)); Sourcetree none, GitKraken a feature\n  request, Fork a manual list ([#1862](https://github.com/fork-dev/TrackerWin/issues/1862)); \"unlock after push\"\n  open since 2017 ([#2671](https://github.com/git-lfs/git-lfs/issues/2671)).\n- **UnityYAMLMerge**: documented only as a manual `git mergetool`; merges `.unity`/`.prefab`/`.meta` only; known\n  silent-merge bugs on prefab instances/variants\n  ([Smart merge](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/smart-merge)) (fact).\n- **Unity 6.3 editor integration** covers Perforce + UVCS only; Git locking needs an editor plugin\n  ([integrations](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/versioncontrolintegration)) (fact).\n- **Claude's pick**: be the best *Git* client for Unity: native LFS lock panel + unlock-on-push checklist,\n  `.meta` guard, UnityYAMLMerge as an auto-configured driver, structural prefab diff, lazy binary previews.\n  Proposals T1–T14 in gamedev.md §6.\n\n## Agent interfaces\n\nSummary of [agents.md](agents.md) (track C, links checked 2026-11-21).\n\n- **Git MCP servers mirror the CLI, none has a review gate** (fact). Official `mcp-server-git`: 14 tools +\n  2 prompts, file-level `git_add` only, commits straight to the branch, disables hooks/signing/repo drivers\n  ([README](https://github.com/modelcontextprotocol/servers/tree/main/src/git)). GitHub MCP is host-API only\n  ([repo](https://github.com/github/github-mcp-server), 34.6k★). cyanheads/git-mcp-server mirrors ~30 git verbs (245★).\n- **GitButler is the closest prior art** (fact): `but agent setup` installs a skill + policy; agents commit\n  **hunks by ID**, amend/squash/uncommit, `but oplog` undo; parallel agents share one workdir\n  ([docs](https://docs.gitbutler.com/ai-agents/overview)). Its MCP and Claude Code hooks doc pages now 404 (open).\n- **Agents today** (fact): Claude Code, Codex, Cursor isolate in worktrees and review via a diff with line\n  comments fed back to the agent; Codex's review pane has Unstaged/Staged/Commit/Branch/Last-turn scopes and chunk\n  staging ([Codex](https://developers.openai.com/codex/app/review)); Aider auto-commits every edit\n  ([Aider](https://aider.chat/docs/git.html)); Copilot cloud agent ends in a host PR whose workflows need human approval.\n- **Orchestrators** (Conductor, Sculptor, Crystal→Nimbalyst, vibe-kanban, the latter now sunsetting) all follow\n  worktree → diff review → PR. Nobody but GitButler helps split agent output into clean commits locally.\n- **Scale** (fact): agents start >40% of GitHub PRs (Sept 2026)\n  ([Octoverse 2026](https://github.blog/news-insights/octoverse/octoverse-commits-pushes-reach-new-highs-in-2026-as-developers-build-with-agents/));\n  58.7% of developers don't plan to use AI for committing/reviewing ([SO 2025](https://survey.stackoverflow.co/2025/ai)).\n- **Claude's pick for gitgud:** agents call `propose(hunks, message, why)`; gitgud builds draft commits under\n  hidden refs (`refs/gitgud/proposals/<id>`) without touching Max's index or branches, adds risk flags (LFS,\n  `.meta` pairs, unlocked lockable files, out-of-scope files), and Max approves/edits/rejects in an inbox. Approval\n  commits via the `git` CLI so hooks and signing run. v1 tools: `status`, `diff`/`log`/`show`, `propose`,\n  `proposal`, `withdraw`; no commit/push/merge tools. Alternatives (agent stages real index; agent branch/worktree\n  review; virtual branches) compared in agents.md §6.\n", "handson": "# Hands-on GUI round\n\nRun **2026-11-21** with computer use, on Windows 11 (3440×1440). Labels: `fact` (seen in this round),\n`Claude's pick`, `open`. Screenshots with pins: `docs/research/shots/handson.json` (19 shots, `ho-*`).\n\nTest repo: BoatAttack (Unity, ~185 LFS files), local bare `remote.git` as origin, reset with\n`spikes/scripts/handson_setup.py` before each tool. Same 10 tasks for every tool; mechanics only.\n\n**Not run:**\n\n- **Sourcetree 3.4.30 (baseline):** skipped. It is Max's work install; Max asked for it not to be\n  touched. Its matrix column stays empty.\n- **lazygit 0.66.3:** not driven. Computer use grants terminals at \"click\" tier (no keys), and lazygit\n  is keyboard-only. `open`: run it by hand, or through a non-terminal host.\n\nLegend: ✓ done smoothly · ~ done with friction or partly · ✗ not possible in the UI.\n\n## 1. Results matrix\n\n| Task | Fork 2.24.0 | Sublime Merge 2136 | GitButler 0.22.3 |\n|---|---|---|---|\n| 1. Open, graph usable | ✓ < 3 s | ✓ < 1.5 s | ~ ~4 s, no graph (lanes + branch list) |\n| 2. Stage hunk A, commit | ~ hover pill unreachable when maximised on ultrawide | ✓ 1 click \"Stage Hunk\" | ✓ hunk/line checkboxes; lands on a virtual branch |\n| 3. LFS texture diff | ✓ side-by-side / swipe / onion skin | ~ side-by-side / onion skin | ✗ pointer text only |\n| 4. Rebase: fixup + reword | ✓ todo-list dialog, autosquash pre-applied | ~ per-commit edits; fixup line kept | ~ drag-to-squash; fixup line kept; \"diverged\" nag |\n| 5. Merge with conflicts | ✓ predicted up front; 3-pane merge | ✓ inline markers; 3-way tool | ✗ no branch merge; apply refused |\n| — external / UnityYAMLMerge | VS, VS Code only | none offered | n/a |\n| 6. Stash and pop | ✓ stash node in graph; pop checkbox | ✓ Ctrl+S / Ctrl+Shift+S | ~ no stash; \"Stash into branch\" / unapply |\n| 7. Cherry-pick | ✓ predicted \"no conflicts\" | ✓ flag picker | ✗ none |\n| 8a. Discard, then recover | ✗ no undo | ✗ Undo is text-only | ✓ op-log Revert |\n| 8b. Undo last commit | ✓ Reset dialog, soft/mixed/hard | ✓ Reset submenu, 4 modes | ✓ \"Uncommit\" |\n| 9. LFS lock UI | ~ LFS Status (Locks) window, lock/unlock | ✗ \"LFS Track File\" only | ✗ and warns LFS filters are skipped |\n| 10. Palette / keyboard | ~ Quick Launch, short command list | ✓ palette with git equivalents | ✗ none; Ctrl+Shift+P opens print dialog |\n\n## 2. Fork 2.24.0\n\n- **Setup:** first-run \"User information\" modal, then ~10 s \"preparing for first run\". Opened the\n  repo via `Fork.exe <path>` (the folder picker blocks typing for computer use).\n- **T1:** graph, folder-grouped branches and the stash as a graph node were all there in the first\n  screenshot (`ho-fork-graph`).\n- **T2:** the per-hunk \"Stage | Discard…\" pill sits at the far right of the hunk. Maximised on a\n  3440 px screen its hover zone ends ~200 px before the pill, so it vanishes as the pointer reaches it;\n  the line context menu has no stage. Worked only after un-maximising. Then Ctrl+Enter commits.\n- **T3:** selecting the PNG opens an image diff straight away with LFS badges, size and dimensions;\n  Side-by-Side / Swipe / Onion Skin (`ho-fork-imagediff`, `ho-fork-swipe`).\n- **T4:** right-click base → Interactive Rebase → \"…to here\" (also quick Reword / Squash into parent /\n  Fixup / Drop). The dialog had already marked `fixup!` as Fixup and moved it. Single-key actions\n  (P/E/R/S/F/D), Ctrl+↑/↓ reorder, reword edited inline before running. \"Update dependent branches\"\n  and \"Backup current state with a temporary branch\" checkboxes. ~6 clicks (`ho-fork-rebase`).\n- **T5:** the merge dialog warned **\"Merge will cause conflicts\"** before running\n  (`ho-fork-merge-predict`). After: raw git output modal, banner \"Fix 2 conflicts\" + Abort. Per-file\n  view: tick theirs/ours, or \"Merge\" into a 3-pane editor (n/2 counter, \"Select Left/Right\" per chunk,\n  both allowed, editable result). The prefab merged as plain YAML; external tools offered: Visual\n  Studio, VS Code (`ho-fork-merge`).\n- **T6:** toolbar Stash (message, \"stage new files\"); apply dialog has \"Delete stash after applying\"\n  (= pop), kept on conflict.\n- **T7:** right-click → Cherry-pick; dialog says \"can be done without conflicts\", options commit /\n  append origin.\n- **T8:** discard has a confirm modal and no undo; no reflog view in the menus. Reset dialog explains\n  modes in plain words (\"Keep all changes, unstage differences\").\n- **T9:** Repository → Git LFS → Status (Locks): a file list with lock / unlock buttons; the local\n  remote returned the expected raw git-lfs error. Also Track pattern / Fetch / Pull / Prune.\n- **T10:** Quick Launch (Ctrl+P) mixes commands, repos and branches, but the command list is short;\n  rebase, merge, cherry-pick and hunk staging are mouse-only. Quick Launch lists all recent repos,\n  so it was not screenshotted.\n\n## 3. Sublime Merge build 2136 (unregistered)\n\n- **Setup:** `smerge.exe <path>`, no first-run screen. A \"Purchase / Cancel\" nag modal appeared after\n  a few actions; evaluation is unlimited.\n- **T1/T3:** opens on the working directory with every changed file expanded in one scroll, the LFS\n  image as side-by-side or onion skin with a slider (`ho-sm-workdir`).\n- **T2:** hover a hunk → \"Stage Hunk / Discard Hunk\" on the hunk's own header row; one click.\n- **T4:** no todo list. Right-click → Edit → Edit Message (inline, Ctrl+Enter) / Edit Contents /\n  Squash with Parent / Move Up / Down / Drop; fixup-style squash needs a multi-selection\n  (`ho-sm-edit-menu`). Squash with Parent kept \"fixup! …\" in the body; each edit is its own rewrite.\n  Checkout with a dirty tree failed with a raw git toast and no offer to stash.\n- **T5:** merge dialog lists flags and **\"Runs git command git merge conflict/theirs\"**; no conflict\n  prediction (`ho-sm-merge-dialog`). Conflict markers appear inline; per file: Resolve / Using Ours /\n  Using Theirs (`ho-sm-conflicts`). The 3-way tool is ours | merged | theirs with an arrow per hunk\n  (Ctrl+Shift+]), Prev/Next Conflict, \"all conflicts resolved\", Save and Stage (`ho-sm-3way`).\n  A one-click \"Stage all unmerged files to continue\" sits next to Abort.\n- **T6/T7:** Ctrl+S stashes without asking, Ctrl+Shift+S pops. Palette \"Stash\" and context\n  Cherry Pick open flag pickers (include untracked / keep index; `--no-commit` / `-x`).\n- **T8:** discard is an in-place two-click confirm (button turns red \"Discard!\", Shift+Backspace),\n  no modal. Ctrl+Z / Edit → Undo only undoes text edits; the discard was gone. Reset submenu lists\n  Soft / Mixed / Keep / Hard with one-line explanations, no confirm.\n- **T9:** no lock UI; the file menu offers \"LFS Track File\" only.\n- **T10:** Ctrl+Shift+P palette shows each command's git equivalent and shortcut, and chains into\n  argument pickers (`ho-sm-palette`). Enter inside palette prompts didn't register via computer use;\n  that's a tool quirk, not counted against the app.\n\n## 4. GitButler 0.22.3\n\n- **Setup:** \"Before we begin\": error reporting and usage metrics both default **on** (turned off).\n  Update to 0.23.5 offered twice (declined). Sign-in is only for AI features (skipped). Configure\n  workspace: GitButler moves HEAD to `gitbutler/workspace`.\n- **LFS:** a PSA toast: worktree filter `lfs` detected, filters \"will silently not be applied during\n  workspace operations\", lists the 185 LFS files and suggests `git lfs pull --include`. It came back\n  later (`ho-gb-lfs-psa`).\n- **T1:** workspace = lanes of applied stacks; the Branches view is a list with ahead/behind counts\n  plus a linear commit list. No view shows how branches relate.\n- **T2:** \"Start a commit\" puts checkboxes on files, hunks and lines in the diff (`ho-gb-hunks`); the\n  commit lands on an auto-named virtual branch (`ht-branch-1`), and HEAD becomes a synthetic\n  \"GitButler Workspace Commit\". (landscape.md says hunks only, GB5; line ticks were visible here.)\n- **T3:** LFS pointer text diff only (`ho-gb-lfs-diff`).\n- **T4:** applying `feature/stack` was refused: \"conflicts with stack ht-branch-1. Unapply it first\"\n  (`ho-gb-apply-refused`). After unapplying: Reword inline; squash = drag a commit onto another, the\n  target labelled \"Squash\" (`ho-gb-squash-drag`). The fixup line stayed in the body. Then a banner\n  \"This branch and its remote have diverged\" with an orange **Update local branch…** button that\n  would pull the pre-rewrite commits back; Force push is the small one (`ho-gb-diverged`).\n- **T5:** no merging one branch into another. Applying `conflict/theirs` was refused the same way.\n- **T6/T7:** no stash or cherry-pick; file menu has \"Stash into branch…\" and \"Absorb changes\".\n- **T8:** discard has a modal listing files. **Operations history** (Ctrl+3) logs every op with the\n  files it touched; hover → Revert brought the discarded change back, and the revert is itself\n  logged (`ho-gb-oplog`). Undo commit: \"Uncommit\" puts the changes back into the stack's staged area.\n- **T9:** no lock UI.\n- **T10:** no palette. Ctrl+1/2/3 switch views, Ctrl+B new branch, Ctrl+Enter commits;\n  Ctrl+Shift+P falls through to WebView2's print dialog.\n\n## 5. Steal / avoid (Claude's pick)\n\n**Steal**\n\n1. Pre-flight conflict prediction on merge, rebase and cherry-pick dialogs (Fork).\n2. Rebase as a todo list edited up front: autosquash pre-applied, single-key actions, inline reword,\n   \"backup to a temporary branch\" checkbox (Fork).\n3. An op log that covers the working tree: every op, discards included, revertible in one click, and\n   reverts logged too (GitButler). Neither Fork nor Sublime could recover a discard.\n4. LFS image diff with side-by-side / swipe / onion skin, size and dimensions (Fork).\n5. Palette entries that show the git command they run, chaining into flag pickers (Sublime); the\n   same \"Runs git command …\" line in dialogs.\n6. Hunk actions on the hunk's own row, always reachable (Sublime); checkbox selection of hunks/lines\n   as a second way to build a commit (GitButler).\n7. Ours | merged | theirs merge with per-hunk arrows and a resolved counter (Sublime, Fork).\n8. Stash drawn as a graph node; branches grouped by prefix folder (Fork).\n9. In-place two-click confirm for discard instead of a modal (Sublime).\n10. Labelled drop targets for drag-and-drop history edits (GitButler).\n\n**Avoid**\n\n1. Any workspace model that bypasses git's smudge/clean filters; LFS repos are the target\n   (GitButler).\n2. Hover controls pinned to the far edge of wide panes (Fork on ultrawide).\n3. Raw git output as the error UI: checkout-with-dirty-tree toast with no \"stash and switch\" offer\n   (Sublime), git error modals (Fork).\n4. After a deliberate rewrite, a loud \"update from remote\" button that undoes it (GitButler).\n5. \"Squash\" that keeps `fixup!` lines; fixup should drop the message (Sublime, GitButler).\n6. One-click \"stage all unmerged files\" next to Abort (Sublime).\n7. Telemetry on by default.\n8. No UnityYAMLMerge integration: none of the three offers it for `.prefab` / `.unity`. gitgud should\n   detect Unity and offer it first.\n\n## 6. Open\n\n- Sourcetree and lazygit columns (see top).\n- Fork's lock window against a real LFS server (the local remote can't lock).\n- Whether Sublime Merge's Enter-in-palette issue is computer-use specific (likely).\n", "gamedev": "# Game-dev version control: tools, Unity specifics, workflows, and where gitgud fits\n\nTrack B (\"gamedev\") of the [research plan](../research-plan.md). Every link was checked **2026-11-21** unless a\nrow says otherwise. Labels: **fact** (sourced), **Claude's pick**, **open**. Nothing here is decided.\nScreenshots with pinned notes: [`shots/gamedev.json`](shots/gamedev.json) (`gd-*` images in `img/`).\n\n## 0. Takeaways (the five that matter)\n\n1. **Git + LFS is what game devs actually use, except at AAA.** In the JetBrains 2025 game-dev survey, GitHub is\n   used by 61% of mid-size/indie and 79% of hobbyist respondents; Perforce P4 by 45% of AAA but 10% of\n   mid/indie; Unity Version Control by 9% / 7% ([JetBrains](https://lp.jetbrains.com/the-state-of-gamedev-2025/),\n   few AAA respondents). **fact.** Max's segment is the Git majority.\n2. **Locking is the gap no Git GUI closes.** LFS has a full locking API (`git lfs lock/locks/unlock --json`,\n   `/locks/verify` with ours/theirs) ([API](https://github.com/git-lfs/git-lfs/blob/main/docs/api/locking.md)), but\n   \"unlock after push\" has been an open git-lfs issue since 2017\n   ([#2671](https://github.com/git-lfs/git-lfs/issues/2671)), Sourcetree never shipped LFS locks\n   ([SRCTREE-4663](https://jira.atlassian.com/browse/SRCTREE-4663)), GitKraken has an open request\n   ([feedback](https://feedback.gitkraken.com/suggestions/220717/support-git-lfs-large-file-storage-locking-feature)),\n   Fork has a manual locks list only ([Fork #1862](https://github.com/fork-dev/TrackerWin/issues/1862)). Anchorpoint\n   solved it by **abandoning LFS locks** for its own server ([docs](https://docs.anchorpoint.app/git/file-locking/)).\n   **fact.**\n3. **Unity merges are fixable only half-way.** UnityYAMLMerge merges `.unity`, `.prefab`, `.meta` semantically but not\n   `.asset`/`.mat`/`.controller` without `--force`, and Unity documents only the interactive `git mergetool` route,\n   not a merge driver ([Smart merge](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/smart-merge)).\n   Known bugs on prefab instances/variants/nested prefabs (Unity issue tracker, §3.3). **fact.**\n4. **Unity's own editor VCS integration is Perforce + UVCS only.** For Git, Unity offers nothing beyond \"Visible Meta\n   Files\" ([integrations](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/versioncontrolintegration)).\n   Every Git-for-Unity locking story (Anchorpoint, Diversion) needs an editor plugin because Unity ignores read-only\n   files ([Anchorpoint](https://docs.anchorpoint.app/git/file-locking/)). **fact.**\n5. **The market is moving fast in 2026.** Epic open-sourced **Lore** (Rust, MIT, centralized, chunked, pre-1.0, 9.2k\n   stars) in June 2026 ([repo](https://github.com/EpicGames/lore)); Anchorpoint is rewriting its app as a Lore client\n   ([docs](https://docs.anchorpoint.app/lore/quick-start/)); Unity dropped UVCS cloud seat fees on 2026-03-01\n   ([Unity](https://unity.com/en/products/pricing-updates)). **fact.** Git stays the default for Unity indies; gitgud\n   should be the best *Git* client for them, not a new VCS. **Claude's pick.**\n\n## 1. Tool comparison matrix\n\nLegend: ✓ yes · ~ partial · ✗ no · ? not verified. Each cell links to its source or the per-tool section.\n\n| Feature | Anchorpoint | Unity VCS (Plastic) | Perforce P4V | Diversion | Lore (Epic) | UE Git plugin (PB) | Fork / GitHub Desktop / GitKraken / Sourcetree |\n|---|---|---|---|---|---|---|---|\n| Underlying VCS | Git (+ own metadata server); Lore client in rewrite [[1]](https://docs.anchorpoint.app/lore/quick-start/) | Plastic (own) | P4 (own, centralized) | Own, cloud [[2]](https://www.diversion.dev/pricing) | Own, centralized, content-addressed [[3]](https://github.com/EpicGames/lore) | Git + LFS | Git + LFS |\n| Hard file lock | ✓ own server, not LFS [[4]](https://docs.anchorpoint.app/git/file-locking/) | ✓ Smart Locks [[5]](https://docs.unity.com/en-us/unity-version-control/smart-locks) | ✓ `+l` typemap [[6]](https://perforce.com/manuals/p4sag/Content/P4SAG/superuser.basic.typemap_locking.html) | ✓ Hard Locks (Studio tier) [[2]](https://www.diversion.dev/pricing) | ~ advisory only, redesign 2026 [[7]](https://epicgames.github.io/lore/faq/) | ✓ LFS locks [[8]](https://github.com/ProjectBorealis/UEGitPlugin) | Fork ~ manual list; others ✗ (§2.8) |\n| Auto-lock on edit | ✓ binaries on modify [[4]](https://docs.anchorpoint.app/git/file-locking/) | ✓ checkout matching lock rule [[5]](https://docs.unity.com/en-us/unity-version-control/smart-locks) | ✓ checkout-on-edit in editor | ~ \"soft locks\" warn [[9]](https://www.diversion.dev/unity-integration) | ? | ✓ auto-checkout setting [[8]](https://github.com/ProjectBorealis/UEGitPlugin) | ✗ |\n| Auto-unlock on push/submit | ✓ [[4]](https://docs.anchorpoint.app/git/file-locking/) | ✓ on check-in / merge to destination [[5]](https://docs.unity.com/en-us/unity-version-control/smart-locks) | ✓ on submit | ? | ? | ✓ on in-editor submit [[10]](https://github.com/fork-dev/TrackerWin/issues/1862) | ✗ ([#2671](https://github.com/git-lfs/git-lfs/issues/2671)) |\n| Locks across branches | ✓ \"outdated\" cross-branch flag [[4]](https://docs.anchorpoint.app/git/file-locking/) | ✓ retained lock until merged to destination [[5]](https://docs.unity.com/en-us/unity-version-control/smart-locks) | per path/stream | ? | planned [[11]](https://epicgames.github.io/lore/roadmap/) | ✓ Status Branches [[8]](https://github.com/ProjectBorealis/UEGitPlugin) | ✗ |\n| \"Who has this file\" in UI | ✓ avatar on file [[4]](https://docs.anchorpoint.app/git/file-locking/) | ✓ lock icon | ✓ blue badge = other user [[12]](https://www.perforce.com/manuals/p4v/Content/P4V/using.icons.html) | ✓ clash indicators [[9]](https://www.diversion.dev/unity-integration) | ? | ✓ in editor | Fork: Repository > Git LFS > Locks [[10]](https://github.com/fork-dev/TrackerWin/issues/1862) |\n| Partial / selective checkout | ✓ sparse checkout (Team) [[13]](https://docs.anchorpoint.app/git/sparse-checkout/) | ✓ Gluon partial workspace [[14]](https://docs.unity.com/en-us/unity-version-control/gluon/configure-workspace) | ✓ workspace mapping | ? | ✓ on-demand hydration, VFS [[3]](https://github.com/EpicGames/lore) | ✗ | ✗ |\n| Binary previews | ✓ thumbnails + 3D viewer (FBX shown) [[15]](https://www.anchorpoint.app/) | ✓ Gluon previews ≤1 MiB default [[14]](https://docs.unity.com/en-us/unity-version-control/gluon/configure-workspace); no FBX thumbs (vendor claim [[16]](https://www.anchorpoint.app/blog/best-version-control-software-for-unity)) | ~ | ✓ \"Art Previews\" (Pro) [[2]](https://www.diversion.dev/pricing) | ✓ image/video/audio compare via Anchorpoint [[1]](https://docs.anchorpoint.app/lore/quick-start/) | ✗ | GitKraken/Fork: image diff only (see landscape track) |\n| Unity editor plugin | ✓ beta, UPM git URL [[17]](https://docs.anchorpoint.app/git/unity/) | ✓ built into Unity [[18]](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/versioncontrolintegration) | ✓ Unity Perforce mode [[18]](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/versioncontrolintegration) | ✓ open beta, Asset Store [[9]](https://www.diversion.dev/unity-integration) | ✗ (Unreal only, 2027) [[11]](https://epicgames.github.io/lore/roadmap/) | n/a | ✗ |\n| Unreal plugin | ✓ [[4]](https://docs.anchorpoint.app/git/file-locking/) | ✓ | ✓ (default for UE) | ✓ Epic-recommended [[2]](https://www.diversion.dev/pricing) | 2027 [[11]](https://epicgames.github.io/lore/roadmap/) | ✓ is the plugin | ✗ |\n| Smart Merge (UnityYAMLMerge) wired | manual `.git/config` [[17]](https://docs.anchorpoint.app/git/unity/) | via client merge-tool rule [[19]](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/smart-merge) | via P4V ext. mapping + Unity \"Premerge\" [[19]](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/smart-merge) | ? | ✗ | n/a | Sourcetree: manual custom tool [[19]](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/smart-merge) |\n| Any Git host | ✓ (Team) [[20]](https://www.anchorpoint.app/pricing) | ✗ own cloud/on-prem | ✗ | ✗ (GitHub mirror) [[9]](https://www.diversion.dev/unity-integration) | ✗ | ✓ | ✓ |\n| Price | Free (personal, GitHub only); €20–25/user/mo Team [[20]](https://www.anchorpoint.app/pricing) | Free seats on cloud since 2026-03; 25 GB/org free, 100 GB egress [[21]](https://unity.com/en/products/pricing-updates) | Free ≤5 users/20 workspaces; Cloud ~$39/user/mo [[22]](https://www.perforce.com/products/helix-core/free-version-control) | Indie free (5 users, 100 GB); $25 / $35 user/mo [[2]](https://www.diversion.dev/pricing) | Free, MIT | Free, MIT | Free–paid |\n\n## 2. Per-tool sections\n\n### 2.1 Anchorpoint (Git client for game teams)\n- **Model:** Git CLI underneath plus a proprietary **metadata server** for locks, \"Attributes\" (approvals, tags, notes)\n  and a project timeline ([pricing](https://www.anchorpoint.app/pricing), [locking](https://docs.anchorpoint.app/git/file-locking/)). **fact.**\n- **Locking mechanics** ([docs](https://docs.anchorpoint.app/git/file-locking/)): **fact.**\n  - binaries auto-lock the moment they are modified; text files opt-in by extension;\n  - locks release on push (others must pull before read-only clears, [blog 2025-08-21](https://www.anchorpoint.app/blog/using-file-locking-in-git));\n  - locked files are made read-only; Unity ignores read-only, so the **Unity plugin is required** for locks to bite;\n  - anyone may force-unlock, logged in the timeline; deletes/renames lock after asking;\n  - optional \"track outdated files across branches\": files changed on any branch touched in the last 7 days\n    (`cross_branch_lookback_days` in `.ap/config.ini`) show as locked/outdated on yours; needs merge commits, not rebase;\n  - explicitly **not** Git LFS locks: \"should not be used\" together.\n  - Claims 1,000 files locked in under a second ([blog, vendor](https://www.anchorpoint.app/blog/perforce-alternative-for-game-development)).\n- **Unity** ([docs](https://docs.anchorpoint.app/git/unity/)): plugin (beta, `ap-unity`, 12 stars,\n  [repo](https://github.com/Anchorpoint-Software/ap-unity)) commits from the editor and shows locks; auto-configures\n  LFS; ships a Unity `.gitignore`; tells users to paste the UnityYAMLMerge `mergetool` block into `.git/config` by hand;\n  recommends \"split scenes into prefabs and lock the prefab\", trunk-based dev, art sources in a separate repo. **fact.**\n- **Selective checkout** = Git sparse checkout; other clients (GitHub Desktop) then need a full download\n  ([docs](https://docs.anchorpoint.app/git/sparse-checkout/)). **fact.**\n- **Scale claim:** 1 TB / 385,493 files on self-hosted GitLab; initial push 30 h at 30 Mbit; `git status` after 10\n  changed files 1.58 s with sparse checkout ([blog, vendor](https://www.anchorpoint.app/blog/scaling-git-to-1tb-of-files-with-gitlab-and-anchorpoint-using-git-lfs)). **fact.**\n- **2026 pivot:** \"Anchorpoint for Lore\" is a rewrite that \"will replace the current Anchorpoint application\"; Git\n  support returns later; it advertises reviewing work \"from teammates and AI agents\"\n  ([docs](https://docs.anchorpoint.app/lore/quick-start/)). **fact.** → an opening for a dedicated Git game-dev client.\n  **Claude's pick.**\n\n### 2.2 Unity Version Control (Plastic SCM)\n- **Smart Locks** ([docs](https://docs.unity.com/en-us/unity-version-control/smart-locks)): **fact.**\n  - lock rules (one org rule, many repo rules) turn a normal checkout into a lock for matching paths;\n  - only the **latest revision** (on the destination branch, default `/main`) can be locked: you cannot lock a stale copy;\n  - checking in on a non-destination branch sets **Retained**; the lock clears only when merged to the destination.\n- **Gluon** = artist mode: a *partial* workspace where you tick files/folders to load, edit, check in without updating\n  the whole tree; previews of unloaded files up to `MaxPreviewFileSize` (1 MiB default)\n  ([docs](https://docs.unity.com/en-us/unity-version-control/gluon/configure-workspace)). **fact.**\n- **Unity editor**: UVCS mode cannot lock/unlock or resolve conflicts from the Project view, those go to the UVCS GUI\n  ([Unity 6.3](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/versioncontrolintegration)). **fact.**\n- **Pricing 2026:** cloud seat fees removed 2026-03-01; storage free allowance 5 → 25 GB/org/month; new egress meter, first\n  100 GB free; without a card on file access is blocked when over the free tier ([Unity](https://unity.com/en/products/pricing-updates),\n  [support](https://support.unity.com/hc/en-us/articles/34748492914964-Understanding-Unity-DevOps-charges)). **fact.**\n- **Users:** Unity forum thread \"Unity Version Control. Why is it terrible?\" (May 2025 → Jun 2026): pushes hanging,\n  crashes, clumsy branch UI, Linux plugin unsupported; recommended alternatives Git+GitHub/LFS, standalone client,\n  Perforce ([thread](https://discussions.unity.com/t/unity-version-control-why-is-it-terrible/1647889)). **fact.**\n\n### 2.3 Perforce P4 / P4V (formerly Helix Core)\n- Renamed \"P4\" in 2025; P4V docs at 2026.3 ([icons](https://www.perforce.com/manuals/p4v/Content/P4V/using.icons.html)). **fact.**\n- **Exclusive checkout:** `+l` file-type modifier via typemap (e.g. `binary+l //....uasset`); typemap applies only to\n  newly added files, so set it first ([typemap](https://perforce.com/manuals/p4sag/Content/P4SAG/superuser.basic.typemap_locking.html),\n  [game engines](https://perforce.com/node/1164066)). **fact.**\n- **Visibility:** red badge = your action, blue = another user's (checked out / open for edit / locked), yellow ▲ =\n  \"not latest version\", hover for detail ([icons](https://www.perforce.com/manuals/p4v/Content/P4V/using.icons.html)). **fact.**\n- **Shelving** keeps the exclusive lock (single third-party test on p4d 2025.2,\n  [Classmethod](https://dev.classmethod.jp/en/articles/perforce-exclusive-lock-behavior/)). **fact, one source.**\n- Unity's Perforce mode: auto checkout on save, \"Overwrite Failed Checkout Assets\" (default on), new \"Auto Revert\n  Unchanged Files\" ([Unity 6.3](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/versioncontrolintegration)). **fact.**\n- Free ≤5 users / 20 workspaces; Cloud ~$39/user/month (team cap stated as 50 or 100 on different pages)\n  ([Perforce](https://www.perforce.com/products/helix-core/free-version-control)). **fact.**\n- Opinion: an HN commenter from a studio that used Helix Core Cloud says it is the default creatives know, programmers\n  dislike it, and it \"does show its years\" ([HN Lore thread](https://news.ycombinator.com/item?id=48571081)). **fact (paraphrase).**\n\n### 2.4 Diversion\n- YC S22, cloud-native, $12 M raised by May 2025 ([GamesBeat](https://gamesbeat.com/diversion-raises-12m-in-funding-for-its-version-control-platform-for-creatives)). **fact.**\n- Unity plugin \"Diversion Connect\" (open beta, Asset Store): status overlays, commit/reset from editor, branch +\n  sync status, **conflict-prevention alerts** when you open/save a file a teammate is editing (\"live soft locks\")\n  ([page](https://www.diversion.dev/unity-integration)). **fact.**\n- Pricing: Indie free (5 users, 100 GB), Pro $25, Studio $35 (Hard Locks, Prune), extra storage $10/100 GB\n  ([pricing](https://www.diversion.dev/pricing)). **fact.** Vendor claims: 400k files committed <30 s, 5 M-file clone\n  <5 min ([80.lv, sponsored](https://80.lv/articles/game-studios-are-moving-beyond-legacy-version-control-and-here-s-why)).\n- HN launch (280 pts, 2024): skepticism about a closed, cloud-only VCS replacing Git\n  ([HN](https://news.ycombinator.com/item?id=39088551), source 2024). **fact.**\n\n### 2.5 Lore (Epic, new 2026)\n- Open-sourced June 2026 (repo created 2026-05-21), MIT, Rust, v0.14.0, 9.2k stars; centralized, content-addressed\n  Merkle trees, chunked large files, on-demand hydration, FUSE/VFS in progress ([repo](https://github.com/EpicGames/lore),\n  [HN 1,276 pts](https://news.ycombinator.com/item?id=48571081)). **fact.**\n- Locks today are advisory; scalable enforced locking is a 2026 roadmap item; open-source desktop client and Unreal\n  plugin 2027; Unity and Git interop not on the roadmap ([roadmap](https://epicgames.github.io/lore/roadmap/),\n  [FAQ](https://epicgames.github.io/lore/faq/)). **fact.**\n- Relevance to gitgud: **watch, don't build for it now.** Unity + Git users have no migration path to Lore yet.\n  **Claude's pick.** Whether gitgud's core should be VCS-agnostic enough to add Lore later: **open.**\n\n### 2.6 Unreal integrations\n- **ProjectBorealis UEGitPlugin** (831 stars, pushed 2026-08): refactor of SRombauts' plugin (883 stars, last push\n  2024-01): multi-threaded LFS lock/unlock, local lock cache, **Status Branches** (flags files changed on configured\n  remote branches), background remote refresh, explicit `*.uasset`/`*.umap` `.gitattributes` lines required, no\n  prebuilt binaries ([README](https://github.com/ProjectBorealis/UEGitPlugin)). **fact.**\n- Unreal submits push then LFS-unlock every pushed file; artists using Fork for the rest had to unlock by hand\n  ([Fork #1862](https://github.com/fork-dev/TrackerWin/issues/1862), source 2023–24). **fact.**\n- **One File Per Actor:** actors stored in separate files with encoded names so editors don't lock whole levels; the\n  readable \"View Changelist\" works only with Perforce\n  ([Epic docs](https://dev.epicgames.com/documentation/en-us/unreal-engine/one-file-per-actor-in-unreal-engine)). **fact.**\n\n### 2.7 Godot\n- Text scenes (`.tscn`) merge as text; official `godot-git-plugin` is a libgit2 implementation of Godot's VCS\n  interface, no LFS/lock features mentioned, 966 stars, active 2026-10\n  ([repo](https://github.com/godotengine/godot-git-plugin)). **fact.** Low priority for gitgud. **Claude's pick.**\n\n### 2.8 General Git GUIs and LFS locks\n| Client | LFS lock support | Source |\n|---|---|---|\n| Sourcetree | none | [SRCTREE-4663](https://jira.atlassian.com/browse/SRCTREE-4663) (undated) |\n| GitKraken | LFS track/push, locking still a feature request | [feedback](https://feedback.gitkraken.com/suggestions/220717/support-git-lfs-large-file-storage-locking-feature) |\n| Fork (Win) | lock/unlock + \"Repository > Git LFS > Locks\" list; no unlock-on-push (\"technically impossible\" per dev) | [#1862](https://github.com/fork-dev/TrackerWin/issues/1862), [#605](https://github.com/fork-dev/TrackerWin/issues/605) |\n| GitHub Desktop | no lock UI found | [issues search](https://github.com/desktop/desktop/issues/2812) |\n\n### 2.9 Git LFS itself\n- **Lockable:** `git lfs track \"*.psd\" --lockable` → `.gitattributes` gets `lockable`; Git LFS then makes those files\n  **read-only** unless you hold the lock (`lfs.setlockablereadonly`, default true)\n  ([wiki](https://github.com/git-lfs/git-lfs/wiki/File-Locking), [config](https://github.com/git-lfs/git-lfs/blob/main/docs/man/git-lfs-config.adoc)). **fact.**\n- **Commands:** `git lfs lock --json`, `git lfs locks --json [--local|--cached|--verify] [--path]`, `unlock --force`\n  ([lock](https://github.com/git-lfs/git-lfs/blob/main/docs/man/git-lfs-lock.adoc),\n  [locks](https://github.com/git-lfs/git-lfs/blob/main/docs/man/git-lfs-locks.adoc)). `--local` is offline; `--cached`\n  shows others' locks from the last call. **fact.**\n- **API:** `POST /locks`, `GET /locks?path&cursor&limit&refspec`, `POST /locks/verify` → `{ours, theirs}`,\n  `POST /locks/:id/unlock {force}`; 409 on conflict; push is blocked if it touches a `theirs` file; 404 on verify =\n  server has no locking ([API](https://github.com/git-lfs/git-lfs/blob/main/docs/api/locking.md)). **fact.**\n- **Push check:** `lfs.locksverify` null/true/false per host. **fact.**\n- **Partial fetch:** `lfs.fetchinclude` / `fetchexclude`, `fetchrecentrefsdays` (7), `pruneoffsetdays` (3),\n  `concurrenttransfers` (8) ([config](https://github.com/git-lfs/git-lfs/blob/main/docs/man/git-lfs-config.adoc)). **fact.**\n- Latest release v3.8.1 (2026-10-22) ([releases](https://github.com/git-lfs/git-lfs/releases)). **fact.**\n- **Git core is catching up:** large-object promisors landed in pieces from Git 2.49/2.50 and are still WIP; Git 2.54\n  (Apr 2026) made the object database backend pluggable\n  ([LOP doc](https://git-scm.com/docs/large-object-promisors), [GitLab on 2.54](https://about.gitlab.com/blog/whats-new-in-git-2-54-0/)). **fact.**\n  LFS stays the practical answer through gitgud v1. **Claude's pick.**\n\n**Host support and cost (LFS)**\n\n| Host | LFS locks | Free LFS | Overage | Max file |\n|---|---|---|---|---|\n| GitHub | ✓ (`GET /locks` answers 200, probed 2026-11-21) | 10 GiB storage + 10 GiB bandwidth (Free/Pro); 250/250 (Team/Enterprise) | metered, $0.07/GiB-month storage, $0.0875/GiB bandwidth; $0 budget = LFS blocked for the month | 2 GB Free/Pro, 4 GB Team, 5 GB Ent. |\n| GitLab | ✓ LFS exclusive locks all tiers; extra UI default-branch locks Premium+ | 10 GiB/project incl. repo + LFS (Free) | storage packs | — |\n| Azure DevOps | ✓ | free (no stated cap; Anchorpoint says no charge for LFS space) | — | no SSH with LFS |\n| Bitbucket Cloud | ✗ (DC/Server ✓) | 1 GB Free, 5 GB Std, 10 GB Prem | 100 GB packs | — |\n| Gitea | ✓ (follows the LFS lock API, `LFS_LOCKS_PAGING_NUM`) | self-hosted | — | — |\n\nSources: [GitHub billing](https://docs.github.com/en/billing/concepts/product-billing/git-lfs),\n[GitHub rates](https://docs.github.com/en/billing/using-the-new-billing-platform/about-billing-for-git-large-file-storage),\n[GitHub sizes](https://docs.github.com/en/repositories/working-with-files/managing-large-files/about-git-large-file-storage),\n[GitLab locks](https://docs.gitlab.com/user/project/file_lock/), [GitLab quotas](https://docs.gitlab.com/user/storage_usage_quotas/),\n[Azure](https://learn.microsoft.com/azure/devops/repos/git/manage-large-files),\n[Bitbucket limits](https://support.atlassian.com/bitbucket-cloud/docs/current-limitations-for-git-lfs-with-bitbucket),\n[Bitbucket storage](https://support.atlassian.com/bitbucket-cloud/docs/storage-policy-for-git-lfs-with-bitbucket),\n[Gitea locks code](https://git.fb1.uni-bremen.de/davrot/forgejo_backup/src/branch/v1.20/forgejo/services/lfs/locks.go). All **fact.**\nGitHub's own example: a 1-byte change to a 500 MB LFS file costs another 500 MB storage; CI downloads bill the owner\n([billing](https://docs.github.com/en/billing/concepts/product-billing/git-lfs)). **fact.**\n\n## 3. Unity specifics\n\n### 3.1 `.meta` files\n- Each asset's `.meta` holds its unique ID (GUID) and import settings. Lose it → Unity generates a new one and\n  references break (materials lose textures, prefabs lose scripts). Move/rename outside Unity → you must move the\n  `.meta` too. Empty-folder metas: VCS can't store empty dirs, so Unity deletes/creates folders to match\n  ([AssetMetadata](https://docs.unity3d.com/6000.2/Documentation/Manual/AssetMetadata.html)). **fact.**\n- Failure modes gitgud can detect cheaply (**Claude's pick**, all from the rules above):\n  - **orphan meta**: `X.meta` staged/committed without `X` (or vice versa) → a teammate's Unity regenerates a GUID;\n  - **split commit**: asset and its meta in different commits / one staged, one not;\n  - **rename without meta**: `git mv` of `X` but `X.meta` left behind;\n  - **GUID collision**: two metas with the same `guid:` (duplicated outside Unity);\n  - **meta-only diffs** (import-setting churn) that are usually noise.\n\n### 3.2 Serialization and ignore\n- Text serialization (\"Force Text\") is the VCS-friendly mode and the default in recent Unity\n  ([Rider docs](https://www.jetbrains.com/help/rider/Asset-serialization-mode.html),\n  [Unity text format](https://docs.unity3d.com/Manual/TextSceneFormat.html)); some assets still save binary\n  (NavMesh, [issue](https://issuetracker.unity3d.com/issues/asset-serialization-mode-force-text-saves-navmesh-in-binary)). **fact.**\n- github/gitignore `Unity.gitignore`: `/[Ll]ibrary/`, `/[Tt]emp/`, `/[Oo]bj/`, `/[Bb]uild(s)/`, `/[Ll]ogs/`,\n  `/[Uu]ser[Ss]ettings/`, `*.csproj`, `*.sln`, Addressables temp, `*.unitypackage`, `.vs/` and more\n  ([template](https://github.com/github/gitignore/blob/main/Unity.gitignore)). **fact.**\n\n### 3.3 UnityYAMLMerge / Smart Merge\n- **Handles:** `.unity`, `.prefab`, `.meta`. Other YAML (`.asset`, `.mat`, `.controller`) goes to the fallback tool\n  unless `--force` ([Smart merge, 6000.3](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/smart-merge)). **fact.**\n- **CLI:** `UnityYAMLMerge merge [opts] <base> <theirs> <mine> [<output>]`; `-p` premerge then open fallback with only\n  remaining conflicts; `-h` headless (no dialogs); `-l`/`-r` take theirs/mine on conflict; `-o <file>` writes conflicts;\n  `--fallback none` disables fallback tools; `--rules` custom `mergerules.txt` (array keys, exclusions, float epsilon).\n  Path: `C:\\Program Files\\Unity\\Hub\\Editor\\<version>\\Editor\\Data\\Tools\\UnityYAMLMerge.exe` (same doc). **fact.**\n- **Documented Git setup** is `mergetool` only (`cmd = ... merge -p \"$BASE\" \"$REMOTE\" \"$LOCAL\" \"$MERGED\"`,\n  `trustExitCode = false`). **fact.**\n- **As an automatic merge driver** (Git: `merge.<name>.driver` with `%O` base, `%A` ours/result, `%B` theirs; exit 0 =\n  clean, 1–128 = conflict, >128 = failure, [gitattributes](https://git-scm.com/docs/gitattributes)): mapping Unity's\n  `<base> <theirs> <mine> <output>` gives `UnityYAMLMerge merge -h --fallback none %O %B %A %A`. **Claude's pick;\n  unverified — the research plan's §4 spike must confirm exit codes and in-place output.** Unity doesn't document it.\n- **Known bugs:** misses conflicts in prefab instances (both edits silently kept)\n  ([issue](https://issuetracker.unity3d.com/issues/unityyamlmerge-tool-is-not-detecting-conflicts-in-prefab-instances));\n  prefab-variant property conflicts keep both values\n  ([issue](https://issuetracker.unity3d.com/issues/unityyamlmerge-dot-exe-doesnt-correctly-handle-merge-conflicts-in-modified-properties-on-a-prefab-variant));\n  nested-prefab creation vs. parent edit → \"Won't Fix\"\n  ([issue](https://issuetracker.unity3d.com/issues/breaking-merge-conflicts-when-creating-a-nested-prefab-while-the-parent-prefab-has-been-modified-somewhere-else)). **fact.**\n  ⇒ a \"clean\" Smart Merge result still needs a review step. **Claude's pick.**\n- Unity's own stance: if scenes/prefabs are exclusively locked, you don't need Smart Merge (same doc). **fact.**\n\n### 3.4 Unity 6 VCS integration status\n- Project Settings > Version Control modes: Visible Meta Files (default, = \"any other VCS\" incl. Git), Hidden Meta\n  Files, Perforce; UVCS via its own package/mode. Editor operations (Check Out, Lock, Get Latest, Resolve) exist for\n  Perforce; UVCS lacks Lock/Resolve in-editor; **Git: none**\n  ([integrations 6000.3](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/versioncontrolintegration)). **fact.**\n- Hook points for a plugin: `AssetDatabase.IsOpenForEdit`, `AssetDatabase.MakeEditable`,\n  `Provider.PreCheckoutCallback`, `Provider.PreSubmitCallback` (same doc). **fact.** Unity's custom VCS provider API\n  for Git is what Anchorpoint and Diversion use (Diversion: set Mode to \"Diversion\",\n  [page](https://www.diversion.dev/unity-integration)). **fact.**\n\n### 3.5 Asset previews\n- Anchorpoint: grid thumbnails for images/EXR, 3D viewer for FBX in the side panel ([home](https://www.anchorpoint.app/)).\n  Gluon: previews for unloaded files ≤1 MiB ([docs](https://docs.unity.com/en-us/unity-version-control/gluon/configure-workspace)).\n  Diversion: \"Art Previews\" (Pro). **fact.**\n- For gitgud (**Claude's pick**): Rust-side decode of PNG/JPG/TGA/PSD-composite/EXR via the `image` crate family,\n  side-by-side + swipe/onion compare between commits (LFS blobs fetched on demand); for `.prefab`/`.unity`: a\n  **structural diff** (GameObject tree, components, changed fields, resolved by GUID → asset path through `.meta`)\n  instead of raw YAML. 3D (FBX) thumbnails: **open** (cost vs. value).\n\n## 4. How game teams work day to day (step lists; ⚠ = painful today)\n\nSources for pains: §2 citations, [Fork #1862](https://github.com/fork-dev/TrackerWin/issues/1862),\n[UVCS forum](https://discussions.unity.com/t/unity-version-control-why-is-it-terrible/1647889),\n[GitHub LFS budget threads](https://github.com/orgs/community/discussions/151710). Step order is **Claude's synthesis**.\n\n**Artist (Git + LFS, Unity)**\n1. Pull latest. ⚠ LFS downloads every changed binary; slow, eats owner's bandwidth quota.\n2. Find the asset, check nobody is on it. ⚠ No \"who has this file\" in Sourcetree/GitHub Desktop; ask in chat.\n3. Lock it. ⚠ CLI `git lfs lock` or nothing; read-only files confuse Unity (it ignores the flag).\n4. Edit in DCC tool, export to Unity, Unity rewrites `.meta`/import settings.\n5. Commit asset + meta. ⚠ Easy to miss the `.meta` or commit Library noise; no preview of what changed visually.\n6. Push. ⚠ Locks stay held after push in every Git GUI ([#2671](https://github.com/git-lfs/git-lfs/issues/2671)).\n7. Unlock. ⚠ Manual, per file, often forgotten → \"who locked this?\" days later.\n\n**Designer (scenes/prefabs)**\n1. Pull; open scene. ⚠ If a teammate edits the same scene, conflict appears only at merge.\n2. Edit prefab/scene. 3. Commit. ⚠ Unity dirty-saves touch unrelated files (`SetDirty` without change,\n   [Unity](https://docs.unity.com/en-us/engine/6000.3/manual/get-started/project-configuration/version-control/versioncontrolintegration)).\n4. Merge/pull conflict on `.unity`/`.prefab`. ⚠ GUI shows raw YAML conflict markers; Smart Merge needs hand-written\n   `.git/config`; silent-bad-merge bugs (§3.3); fallback = \"take mine/theirs\" and redo work.\n\n**Programmer**\n1. Branch, code, commit hunks (normal Git). 2. Rebase/merge main. ⚠ `.meta`, `ProjectSettings`, `Packages/manifest.json`\n   conflicts; scary history edits with LFS pointers. 3. Push, PR, CI. ⚠ CI clone pulls all LFS → bandwidth bill.\n\n**Lead / tech artist**\n- Set up `.gitattributes` (LFS + lockable), `.gitignore`, Force Text, Smart Merge per machine. ⚠ Per-machine config\n  drift; new hires break it. Large clone for new joiners ⚠ (hours; Anchorpoint's 1 TB push took 30 h).\n\n**Locking etiquette (observed rules):** lock before edit, only binaries + scenes/prefabs, release on push, force-unlock\nlogged, never restructure folders while others work ([Anchorpoint](https://docs.anchorpoint.app/git/file-locking/)). **fact.**\n\n## 5. Opinions and data\n\n- **Usage:** JetBrains 2025 (see §0.1). Perforce/JetBrains *Game Technology Report 2025*: 86% of 521 respondents use\n  version control (69% in 2024) ([press](https://www.perforce.com/press-releases/state-of-game-technology-report-2025));\n  2024 report: 54% use Git-based tools ([press 2024](https://www.perforce.com/press-releases/state-of-game-technology-report-2024)). **fact.**\n- **Asset sharing is still messy:** besides VCS (48–49%), teams share art via Google Drive (33–38%), email, Dropbox\n  ([JetBrains](https://lp.jetbrains.com/the-state-of-gamedev-2025/)). **fact.**\n- **LFS horror stories:** collaborators blocked from cloning when the owner's LFS budget runs out; CI jobs burning\n  quota ([GitHub #151710](https://github.com/orgs/community/discussions/151710),\n  [#176047](https://github.com/orgs/community/discussions/176047), [ryp 2023](https://ryp.github.io/2023/git-lfs-and-github-free-tier)). **fact.**\n- **HN on Lore (1,276 pts):** consensus that Git is weak at binaries/locking and Lore targets Perforce, not Git for\n  code; skepticism about LLM-written docs and a binary-only desktop client\n  ([HN](https://news.ycombinator.com/item?id=48571081)). **fact (paraphrase).**\n- **Artists:** non-technical artists \"detest Perforce\", like Fork, but manual unlocking \"is a lot to ask\"\n  ([Fork #1862](https://github.com/fork-dev/TrackerWin/issues/1862)). Content creators confused by stage/commit split\n  (same thread, 2024). **fact.**\n- **Reddit:** r/gamedev and r/Unity3D JSON search was blocked from this environment; not used. **open.**\n\n## 6. How gitgud can transform it (mapped to Max's four pains)\n\n| # | Proposal | Pain | Evidence | Label |\n|---|---|---|---|---|\n| T1 | **Native LFS lock panel**: `git lfs locks --verify --json` on fetch + every N min; lock badge + owner on every file row; lock/unlock from context menu; \"locked by someone else\" warning *before* you edit/stage | 4 | No Git GUI does this well (§2.8); API is complete (§2.9) | Claude's pick |\n| T2 | **Unlock-on-push** done right: after a successful push, offer a checklist of *your* locks whose files are in the pushed commits (default ticked), never auto-silently | 4 | open since 2017 ([#2671](https://github.com/git-lfs/git-lfs/issues/2671)); a Fork user argued unlocking must stay conscious ([#605](https://github.com/fork-dev/TrackerWin/issues/605)) | Claude's pick |\n| T3 | **Auto-lock suggestion on first modify** of a `lockable` file (file watcher), one click to lock; refuse to stage a lockable file locked by someone else | 4 | Anchorpoint auto-lock ([docs](https://docs.anchorpoint.app/git/file-locking/)); UVCS lock-only-latest ([Smart Locks](https://docs.unity.com/en-us/unity-version-control/smart-locks)) | Claude's pick |\n| T4 | **Use LFS locks, not a private lock server** — works on GitHub/GitLab/Azure/Gitea with zero infra | 4 | Hosts table §2.9; Anchorpoint's own server forces lock-in | Claude's pick |\n| T5 | **Unity Smart Merge as a merge driver**, auto-detected from Unity Hub installs, configured in `.git/config` by gitgud; conflicted scenes/prefabs open in a **structural 3-way view** (GameObject/component/field), with \"UnityYAMLMerge said clean — review these N changed objects\" | 2 | §3.3 docs + known silent-merge bugs | Claude's pick (driver behaviour: open, spike) |\n| T6 | **`.meta` guard**: stage/unstage/discard/rename asset+meta as one unit; pre-commit checks for orphan/missing meta, GUID collisions | 2, 3 | Unity meta rules §3.1 | Claude's pick |\n| T7 | **Structural prefab/scene diff** (not YAML) in history and staging, GUIDs resolved to asset names | 2, 4 | No tool found that does this for Git | Claude's pick |\n| T8 | **Binary previews**: image side-by-side/swipe across commits; LFS blobs fetched lazily only for the preview | 4 | Anchorpoint/Gluon/Diversion all treat previews as core (§3.5) | Claude's pick |\n| T9 | **LFS-aware speed**: read status/log via `gix` without smudging; show pointer vs. hydrated state; lazy `lfs.fetchinclude` per folder (\"Gluon for Git\" = sparse checkout + fetchinclude UI) | 1 | Anchorpoint 1 TB numbers; Gluon model; LFS config §2.9 | Claude's pick; sparse checkout in v1: open |\n| T10 | **LFS cost/health panel**: local cache size, `git lfs prune` with preview, warn when a push adds > X MB to LFS (GitHub bills full re-upload) | 1 | GitHub billing example (§2.9) | proposal |\n| T11 | **Safe history edits with LFS**: preview of what a rebase/amend does to LFS pointers and locks; undo via reflog | 3 | locks are path-based, history edits don't move them (API) | proposal |\n| T12 | **One-click Unity repo setup**: `.gitattributes` (LFS + lockable for `*.unity`, `*.prefab`, textures, models, audio), `.gitignore` template, Force Text check, Smart Merge driver | 4 | per-machine config drift (§4) | Claude's pick |\n| T13 | **Small Unity editor package** (later): lock state in Project view + checkout-on-edit via `AssetDatabase.IsOpenForEdit`/`MakeEditable`, talking to gitgud's CLI | 4 | Unity ignores read-only; plugins are required (§3.4) | open (scope: v1 or later?) |\n| T14 | **Agent-friendly locks**: gitgud CLI/MCP exposes `locks list/lock/unlock` so an agent can see \"this prefab is locked by Ana\" before touching it | 4 | Max's answer 5; Anchorpoint-for-Lore advertises AI-agent review ([docs](https://docs.anchorpoint.app/lore/quick-start/)) | Claude's pick |\n\nOpen questions for Max: **(a)** which host his Unity repos use (decides whether LFS locks work, §2.9);\n**(b)** solo or with artists (decides T3/T13 priority); **(c)** Lore: ignore, or keep `gitgud-core` VCS-agnostic?\n", "workflows": "# How developers use Git today (track C, section 2)\n\nResearch, 2026-11-21. All links checked 2026-11-21 unless marked otherwise. Labels: **fact** (sourced),\n**Claude's pick**, **open**. Nothing here is decided. Screenshots: `shots/workflows.json` (prefix `wf-`).\n\nMax's four pains, used as tags below: **P1** slow on big/LFS repos · **P2** Unity merge conflicts ·\n**P3** scary history edits · **P4** clunky UI/workflow.\n\n## 0. Ten-line summary\n\n1. Trunk-based + short-lived branches + PR is the default; GitFlow is called \"legacy\" by Atlassian itself. fact\n2. Stacked PRs went mainstream in 2026: GitHub shipped them natively (preview 2026-07-30, GA 2026-10-06); Cursor bought Graphite (2025-12). fact\n3. Git itself is catching up with jj/GitButler-style history editing: `git history reword|split` (2.54), `fixup` (2.55), `drop` (2.56); all refuse to run into conflicts and rewrite descendant branches. fact\n4. Worktrees went from niche to normal because of parallel AI agents; their pains are setup cost, disk, cleanup, LFS. fact\n5. Agents now start >40% of GitHub PRs (Sept 2026, up from 17% in March). Review, not writing, is the bottleneck. fact\n6. Big-repo Git keeps getting better server-side (geometric maintenance default, `backfill`,
