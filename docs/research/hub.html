`last-modified`, path-walk packs, fsmonitor on Linux), but a GUI has to opt into it. fact\n7. Unity game dev still needs three things Git doesn't give by default: LFS locking that actually works, `UnityYAMLMerge`, and binary previews. fact\n8. jj ideas (op log undo, non-blocking conflicts, auto-rebase of descendants, change IDs) are the reference for \"safe history edits\". fact\n9. gitgud's opening: make history edits and agent output **previewable and undoable**, and make big/LFS repos fast by default. Claude's pick\n10. Least useful to chase: GitFlow tooling, submodule UX polish, conventional-commit linters. Claude's pick\n\n## 1. Workflows as step sequences\n\n⚠ = painful step today, with why and source. Tags say which of Max's pains it hits.\n\n### W1. Trunk-based: short-lived branch + PR (the default)\n\nfact: Atlassian calls trunk-based \"a required practice for CI\" and Gitflow \"a legacy Git workflow\"\n([trunk-based](https://www.atlassian.com/continuous-delivery/continuous-integration/trunk-based-development),\n[Gitflow](https://www.atlassian.com/git/tutorials/comparing-workflows/gitflow-workflow)). Octoverse 2025: commits\nare getting smaller, PRs shorter and single-purpose, feature flags ship unfinished work\n([GitHub blog, 2025-11-07](https://github.blog/news-insights/octoverse/what-986-million-code-pushes-say-about-the-developer-workflow-in-2025/)).\n\n1. `git switch -c feat/x` from fresh `main` (needs a fetch first).\n2. Edit; stage hunks; commit small. ⚠ **P4** hunk staging in IDEs and Sourcetree is click-heavy; `git add -p` is terminal-only. Git 2.54 added hunk-decision status to `add -p` because reviewing your own staging choices was hard ([2.54](https://github.blog/open-source/git/highlights-from-git-2-54/)).\n3. Push, open PR in browser.\n4. Address review: more commits or fixups (see W3).\n5. `main` moved: rebase or merge `main` in. ⚠ **P2/P3** conflicts mid-rebase leave a half-applied state; with Unity YAML they're unreadable (W6).\n6. Squash-merge on host; delete local branch. ⚠ **P4** stale local branches pile up; Git 2.56 added `git branch --delete-merged … --dry-run` exactly for this ([2.56](https://github.blog/open-source/git/highlights-from-git-2-56/)).\n\n### W2. GitFlow (legacy, still in release-based shops)\n\n1. `develop` + `feature/*` → `release/*` → `main` + tag → `hotfix/*` back-merged twice.\n2. ⚠ **P4** long-lived branches, larger commits, double back-merges ([Atlassian](https://www.atlassian.com/git/tutorials/comparing-workflows/gitflow-workflow)). Common in game studios with milestone builds (open: no 2025+ data found).\n- Claude's pick: no GitFlow wizard. Branch-prefix folders in the sidebar are enough.\n\n### W3. Stacked PRs\n\nfact: GitHub stacked PRs: public preview 2026-07-30, GA 2026-10-06, created with the `gh stack` extension; merging a\nlower layer auto-rebases and retargets the ones above; same-repo only; **not supported in GitHub Desktop**\n([GA changelog](https://github.blog/changelog/2026-10-06-stacked-pull-requests-generally-available),\n[docs](https://docs.github.com/en/pull-requests/get-started/about-stacked-prs)). 264k developers used them by\nSeptember ([Octoverse 2026](https://github.blog/news-insights/octoverse/octoverse-commits-pushes-reach-new-highs-in-2026-as-developers-build-with-agents/)).\nGraphite (`gt create/modify/restack/sync/submit`) is the incumbent ([docs](https://graphite.com/docs/cli-quick-start)); Cursor agreed to buy it 2025-12-19\n([Cursor](https://cursor.com/blog/graphite), [TechCrunch](https://techcrunch.com/2025/12/19/cursor-continues-acquisition-spree-with-graphite-deal)).\nOther stackers: GitButler stacks, Sapling (meta/sapling, 7.3k★), ghstack (1.0k★), plain `git rebase --update-refs`\n([git-rebase](https://git-scm.com/docs/git-rebase)). Stars via GitHub API, 2026-11-21.\n\n1. Branch A off `main`, commit; branch B off A, commit; branch C off B.\n2. Open PRs: A→main, B→A, C→B.\n3. Reviewer asks for a change in A. Amend A. ⚠ **P3** B and C now sit on the old A. Plain Git needs `rebase --update-refs` (doesn't move branches checked out in other worktrees) or a per-branch rebase ([git-rebase](https://git-scm.com/docs/git-rebase)).\n4. Force-push all three. ⚠ **P3** force-push fear; easy to push the wrong set.\n5. A merges (often squash). ⚠ **P3** B must be rebased onto new `main` with the squashed commits dropped. HN users report `gh stack rebase` struggling after squash merges and whole-stack merge \"broken in many cases\" during preview ([HN, 783 pts, 2026-07-30](https://news.ycombinator.com/item?id=49112232)).\n6. Repeat up the stack.\n- HN sentiment (paraphrased): stacks are mostly welcomed as a way to cut giant (often AI-written) PRs into reviewable layers; a minority argues curated commits reviewed one by one do the same ([same thread](https://news.ycombinator.com/item?id=49112232)).\n\n### W4. Cleaning up history before review (fixup / autosquash / absorb / `git history`)\n\n1. Spot a bug in commit 3 of 5.\n2. `git commit --fixup=<sha>` (needs the SHA) ⚠ **P4** finding the SHA. `git absorb` picks the target commit per hunk by commutation, port of `hg absorb`, 5.8k★ ([repo](https://github.com/tummychow/git-absorb)).\n3. `git rebase -i --autosquash main` ⚠ **P3** todo-list editing in a text editor; a conflict leaves you mid-rebase ([git-rebase](https://git-scm.com/docs/git-rebase), [2.54 post](https://github.blog/open-source/git/highlights-from-git-2-54/)).\n4. Reword an old message / split a commit. Git now has targeted commands: `git history reword` and `split` (2.54), `fixup` (2.55), `drop` (2.56). They don't touch the working tree, **refuse to run when a conflict would result**, don't handle merge commits, and rewrite every local branch descended from the commit ([2.54](https://github.blog/open-source/git/highlights-from-git-2-54/), [2.55](https://github.blog/open-source/git/highlights-from-git-2-55/), [2.56](https://github.blog/open-source/git/highlights-from-git-2-56/)). Experimental.\n5. Force-push. ⚠ **P3** undo is the reflog, which few people read.\n- HN (paraphrased, [457 pts, 2026-07-14](https://news.ycombinator.com/item?id=48901010)): people like the low-friction rewrites; one user notes `git history` can't sign the commits it rewrites (unverified, open); a self-described game dev says rewriting history \"gives me the willies\" and prefers new commits.\n- Claude's pick: gitgud runs every history edit as a **preview first** (new graph shown, conflicts predicted via `git replay`/`merge-tree` style dry run), then one-click undo from its own op log.\n\n### W5. Parallel work: worktrees (now: one agent per worktree)\n\nfact: GitHub says worktrees gained popularity because AI pushed developers to work in parallel; drawbacks are\nper-worktree dependency installs (disk), manual cleanup, and one branch per worktree; the GitHub Copilot app opens new\nsessions in a worktree by default ([GitHub blog, 2026-06-16](https://github.blog/ai-and-ml/github-copilot/what-are-git-worktrees-and-why-should-i-use-them/)).\nClaude Code (`--worktree`, `.claude/worktrees/<name>`, branch `worktree-<name>`), Cursor (`.cursor/worktrees.json`, auto-delete beyond 25),\nCodex app (detached HEAD worktrees, deleted with the thread) all default to it\n([Claude Code](https://code.claude.com/docs/en/worktrees), [Cursor](https://cursor.com/docs/configuration/worktrees), [Codex](https://developers.openai.com/codex/app/worktrees)).\n\n1. `git worktree add ../repo-task -b task`.\n2. Copy ignored setup files (`.env`) in. ⚠ **P4** every tool invented its own: `.worktreeinclude` (Claude Code, Codex), `worktrees.json` (Cursor).\n3. Install deps / import project. ⚠ **P1** Trigger.dev: per-worktree Postgres/Redis/dev server, port clashes, ~10 GB `node_modules` per copy; setup cost exceeded the work ([2026-04-16](https://trigger.dev/blog/parallel-agents-gitbutler)). For Unity, a fresh worktree means a full `Library/` re-import (open: no measured source; Claude's estimate is minutes to hours on a big project).\n4. LFS content. ⚠ **P1** Claude Code worktrees get LFS *pointer files* if LFS was installed with `--local`, because it skips repo-defined filter drivers for safety ([docs](https://code.claude.com/docs/en/worktrees)).\n5. Work, commit, merge back. ⚠ **P4** each worktree is invisible to the GUI you have open on the main checkout.\n6. Clean up. ⚠ **P4** locked/stale worktrees, sweeps with different rules per tool ([Claude Code](https://code.claude.com/docs/en/worktrees), [Cursor](https://cursor.com/docs/configuration/worktrees)).\n- Alternative: GitButler parallel branches in one working directory (no copy, shared runtime; breaks when two agents touch the same file) ([GitButler](https://docs.gitbutler.com/ai-agents/parallel-agents)); jj workspaces ([jj](https://docs.jj-vcs.dev/latest/operation-log/)).\n\n### W6. Unity project with LFS and locking (Max's daily case)\n\n1. Clone; `git lfs pull`. ⚠ **P1** slow, and GUIs re-scan everything.\n2. Before editing a scene/prefab: `git lfs lock Assets/X.prefab`. ⚠ **P4** only works if `.gitattributes` marks it `lockable`; few LFS servers implement locking; when locks can't be verified the push isn't halted ([git-lfs wiki, edited 2025-10-04](https://github.com/git-lfs/git-lfs/wiki/File-Locking)).\n3. Edit in Unity; `.meta` files change alongside. ⚠ **P4** missing/orphan `.meta` is a classic Unity breakage (open: needs a 2025+ source; other track).\n4. Pull teammate's changes → conflict in `.unity`/`.prefab` YAML. ⚠ **P2** Unity's `UnityYAMLMerge` is documented only as a `git mergetool`, not as a merge driver; `.asset`, `.mat`, `.controller` go to the fallback tool unless `--force` ([Unity 6 manual](https://docs.unity.com/en-us/engine/6000.0/manual/get-started/project-configuration/version-control/smart-merge)).\n5. Commit, push, `git lfs unlock`. ⚠ **P4** forgotten locks block teammates; `--force` unlock rights vary by server ([wiki](https://github.com/git-lfs/git-lfs/wiki/File-Locking)).\n- Note: the official MCP git server empties repo-defined merge drivers, so an agent merge that relies on a repo-level `UnityYAMLMerge` driver would just conflict ([README](https://github.com/modelcontextprotocol/servers/tree/main/src/git)).\n\n### W7. Big repo / monorepo\n\nfact: Scalar clones as partial clone + sparse checkout + background maintenance ([scalar](https://git-scm.com/docs/scalar)).\nRecent Git: `git backfill` batches missing blobs in partial clones (2.49; ranges/pathspecs 2.54); `git last-modified`\ngives per-entry last commit for a directory ~5.5× faster than `ls-tree`+`log` (2.52); geometric repacking default for\n`git maintenance` (2.54); `core.fsmonitor` on Linux via inotify (2.55); `repack --filter=blob:limit --drop-filtered`\nto evict local large blobs (2.56); reftable becomes the default in Git 3.0\n([2.49](https://github.blog/open-source/git/highlights-from-git-2-49/), [2.51](https://github.blog/open-source/git/highlights-from-git-2-51/),\n[2.52](https://github.blog/open-source/git/highlights-from-git-2-52/), [2.54](https://github.blog/open-source/git/highlights-from-git-2-54/),\n[2.55](https://github.blog/open-source/git/highlights-from-git-2-55/), [2.56](https://github.blog/open-source/git/highlights-from-git-2-56/)).\n\n1. Clone (full, or partial/sparse if you know the flags). ⚠ **P1** most GUIs don't offer partial/sparse at clone time (open: confirm in landscape track).\n2. Daily `status` / `log` / file history. ⚠ **P1** without fsmonitor + commit-graph + maintenance these are slow; GUIs poll.\n3. Blame or file browser in a partial clone. ⚠ **P1** one blob fetched at a time unless `backfill` runs first ([2.49](https://github.blog/open-source/git/highlights-from-git-2-49/)).\n4. Housekeeping. ⚠ **P1** nobody runs `git maintenance start` by hand.\n- Claude's pick: gitgud turns on `maintenance`, fsmonitor and commit-graph for a repo on first open (with one confirm), and uses `last-modified`-style data for the file tree.\n\n### W8. Commit hygiene: signing and conventional commits\n\n1. Configure SSH signing (`gpg.format=ssh`, `user.signingkey`). GitHub verifies GPG, SSH and S/MIME; vigilant mode marks unsigned commits \"Unverified\" ([GitHub docs](https://docs.github.com/en/authentication/managing-commit-signature-verification/about-commit-signature-verification)). ⚠ **P4** setup is three config keys plus uploading the key; tools that rewrite history (rebase, `git history` per an HN user) can drop signatures.\n2. Write a message in Conventional Commits form if the team uses it. ⚠ **P4** contested: an HN thread argues it focuses on the wrong things ([372 pts, 2026-06-05](https://news.ycombinator.com/item?id=48414027)). Aider defaults its AI messages to Conventional Commits ([aider](https://aider.chat/docs/git.html)).\n- Claude's pick: show signature status per commit; respect `commit.gpgSign` in every write (CLI does it for free). No conventional-commit linter in MVP.\n\n### W9. Submodules\n\n1. Clone with `--recurse-submodules`, or forget and get empty folders. ⚠ **P4**\n2. Update pointer, commit in two repos in the right order. ⚠ **P4/P3** detached HEAD inside the submodule.\n- Little new in 2025–26 (Git 2.51: `cat-file` reports submodule entries ([2.51](https://github.blog/open-source/git/highlights-from-git-2-51/))). Claude's pick: show submodule state clearly, nothing more in MVP.\n\n### W10. Undo / recovery\n\n1. Something went wrong (bad rebase, reset, dropped stash).\n2. `git reflog`, find the entry, `reset --hard`. ⚠ **P3** per-ref, cryptic, doesn't cover the index or the working tree.\n- jj: the operation log records every repo-changing operation as a view (refs, heads, working-copy commit); `jj undo`, `jj op revert`, `jj op restore` ([jj docs](https://docs.jj-vcs.dev/latest/operation-log/)). GitButler has `but oplog` ([docs](https://docs.gitbutler.com/ai-agents/overview)). Git 2.51 added `stash export/import` to move stashes as refs ([2.51](https://github.blog/open-source/git/highlights-from-git-2-51/)).\n- Claude's pick: gitgud keeps its own op log (snapshot of refs + index tree + working-tree stash commit before every write) so \"Undo\" works for every action, agent actions included.\n\n### W11. Agent writes code, human reviews (the new loop)\n\nDetail in [agents.md](agents.md). Short version:\n\n1. Start agent (often in a worktree).\n2. Agent edits; some tools auto-commit (Aider commits every edit ([docs](https://aider.chat/docs/git.html))), others leave changes uncommitted (Claude Code, Codex review pane).\n3. Human reviews diff in the agent's own UI (Claude Code desktop, Codex review pane, Cursor) or on the host PR. ⚠ **P4** the review happens in the agent tool, not in the Git tool; ⚠ big, multi-file diffs: 87% of agent-started PRs touch multiple files vs 79% of others ([Octoverse 2026](https://github.blog/news-insights/octoverse/octoverse-commits-pushes-reach-new-highs-in-2026-as-developers-build-with-agents/)).\n4. Split into commits / PRs. ⚠ **P3/P4** agents produce one blob of changes; splitting is manual.\n5. Commit with co-author trailer; push; PR.\n\n### jj ideas leaking into Git tooling (cross-cutting)\n\n| jj idea | Where it shows up in Git land (fact) |\n|---|---|\n| Op log + undo | GitButler `but oplog`; Git has only reflog ([jj](https://docs.jj-vcs.dev/latest/operation-log/), [GitButler](https://docs.gitbutler.com/ai-agents/overview)) |\n| Descendants auto-rebase | `git history` rewrites all descendant local branches; GitHub stacks auto-retarget ([2.54](https://github.blog/open-source/git/highlights-from-git-2-54/), [GitHub](https://docs.github.com/en/pull-requests/get-started/about-stacked-prs)) |\n| Edit without touching worktree | `git replay`, `git history` operate without the working tree ([2.54](https://github.blog/open-source/git/highlights-from-git-2-54/), [2.56](https://github.blog/open-source/git/highlights-from-git-2-56/)) |\n| First-class (non-blocking) conflicts | Not in Git. `git history` refuses instead; 2.55 `checkout -m` stashes conflicted changes so you can resolve later ([2.55](https://github.blog/open-source/git/highlights-from-git-2-55/)) |\n| No staging area / working copy is a commit | GitButler's \"uncommitted area\" assigned to branches; agent advocates argue it removes forgotten-staging mistakes ([Amplify, 2026-05-20](https://amplifypartners.com/blog-posts/will-agents-like-git-any-more-than-we-do)) |\n\nInterest: HN \"jj – the CLI for Jujutsu\" 549 pts (2026-04-14), jj repo 32.6k★; jj's creator joined ERSC, a company building a jj backend (HN 265 pts, 2026-09-01)\n([HN](https://news.ycombinator.com/item?id=47763759), [HN](https://news.ycombinator.com/item?id=49525297), stars via GitHub API).\n\n## 2. Data\n\n| Source | Finding | Label |\n|---|---|---|\n| [SO Survey 2025, AI](https://survey.stackoverflow.co/2025/ai) (49k+ resp.) | 84% use or plan to use AI tools; 51% of pros daily. 46% distrust AI accuracy vs 33% trust. Top frustration (66%): \"almost right, but not quite\". | fact |\n| same, `#3-ai-agents` | AI agents at work: 14.1% daily, 9% weekly; 37.9% no plans. | fact |\n| same, dev workflow | \"Committing and reviewing code\": 10.2% mostly AI, 22.6% partially, **58.7% don't plan to** use AI for it. Humans want to keep the commit/review step. | fact |\n| [SO Survey 2025, tech](https://survey.stackoverflow.co/2025/technology/) | GitHub used by 81.1%, GitLab 35.6%. No separate Git question this year. IDE list: Cursor 17.9%, Claude Code 9.7%. | fact |\n| [JetBrains DevEco 2025](https://devecosystem-2025.jetbrains.com/) via [The Register](https://www.theregister.com/2025/10/21/massive_jetbrains_dev_survey) (24.5k resp.) | 85% use AI coding tools; 19% save 8+ h/week; Cursor raw responses 135 → 2,300+. No Git/VCS questions found. | fact |\n| [Octoverse 2025](https://github.blog/news-insights/octoverse/octoverse-a-new-developer-joins-github-every-second-as-ai-leads-typescript-to-1/) | 43.2M merged PRs/month (+23%); smaller, more frequent commits ([pushes post](https://github.blog/news-insights/octoverse/what-986-million-code-pushes-say-about-the-developer-workflow-in-2025/)). | fact |\n| [Octoverse 2026](https://github.blog/news-insights/octoverse/octoverse-commits-pushes-reach-new-highs-in-2026-as-developers-build-with-agents/) (2026-10-28) | Agents start >40% of PRs (Sept) vs 17% (March), 110M in Sept. Agent PRs merged within 2 weeks: 83% → 90%; others ~86%. 17.9B pushes, 34.3B commits, 1.3B merged PRs. AI code review usage +90% YoY. Stacked PRs: 264k users by Sept. | fact |\n| HN signal | Stacked PRs launch 783 pts; `git history` 457 pts; jj CLI 549 pts; worktrees+tmux for LLMs 156 pts ([HN](https://news.ycombinator.com/item?id=44116872)). | fact |\n\nRead: commit volume tripled in two years and most new PRs start with an agent, but most developers don't want AI to\nown committing/reviewing. The human review step is the one to make fast. Claude's pick\n\n### Git release features a GUI should use (2.45 → 2.56)\n\n| Version | Feature | GUI use | Status |\n|---|---|---|---|\n| 2.44–2.56 | `git replay` (added 2.44, source 2024: [post](https://github.blog/open-source/git/highlights-from-git-2-44/), not re-checked; atomic refs + `--revert` 2.54, `--linearize` 2.56) | Rebase/cherry-pick preview without touching worktree | experimental |\n| 2.45 / 3.0 | reftable; default in Git 3.0 | `gix` must read it | fact ([2.51](https://github.blog/open-source/git/highlights-from-git-2-51/)) |\n| 2.49 | `git backfill`, `clone --revision`, name-hash v2 | Fast blame/history in partial clones | fact |\n| 2.51 | `stash export/import`, `switch`/`restore` stable | Stash sync, safe op-log | fact |\n| 2.52 | `git last-modified`, `git repo info/structure`, `sparse-checkout clean` | File tree \"last commit\" column; repo health panel | fact |\n| 2.54 | `git history reword/split`, config-based hooks + `git hook list`, `rebase --trailer`, geometric maintenance default, `status.compareBranches` | Hunk-split UI, hooks panel, trailer stamping | experimental / fact |\n| 2.55 | `git history fixup`, fsmonitor on Linux, `checkout -m` autostash, `log --graph-lane-limit` | Fixup-to-commit drag, portable file watching | experimental / fact |\n| 2.56 | `git history drop`, `git add --resolved`, `branch --delete-merged --dry-run`, `bisect run --reset-when-found`, faster merge-base | Safe conflict staging, branch cleanup preview | experimental / fact |\n\nAll from GitHub's \"Highlights from Git\" posts linked above. `git history` name verified; \"`git last-modified`\" verified (2.52).\n\n## 3. Pains gitgud can solve\n\n| Max's pain | Painful step (from §1) | Evidence | What gitgud could do | Label |\n|---|---|---|---|---|\n| P1 slow big/LFS | W7.2 status/log polling; W6.1 LFS pull; W7.3 blob-at-a-time blame | [2.49](https://github.blog/open-source/git/highlights-from-git-2-49/), [2.55](https://github.blog/open-source/git/highlights-from-git-2-55/) | `gix` reads + file watcher (fsmonitor where present), never poll; enable maintenance/commit-graph on open; `backfill` before blame in partial clones; LFS progress with per-file status | Claude's pick |\n| P1 | W5.3–4 worktree setup, LFS pointers | [Trigger.dev](https://trigger.dev/blog/parallel-agents-gitbutler), [Claude Code](https://code.claude.com/docs/en/worktrees) | One worktree panel across all tools' worktrees; \"hydrate\" action (LFS pull + copy ignored files) | Claude's pick |\n| P2 Unity conflicts | W6.4 YAML conflict, mergetool-only | [Unity manual](https://docs.unity.com/en-us/engine/6000.0/manual/get-started/project-configuration/version-control/smart-merge) | Register `UnityYAMLMerge` as merge driver/mergetool from a settings toggle; conflict view that names GameObjects, not YAML lines; `add --resolved` to stage only resolved files ([2.56](https://github.blog/open-source/git/highlights-from-git-2-56/)) | Claude's pick; driver feasibility open (spike) |\n| P2 | W6.2/W6.5 locks | [LFS wiki](https://github.com/git-lfs/git-lfs/wiki/File-Locking) | Lock-before-edit prompts on lockable files, lock owner badges in tree, unlock reminder on push | Claude's pick |\n| P3 scary history | W3.3–5 restack; W4.3 rebase -i; W10 reflog | [git-rebase](https://git-scm.com/docs/git-rebase), [2.54](https://github.blog/open-source/git/highlights-from-git-2-54/), [jj op log](https://docs.jj-vcs.dev/latest/operation-log/) | Every rewrite: preview graph + predicted conflicts → apply → undo from gitgud op log. Drag hunk onto commit = `history fixup`/absorb. Restack descendants automatically (`--update-refs` semantics) | Claude's pick |\n| P3 | W4.5 force-push | HN [thread](https://news.ycombinator.com/item?id=48901010) | Always `--force-with-lease`; show exactly which remote branches change | Claude's pick |\n| P4 clunky UI | W1.2 hunk staging; W1.6 stale branches; W5.5 invisible worktrees | [2.54](https://github.blog/open-source/git/highlights-from-git-2-54/), [2.56](https://github.blog/open-source/git/highlights-from-git-2-56/) | Keyboard hunk/line staging; branch cleanup with dry-run list; worktrees as first-class sidebar items | Claude's pick |\n| P4 | W11.3–4 agent review in the wrong tool | [Octoverse 2026](https://github.blog/news-insights/octoverse/octoverse-commits-pushes-reach-new-highs-in-2026-as-developers-build-with-agents/), [SO 2025](https://survey.stackoverflow.co/2025/ai) | Agent proposals land in gitgud as reviewable draft commits (see agents.md) | Claude's pick |\n| P4 | W3 stacks | [GitHub](https://docs.github.com/en/pull-requests/get-started/about-stacked-prs) | Show stacks in the graph; \"open next PR in browser\" with the right base. No host API (decided scope) | Claude's pick |\n\n## 4. Open\n\n- Does `UnityYAMLMerge` work as a `merge.<driver>.driver` (non-interactive)? → spike.\n- Unity `Library/` re-import cost per worktree: no measured source found.\n- Whether `git history` drops signatures: one HN user's claim, not in Git docs.\n- JetBrains 2025 AI-delegation figures didn't render in fetch; numbers via The Register only.\n", "agents": "# Agent interfaces: how agents touch Git, and how gitgud should take their work (track C)\n\nResearch, 2026-11-21. All links checked 2026-11-21; GitHub stars via `gh api` the same day. Labels: **fact**,\n**Claude's pick**, **open**. Screenshots in `shots/workflows.json` (`wf-` prefix).\n\nMax's answer 5 (decided 2026-11-21): \"a MCP or CLI for agent to easily interact and prepare the commits for the\nuser\". AI agents stage and draft commits; Max reviews them in gitgud.\n\n## 1. Existing git MCP servers\n\n| Server | ★ | What it exposes | Notable mechanics | Gap for gitgud |\n|---|---|---|---|---|\n| [Official `mcp-server-git`](https://github.com/modelcontextprotocol/servers/tree/main/src/git) (in modelcontextprotocol/servers) | 92.1k (whole monorepo) | 14 tools: `git_status`, `git_diff_unstaged/_staged`, `git_diff`, `git_commit`, `git_add`, `git_reset`, `git_log`, `git_create_branch`, `git_checkout`, `git_merge`, `git_show`, `git_branch`, `git_remote`; 2 prompts: `git_commit_message`, `git_summarize_changes` | Treats repo config as hostile: **no hooks run**, signing forced off, repo-defined filter and merge drivers emptied, no lazy fetch in partial clones, no auto-gc | `git_add` takes **file paths only** (no hunks); commits land directly on the branch; no review step; would break LFS/`UnityYAMLMerge` set up per-repo |\n| [GitHub MCP server](https://github.com/github/github-mcp-server) | 34.6k | Host API toolsets (`repos`, `issues`, `pull_requests`, `actions`, `code_security`, `copilot`…), e.g. `create_branch`, `push_files`, `create_pull_request`, `assign_copilot_to_issue`, `request_copilot_review` | Remote, no local working tree; writes go straight to GitHub | Out of scope (no in-app host APIs, decided) |\n| [cyanheads/git-mcp-server](https://github.com/cyanheads/git-mcp-server) | 245 | ~30 tools: add, blame, branch, checkout, cherry_pick, clean, clone, commit, diff, fetch, log, merge, pull, push, rebase, reflog, reset, stash, tag, **worktree**, plus `git_wrapup_instructions`, `git_changelog_analyze` | STDIO or HTTP; signing via env (`GIT_SIGN_COMMITS`) | Full CLI mirror; no human gate |\n| [idosal/git-mcp](https://github.com/idosal/git-mcp) | 8.5k | Docs/code of a GitHub project for context | Not a VCS tool | n/a |\n| GitButler `but` | gitbutler repo 22.0k | Skill + CLI (see §2). Its MCP docs page and Claude Code hooks page now return 404 | — | open: whether the MCP server still ships |\n| Graphite \"GT MCP\" | — | Listed in Graphite CLI docs sidebar ([docs](https://graphite.com/docs/cli-quick-start)) | not read | open |\n\nTakeaway (Claude's pick): every existing server either mirrors the git CLI 1:1 or hits a host API. **None models\n\"propose → human approves\"**, and none stages hunks. That is gitgud's slot.\n\n## 2. GitButler: the closest prior art\n\nfact ([overview](https://docs.gitbutler.com/ai-agents/overview), [getting started](https://docs.gitbutler.com/ai-agents/getting-started), [parallel agents](https://docs.gitbutler.com/ai-agents/parallel-agents)):\n\n- `but agent setup` wizard installs a GitButler **skill** for Codex, Claude Code, Cursor, Copilot, Windsurf/Devin, OpenCode and writes workflow instructions (shows every file and the exact text before writing).\n- The skill tells the agent to use `but` instead of `git checkout/stash/add/commit/rebase`. Docs say plainly that instructions steer and do not restrict.\n- Commands: `but commit` (selected files **or hunks by ID**), `amend`, `squash`, `uncommit`, `pr`, `merge` (only when authorized), `oplog` (restore earlier state); move/reorder/reword/absorb/split also exist.\n- Parallel agents share **one working directory**; each session's commits go to its own branch. Overlapping files must be called out by the agents.\n- Policy knob: stop after local commits vs allow push/PR.\n- Self-run benchmark ([vcbench.dev](https://vcbench.dev)): ~80% fewer commands, ~60% faster than plain Git, similar reliability (their own benchmark; treat as vendor claim).\n- Earlier integration: Claude Code hooks `but claude pre-tool / post-tool / stop` assigned each session's edits to a branch ([skills.sh mirror](https://skills.sh/outfitter-dev/agents/gitbutler-multi-agent)); docs page now 404. Trigger.dev switched from hooks to the skill because hooks assume 1 session = 1 branch ([2026-04-16](https://trigger.dev/blog/parallel-agents-gitbutler)).\n\nWhat to take (Claude's pick): hunk IDs addressable by the agent; an op log the agent and human both can roll back;\na stop-before-push policy. What to avoid: forcing everyone onto a virtual-branch workspace model to get there.\n\n## 3. How agents commit today\n\n| Agent | Isolation | Commits? | Attribution | Human review surface | Source |\n|---|---|---|---|---|---|\n| Claude Code | `--worktree` → `.claude/worktrees/<name>`, branch `worktree-<name>`; subagents `isolation: worktree`; edits to main checkout blocked while isolated | Only when asked; can create PRs via `gh` | Configurable `attribution.commit` / `attribution.pr` (old `includeCoAuthoredBy` deprecated); default trailer observed in this session: `Co-Authored-By: Claude … <noreply@anthropic.com>` | Desktop diff view with per-line comments that go back to Claude; manual mode accept/reject per edit; PR card with CI, auto-fix, merge-when-ready | [worktrees](https://code.claude.com/docs/en/worktrees), [settings ref](https://code.claude.com/docs/en/settings-reference), [desktop](https://code.claude.com/docs/en/desktop) |\n| Codex app | Codex-managed worktrees in detached HEAD, deleted when thread archived; `.worktreeinclude` | Commit, push, PR from the app | — | **Review pane**: scopes Unstaged / Staged / Commit / Branch / Last turn; stage, unstage, revert whole diff, file or chunk; inline comments; `/review` findings as inline comments | [review](https://developers.openai.com/codex/app/review), [worktrees](https://developers.openai.com/codex/app/worktrees) |\n| Cursor | Worktree per agent; `.cursor/worktrees.json` setup scripts; keeps newest 25 | Commit/PR from Agents Window | — | `/apply-worktree` brings results into main checkout; `/best-of-n` runs one task on several models to compare | [docs](https://cursor.com/docs/configuration/worktrees) |\n| Aider | none | **Auto-commits every edit**; commits your dirty files first | `(aider)` suffix on author/committer, or `--attribute-co-authored-by` trailer; messages by a weak model, Conventional Commits by default | `/diff`, `/undo` | [docs](https://aider.chat/docs/git.html) |\n| GitHub Copilot cloud agent | Cloud sandbox / Actions, one branch, one PR per task, 59-min cap | Pushes to its branch, opens PR | — | Host PR. Your own approval doesn't count if approvals are required; workflows don't run until a human clicks \"Approve and run workflows\"; iterate with `@copilot` comments | [about](https://docs.github.com/en/copilot/concepts/agents/coding-agent/about-coding-agent), [review](https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/review-copilot-prs) |\n| GitButler-wrapped agent | one workdir, branch per session | `but commit` with hunk IDs | — | GitButler desktop / `but` | §2 |\n\nOrchestrators (\"review the agent's work\" desktop apps):\n\n| Tool | ★ | Mechanic | Status |\n|---|---|---|---|\n| [Conductor](https://www.conductor.build/) | closed | Mac app: parallel Claude Code / Codex / Cursor agents in isolated workspaces, review and merge | fact (details not on page) |\n| [Sculptor](https://github.com/imbue-ai/sculptor) | 284 | Workspace = isolated copy; review changes, merge to main | research preview |\n| [Crystal → Nimbalyst](https://github.com/stravu/crystal) | 3.1k | Parallel sessions in worktrees, compare approaches | renamed |\n| [vibe-kanban](https://github.com/BloopAI/vibe-kanban) | 28.8k | Kanban issue → workspace (branch, terminal, dev server) → inline diff comments → PR | **sunsetting** (README banner) |\n\nPattern (fact, from the rows above): isolation = worktree; review = a diff with line comments fed back to the agent;\nexit = PR. Nobody offers \"split this into clean commits before it leaves my machine\" except GitButler.\n\nData that sizes the problem: agents start >40% of GitHub PRs (Sept 2026) and 87% of them touch multiple files\n([Octoverse 2026](https://github.blog/news-insights/octoverse/octoverse-commits-pushes-reach-new-highs-in-2026-as-developers-build-with-agents/));\n58.7% of developers don't plan to let AI do \"committing and reviewing code\" ([SO 2025](https://survey.stackoverflow.co/2025/ai)).\n\n## 4. jj and agents\n\n- jj snapshots the working copy into the `@` commit on every command, so there's no \"forgot to stage\" failure; `jj workspace add` is its worktree; op log gives undo of any operation ([jj op log](https://docs.jj-vcs.dev/latest/operation-log/)). fact\n- Advocacy: agents need a simpler state model, non-blocking conflicts, reliable undo, stable change IDs and provenance ([Amplify Partners, 2026-05-20](https://amplifypartners.com/blog-posts/will-agents-like-git-any-more-than-we-do)). Opinion source.\n- Community skills for agents using jj exist (e.g. [skills.sh jj](https://skills.sh/schpet/toolbox/jj)); no first-party agent integration found. open\n- Claude's pick: borrow the *properties* (every agent action snapshotted, undoable, identified by a stable proposal ID), stay on plain Git.\n\n## 5. What should an agent hand to a human?\n\nClaude's pick: a **proposal** = an ordered set of draft commits, not a branch and not a pile of staged files.\n\n| Field | Why | Source of the idea |\n|---|---|---|\n| Base commit (OID) | Lets gitgud detect drift and replay onto current HEAD | `git replay` ([2.54](https://github.blog/open-source/git/highlights-from-git-2-54/)) |\n| 1..n draft commits, each = hunks + message | Reviewable units; Max can approve some, not all | GitButler hunk IDs; stacked PRs |\n| Per-commit \"why\" (1–3 lines) separate from the message | Review context without polluting history | Codex review prompts ask for evidence |\n| Evidence: commands run + result (tests, build, Unity compile) | 66% top frustration is \"almost right\" ([SO 2025](https://survey.stackoverflow.co/2025/ai)) | — |\n| Risk flags computed by gitgud, not the agent: files outside declared scope, binaries/LFS, `.meta` without its asset (or vice versa), lockable file not locked by Max, deleted files | Unity specifics; agents can't be trusted to self-report | LFS locking ([wiki](https://github.com/git-lfs/git-lfs/wiki/File-Locking)) |\n| Agent identity + session link | Attribution trailer and \"go back to the conversation\" | Claude Code attribution, `--from-pr` |\n\nNot in the hand-off: pushes, branch moves, force anything. The agent never touches Max's index or refs. Claude's pick\n\n## 6. gitgud CLI/MCP + GUI approval flow\n\n### Options\n\n| | Mechanism | + | − |\n|---|---|---|---|\n| A | Agent stages into the real index and writes a draft message file; Max commits | Trivial; works with any tool | Fights Max's own staging; one proposal at a time; parallel agents collide |\n| B | Agent commits on its own branch/worktree; gitgud shows \"agent branches\" for review/merge | Matches Claude Code / Codex / Cursor today; zero new concepts | Splitting/rewording happens after the fact (history edits, P3); worktree setup cost (W5) |\n| **C** | **Proposals as hidden refs**: agent calls `propose(hunks, message, why)`; gitgud builds commits with plumbing (no index, no worktree change) under `refs/gitgud/proposals/<id>`, metadata in a sidecar JSON; GUI inbox to review, edit, approve | Max's index and branches untouched; multiple agents in parallel; edit before it becomes history; survives restarts; plain Git objects | New concept to learn; needs hunk-ID stability; conflicts when Max edits the same lines meanwhile |\n| D | Virtual-branch workspace (GitButler model) | Proven | Replaces Max's mental model; heavy |\n\n**Claude's pick: C, with B as a supported input** (gitgud also lists `.claude/worktrees`, Codex and Cursor worktrees\nand lets Max turn a worktree branch into a proposal). Max decides.\n\n### Flow (Claude's pick)\n\n1. Agent (Claude Code via MCP or shell via `gitgud` CLI) calls `gitgud.status` → files + hunks with stable IDs (hash of path + base blob + hunk content), LFS/lock/`.meta` state.\n2. Agent calls `gitgud.propose({base, commits:[{hunks:[ids], message, why}], evidence, scope})`. gitgud validates (hunks still match, risk flags), writes objects, returns `proposal_id`, status `pending`. Working tree untouched.\n3. GUI: inbox badge. Review view = commits on the left, diff with flags on the right. Max can: edit message, move hunks between commits, drop a commit, leave line comments.\n4. Max chooses **Approve** → gitgud applies via the `git` CLI onto the current branch (commit hooks and signing run here, as Max, which the official MCP server can't do), then clears those hunks from the worktree diff. Or **Request changes** → comments stored; agent reads them with `gitgud.feedback(proposal_id)`. Or **Reject**.\n5. Every step is an op-log entry; \"Undo approve\" restores the previous refs/index.\n6. Push stays a separate human action (policy option later: allow agent push for approved proposals).\n\n### Surface (Claude's pick, minimal)\n\n| MCP tool / CLI | Does |\n|---|---|\n| `status` / `gitgud status --json` | Files, hunks with IDs, flags |\n| `diff`, `log`, `show` | Read-only, via `gix` |\n| `propose` / `gitgud propose` | Create proposal (above) |\n| `proposal` / `gitgud proposal <id>` | Status: pending / changes requested / approved / rejected + comments |\n| `withdraw` | Agent cancels its proposal |\n\nNothing else in v1: no `commit`, `checkout`, `merge`, `push`, `rebase` tools. One core in `gitgud-core`, two thin\nadapters (CLI, MCP stdio), per the stack in `CLAUDE.md`.\n\n### Open\n\n- Hunk IDs: how to keep them stable when Max edits nearby lines between `status` and `propose`.\n- Does Claude Code's PostToolUse/Stop hook make auto-proposals worthwhile, or is an explicit `propose` call better? (GitButler moved from hooks to an explicit skill, [Trigger.dev](https://trigger.dev/blog/parallel-agents-gitbutler).)\n- Ship a `gitgud agent setup` like `but agent setup` that writes the instructions/skill file? Likely yes.\n- MCP elicitation vs polling for \"wait for Max's verdict\".\n- Unity validation rules (which `.meta` checks, lock policy) need Max's input.\n", "ux": "# UX principles for gitgud\n\nTrack D (ux), 2026-11-21. Status: **research proposal**. Nothing here is decided. All links checked\n2026-11-21 unless marked otherwise. Every principle has a **test**: one sentence you can hold a mockup\nor build against and answer pass/fail.\n\nPains: **P1** slow on big/LFS repos · **P2** Unity merge conflicts · **P3** scary history edits ·\n**P4** clunky UI/workflow.\n\nLabels: `fact` (sourced) · `Claude's pick` · `open`.\n\n## Summary table\n\n| # | Principle | Test (pass/fail) | Pains |\n|---|---|---|---|\n| 1 | Latency budget per action | Local action shows its result ≤100 ms; >1 s shows in-place progress; >10 s shows % and Cancel | P1 P4 |\n| 2 | Never drop a frame | Graph and diff scroll at display refresh on a 100k-commit repo | P1 |\n| 3 | Undo everything | Ctrl+Z reverses the last repo change, discard and rebase included, named in a history list | P3 |\n| 4 | Preview before rewrite | Every history edit shows the resulting graph before it runs | P3 |\n| 5 | Confirm only the irreversible | Dialogs appear only for non-undoable ops and name the target and outcome | P3 P4 |\n| 6 | Keyboard-first, palette for all | Every action is in the palette with its shortcut; daily loop needs no mouse | P4 |\n| 7 | Dense, with hierarchy | ≥ ~35 commit rows visible at 1080p; hierarchy from type/contrast, not boxes | P4 |\n| 8 | Progressive disclosure, two levels | Daily loop on the main surface; anything else ≤1 step away and in the palette | P4 |\n| 9 | Direct manipulation + keyboard twin | Drags preview their outcome on hover; each has a keyboard equivalent | P3 P4 |\n| 10 | Live state, no refresh button | External changes appear ≤1 s without a click; local ops update optimistically | P1 P4 |\n| 11 | Feedback where you look | Results/errors inline and persistent; toasts only for off-screen, non-error news | P4 |\n| 12 | Make git's hidden state visible | HEAD, index, detached state and in-progress ops are always on screen | P2 P3 |\n| 13 | Errors and empty states teach | Each error says what, why (in git terms), and offers the fix | P2 P4 |\n| 14 | Readable diffs by default | Syntax + intra-line + moved-code highlighting; split/unified one key | P2 P4 |\n| 15 | Color never alone, both themes first-class | Lanes/status readable in grayscale; WCAG AA in light and dark | P4 |\n| 16 | Behave like a native desktop app | Standard OS shortcuts, menus, scaling, high-contrast all work | P4 |\n\n---\n\n## 1. Latency budget per action\n\n- **Rule:** Local actions (select commit, stage hunk, switch file, open palette) paint their result in\n  ≤100 ms, aim ≤50 ms. 0.1–1 s: no spinner needed but cursor/inline hint. >1 s: in-place progress.\n  >10 s (fetch, LFS pull, clone): percent-done, background, **Cancel**.\n- **Why (fact):** Nielsen's limits: 0.1 s feels instantaneous, 1 s keeps flow, 10 s holds attention;\n  long ops need percent-done and a way to interrupt ([NN/g, source 1993](https://www.nngroup.com/articles/response-times-3-important-limits/)).\n  Doherty threshold: productivity rises under 400 ms response ([Laws of UX](https://lawsofux.com/doherty-threshold/), source 1982).\n  Superhuman treats 100 ms as a ceiling, targets <50 ms, and buckets events <50/<100/<1000 ms\n  ([Superhuman, source 2022](https://blog.superhuman.com/superhuman-is-built-for-speed/)).\n  RAIL: handle input in 50 ms, feedback for anything >50 ms ([web.dev](https://web.dev/articles/rail)).\n  Even 100 ms is not \"instant\" for simple tasks; people perceive far less ([Dan Luu, source 2017](https://danluu.com/input-lag/)).\n- **gitgud (Claude's pick):** Telemetry-free local histogram of action latency in a debug panel with\n  the Superhuman buckets; a perf regression test fails CI if p95 select-commit >50 ms on a fixture repo.\n  LFS pull runs as a cancellable background job with bytes/files done.\n\n## 2. Never drop a frame\n\n- **Rule:** Commit graph, file list and diff scroll at the display's refresh rate (16.7 ms at 60 Hz,\n  8.3 ms at 120 Hz) on a 100k-commit, 50k-file repo. No layout work proportional to repo size on scroll.\n- **Why (fact):** Zed's frame budget at 120 Hz is 8.33 ms; they left Atom/Electron because GC pauses and\n  DOM relayout missed frames ([Zed, source 2023](https://zed.dev/blog/videogame)). RAIL budgets ~10 ms of\n  app work per frame in a browser engine ([web.dev](https://web.dev/articles/rail)) — relevant because\n  Tauri renders in WebView2.\n- **gitgud (Claude's pick):** Virtualized rows, graph lanes precomputed in Rust and streamed in pages;\n  canvas for the graph (spike in plan §4 decides). Retcon's author reports a rewrite was needed to handle\n  hundreds of thousands of commits without freezing ([HN, 2025](https://news.ycombinator.com/item?id=44953580)) —\n  budget for it from day one.\n\n## 3. Undo everything\n\n- **Rule:** Ctrl+Z reverses the last repo-changing operation — commit, amend, discard, stage/unstage,\n  checkout, branch create/delete, merge, rebase, stash ops — and Ctrl+Shift+Z / Ctrl+Y redoes. An\n  operations list names every entry (\"Undo Squash 3 commits\") and can restore any earlier point. Works\n  after restart and sees ops done from the CLI.\n- **Why (fact):**\n  - Tower: Ctrl+Z undoes file deletion, (un)staging, discarding chunks, commits, branch ops, merges,\n    interactive rebases, publishing, stashes ([Tower](https://www.git-tower.com/features/undo)).\n  - GitButler oplog snapshots branch state, uncommitted work and conflict state into the git object DB\n    before each major action; \"Revert\" restores it ([GitButler docs](https://docs.gitbutler.com/features/timeline)).\n  - jj records every operation as a \"view\" (refs, heads, working-copy commit); `undo`, `op revert`,\n    `op restore` ([jj docs](https://docs.jj-vcs.dev/latest/operation-log/)).\n  - lazygit undo is reflog-based: it can't undo working-tree changes, stashes, branch creation or\n    pushes, nor work mid-rebase ([lazygit docs](https://github.com/jesseduffield/lazygit/blob/master/docs/Undoing.md)).\n    **Reflog alone is not enough.**\n  - Apple HIG: label undo with its result, bring the restored thing into view, unlimited levels\n    ([HIG](https://developer.apple.com/design/human-interface-guidelines/undo-and-redo)).\n  - NN/g heuristic 3, user control and freedom ([NN/g](https://www.nngroup.com/articles/ten-usability-heuristics/)).\n- **gitgud (Claude's pick):** jj/GitButler-style op log in `gitgud-core`: before each write, snapshot\n  refs + index + dirty working-tree files (as blobs/a tree under a private ref, e.g.\n  `refs/gitgud/oplog`). Discard becomes recoverable. Pushes are marked \"can't undo remotely\" with a\n  revert-commit offer. After undo, scroll the graph to the restored commit (HIG \"show the results\").\n\n## 4. Preview before rewrite\n\n- **Rule:** Any history edit (rebase, squash, fixup, reorder, drop, reset, cherry-pick range) shows the\n  resulting graph and the commits that will change hash *before* it runs, plus predicted conflicts if\n  computable.\n- **Why (fact):** NN/g heuristic 5, error prevention ([NN/g](https://www.nngroup.com/articles/ten-usability-heuristics/));\n  HIG \"predict the results\" — describe the outcome before people act ([HIG](https://developer.apple.com/design/human-interface-guidelines/undo-and-redo)).\n  Max's pain P3. Retcon markets history rewriting without stashing and with editing while in conflict\n  ([HN, 2025](https://news.ycombinator.com/item?id=44953580)).\n- **gitgud (Claude's pick):** Interactive rebase as an editable list beside a ghost graph: rewritten\n  commits drawn hollow, original tips dimmed. Conflict prediction via an in-memory merge (`gix`\n  merge-tree) per step, flagged on the step. Enter runs; Esc cancels; Ctrl+Z after.\n\n## 5. Confirm only the irreversible\n\n- **Rule:** No \"Are you sure?\" for undoable actions. A dialog appears only for ops the op log can't\n  reverse (force-push, delete remote branch, LFS prune, gc). It names the target (\"Force-push\n  `feature/x` to `origin`, overwriting 3 remote commits\"), buttons say the outcome (\"Force-push\" /\n  \"Keep remote\"), and there is no default button for the dangerous one.\n- **Why (fact):** Confirmations only for serious, irreversible consequences; overuse trains\n  click-through; restate the request with identifying details; outcome-labelled buttons; avoid a default\n  \"Yes\"; for the rarest dangerous ops require an unusual step ([NN/g, source 2018, reviewed 2026](https://www.nngroup.com/articles/confirmation-dialog/)).\n  lazygit: confirm hard-to-reverse actions, Escape exits transient modes ([lazygit VISION](https://github.com/jesseduffield/lazygit/blob/master/VISION.md)).\n- **gitgud (Claude's pick):** Default to `--force-with-lease` and say so in the dialog; typing the branch\n  name only for deleting a protected/remote default branch.\n\n## 6. Keyboard-first, palette for everything\n\n- **Rule:** Every command exists in a fuzzy command palette (Ctrl+K and Ctrl+Shift+P), each row shows its\n  shortcut; `?` opens a searchable shortcut sheet; the daily loop (pick file → stage hunk → write message →\n  commit → push) runs with no mouse; focus is always visible and moves between panes with one key.\n- **Why (fact):** Linear's Cmd/Ctrl+K command menu runs any action or jumps to any page\n  ([Linear guide](https://linear.app/enablement/guides/navigating-linear)); `?` opens a searchable\n  shortcut help, built to convert users to shortcuts ([Linear changelog, source 2021](https://linear.app/changelog/2021-03-25-keyboard-shortcuts-help)).\n  Superhuman: every action has a shortcut, Cmd+K command library, hints in the UI teach the faster path\n  ([Superhuman, source 2022](https://blog.superhuman.com/superhuman-is-built-for-speed/)). NN/g heuristics\n  6–7: recognition over recall, accelerators for experts ([NN/g](https://www.nngroup.com/articles/ten-usability-heuristics/)).\n  Sublime Merge ships a command palette ([sublimemerge.com](https://www.sublimemerge.com/)).\n- **gitgud (Claude's pick):** Palette is context-aware (commit selected → commit actions first) and\n  takes arguments inline (\"checkout ▸ fuzzy branch list\"). Shortcut hints appear in tooltips and context\n  menus. Keymap is data (one file) so the spec's keyboard map is the source of truth.\n\n## 7. Dense, with hierarchy\n\n- **Rule:** One line per commit and per file; at 1080p ≥ ~35 commit rows visible (Claude's pick:\n  22–24 px rows). Hierarchy comes from type weight, contrast and alignment, not borders and cards. No\n  element without a job.\n- **Why (fact):** Linear's 2024 redesign reduced visual noise and increased hierarchy and density of\n  navigation; layered surfaces by elevation ([Linear, source 2024](https://linear.app/now/how-we-redesigned-the-linear-ui)).\n  WinUI offers a Compact density for information-rich, pointer-driven UI\n  ([Microsoft Learn spacing](https://learn.microsoft.com/en-us/windows/apps/design/style/spacing)); Windows\n  spacing ramp 8/12/16 epx, Body Strong for headers in confined space ([Microsoft Learn content basics](https://learn.microsoft.com/en-us/windows/apps/design/basics/content-basics)).\n  NN/g heuristic 8, minimalist design ([NN/g](https://www.nngroup.com/articles/ten-usability-heuristics/)).\n  Max's rule B7: clean and dense, minimal chrome.\n- **gitgud (Claude's pick):** 4 px grid, Compact by default, a single density toggle (Compact/Standard)\n  rather than per-panel settings. Secondary metadata (author, date) at lower contrast, right-aligned.\n\n## 8. Progressive disclosure, max two levels\n\n- **Rule:** The main surface shows only the daily loop (status, graph, diff, commit box, branch\n  switcher). Advanced options (rebase strategies, signing, merge drivers, LFS settings) are one step\n  away, never more than two levels deep, and always reachable from the palette. Disabled items stay in\n  place with a reason, not hidden.\n- **Why (fact):** Show the few most important options first, the rest on request; obvious path to the\n  second level; ≤2 levels ([NN/g, source 2006](https://www.nngroup.com/articles/progressive-disclosure/)).\n  Hick's law: more choices, slower decisions ([Laws of UX](https://lawsofux.com/hicks-law/)). lazygit\n  disables rather than hides menu items to protect muscle memory and explains why a binding is disabled\n  ([lazygit VISION](https://github.com/jesseduffield/lazygit/blob/master/VISION.md)).\n- **gitgud (Claude's pick):** Commit box has message + Commit; amend/sign-off/no-verify behind one\n  \"⋯\" and as palette commands. Unity-specific surfaces (lock panel, `.meta` warnings) appear only when\n  the repo is detected as Unity.\n\n## 9. Direct manipulation with a keyboard twin\n\n- **Rule:** Drag a commit onto a commit = squash/fixup; drag along the list = reorder; drag a commit to\n  another branch = cherry-pick; drag a file/hunk onto a commit = amend into it. While hovering, the drop\n  target previews the outcome (text + ghost graph); Esc cancels. Every drag has a keyboard equivalent.\n- **Why (fact):** GitButler does squash, reorder, amend-by-dropping-files and split via drag-and-drop,\n  replacing `rebase -i` ([GitButler docs](https://docs.gitbutler.com/features/branch-management/commits)).\n  lazygit copies commits with one key and pastes them elsewhere — a keyboard form of the same move\n  ([lazygit.dev](https://lazygit.dev/)). Fitts's law: bigger, nearer targets are faster\n  ([Laws of UX](https://lawsofux.com/fittss-law/)). Nielsen: 0.1 s feedback is what makes it feel like\n  direct manipulation ([NN/g](https://www.nngroup.com/articles/response-times-3-important-limits/)).\n- **gitgud (Claude's pick):** Ctrl+X / Ctrl+V on commits (cut = move, copy = cherry-pick), Alt+↑/↓ to\n  reorder, `S` to squash into parent. Drop zones are whole rows, not tiny icons.\n\n## 10. Live state, no refresh button\n\n- **Rule:** Changes made outside gitgud (editor saves, Unity reimports, CLI commits, agents) appear\n  within ~1 s without user action. Local ops update the UI optimistically and roll back visibly if git\n  fails. There is no Refresh button in the main UI.\n- **Why (fact):** Git's built-in fsmonitor daemon watches the worktree so `status` asks for changed paths\n  instead of scanning ([git-fsmonitor--daemon](https://git-scm.com/docs/git-fsmonitor--daemon)).\n  Superhuman keeps a local DB and prerenders likely-next threads for speed\n  ([Superhuman, source 2022](https://blog.superhuman.com/superhuman-is-built-for-speed/)). NN/g heuristic 1,\n  visibility of system status ([NN/g](https://www.nngroup.com/articles/ten-usability-heuristics/)).\n- **gitgud (Claude's pick):** `notify` watcher + debounce (~100 ms), coalesce Unity's burst writes to\n  `Library/` by honoring `.gitignore` before rescanning. Optionally enable `core.fsmonitor` per repo\n  (opt-in, it writes config). A subtle \"updated\" indicator on rows that changed externally.\n\n## 11. Feedback where you look\n\n- **Rule:** The result of an action appears where the user was looking (the row changes, the graph\n  moves). Errors stay inline until dismissed, with git's raw output one click away. Toasts only for\n  passive, non-error news about something off-screen (fetch finished, agent staged a commit).\n- **Why (fact):** Toasts suit passive notifications but are poor for errors — they vanish before being\n  noticed; pick indicator/validation/notification by cause and urgency ([NN/g, 2024](https://www.nngroup.com/articles/indicators-validations-notifications/)).\n  lazygit shows a toast only when the affected entity is off-screen ([lazygit VISION](https://github.com/jesseduffield/lazygit/blob/master/VISION.md)).\n- **gitgud (Claude's pick):** One status strip per pane for running jobs; failed push shows an inline\n  banner on the branch with \"Pull and retry\" / \"Show output\".\n\n## 12. Make git's hidden state visible\n\n- **Rule:** Always on screen: current branch or a loud **Detached HEAD at abc123** state with \"create\n  branch here\"; staged vs unstaged vs untracked as distinct groups; ahead/behind; any in-progress\n  operation (rebase 3/7, merge, cherry-pick, bisect) as a persistent banner with Continue / Skip / Abort.\n- **Why (fact):** Perez De Rosso & Jackson identify git's concepts (staging area, tracked file, stash,\n  branch) as hard to grasp and misfitting user purposes; ending up in detached HEAD when going back to an\n  old commit is a listed misfit ([Onward! 2013 paper, MIT](https://dspace.mit.edu/bitstream/handle/1721.1/105233/onward009-perez_de_rosso.pdf);\n  [summary of the 2016 OOPSLA follow-up](https://blog.acolyer.org/2016/10/25/purposes-concepts-misfits-and-a-redesign-of-git/), sources 2013/2016).\n  Gitless removes the staging area and keeps working changes per branch so switching needs no stash\n  ([gitless.com](https://gitless.com/)). lazygit marks \"YOU ARE HERE\" during rebase and surfaces the\n  rebase-options key prominently ([lazygit VISION](https://github.com/jesseduffield/lazygit/blob/master/VISION.md)).\n- **gitgud (Claude's pick):** Keep the index (Max stages hunks) but make it spatial: two stacked lists\n  with drag between them. Conflict state per file (code vs Unity YAML vs binary/LFS) shown as distinct\n  types so P2 conflicts route to the right resolver.\n\n## 13. Errors and empty states teach git\n\n- **Rule:** Every error message states (a) what happened in plain words, (b) the git concept behind it,\n  (c) one primary fix button, (d) raw stderr collapsed. Empty states show the next action (empty repo →\n  \"Make first commit\"; no conflicts → nothing; locked file → who holds the lock and \"Request unlock\").\n- **Why (fact):** NN/g heuristic 9: plain-language errors that explain and suggest a fix; heuristic 10:\n  task-focused help ([NN/g](https://www.nngroup.com/articles/ten-usability-heuristics/)). lazygit aims to\n  document how to solve git problems inside the tool ([lazygit VISION](https://github.com/jesseduffield/lazygit/blob/master/VISION.md)).\n- **gitgud (Claude's pick):** Map the top ~20 git failure strings (non-fast-forward, dirty tree on\n  checkout, LFS smudge failure, lock held by someone else, merge conflict in `.unity`/`.prefab`) to\n  explained fixes. Unknown errors fall back loudly to raw output (Max's B8, fail loud).\n\n## 14. Readable diffs by default\n\n- **Rule:** Diffs ship with syntax highlighting, intra-line (word/char) change highlighting,\n  moved-code coloring, a readable algorithm (histogram), whitespace-ignore toggle, and a one-key\n  split/unified toggle. Hunks are stageable by line from either mode.\n- **Why (fact):** git supports `--word-diff`, `--color-moved=zebra|dimmed-zebra` (moved blocks with\n  borders highlighted) and `patience`/`histogram` algorithms for readability ([git-diff docs](https://git-scm.com/docs/git-diff)).\n  Sublime Merge advertises syntax highlighting, character diffs and side-by-side ([sublimemerge.com](https://www.sublimemerge.com/)).\n  difftastic diffs by syntax tree with tree-sitter and ignores formatting-only changes\n  ([difftastic](https://difftastic.wilfred.me.uk/)). Fork's syntax-highlighting request drew 61 reactions\n  ([Fork #56](https://github.com/fork-dev/TrackerWin/issues/56), source 2018).\n- **gitgud (Claude's pick):** Unified by default under ~1400 px pane width, split above. Unity YAML gets\n  a semantic view (object/component names instead of `fileID` noise) as a toggle — `open` whether this\n  is MVP (feeds P2). Binary/LFS assets: image before/after/onion-skin instead of \"binary file changed\".\n\n## 15. Color never alone; both themes first-class\n\n- **Rule:** Graph lanes, file status and diff +/- are distinguishable in grayscale (shape, glyph,\n  position or text as well as color). Text ≥4.5:1, UI glyphs/lane lines ≥3:1, in light and dark.\n  Lane palette is color-blind safe. Themes come from a few tokens, and the app follows the OS theme by\n  default.\n- **Why (fact):** WCAG 1.4.1: color must not be the only means of conveying information\n  ([W3C](https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html)); 1.4.3 text contrast 4.5:1\n  ([W3C](https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html)); 1.4.11 non-text contrast\n  3:1 ([W3C](https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html)). Okabe-Ito is a\n  categorical palette that survives common color-vision deficiencies, but color-only coding is never\n  fully safe ([data.europa.eu guide](https://data.europa.eu/apps/data-visualisation-guide/accessible-colour-palettes)).\n  Linear generates all themes in LCH from base, accent and contrast, with a contrast knob for\n  accessibility ([Linear, source 2024](https://linear.app/now/how-we-redesigned-the-linear-ui)). GitHub\n  Desktop's dark-theme request got 159 reactions ([desktop #1515](https://github.com/desktop/desktop/issues/1515), source 2017).\n- **gitgud (Claude's pick):** Status letters (M/A/D/R/U/C) next to colors; lanes keep a stable color per\n  branch and the selected branch's lane is thicker; diff uses +/- gutter glyphs. Theme tokens in OKLCH.\n\n## 16. Behave like a native desktop app\n\n- **Rule:** Standard OS shortcuts work (Ctrl+Z/Y, Ctrl+C on a commit copies its hash, F2 rename branch,\n  Del delete with undo, Ctrl+F find, Ctrl+, settings); right-click menus everywhere; follows OS\n  theme, accent, text scaling and Windows high-contrast mode; screen reader announces rows (role,\n  name, status). macOS swaps to Cmd later with no other change.\n- **Why (fact):** NN/g heuristic 4, consistency and standards ([NN/g](https://www.nngroup.com/articles/ten-usability-heuristics/));\n  macOS undo/redo belong at the top of Edit with Cmd-Z / Shift-Cmd-Z ([HIG](https://developer.apple.com/design/human-interface-guidelines/undo-and-redo));\n  Windows content/spacing guidance ([Microsoft Learn](https://learn.microsoft.com/en-us/windows/apps/design/basics/content-basics)).\n  Raycast renders extensions as native UI so they don't feel like a webview mini-app\n  ([Raycast blog](https://www.raycast.com/blog/how-raycast-api-extensions-work)).\n- **gitgud (Claude's pick):** Keymap file has a `ctrl`/`cmd` \"mod\" abstraction from day one; virtualized\n  lists still expose ARIA `grid`/`treegrid` rows (`open`: verify Narrator + WebView2 with virtualization).\n\n---\n\n## Anti-patterns seen in today's git GUIs\n\n| Anti-pattern | Evidence | Principle |\n|---|---|---|\n| Freezes on big/Unity repos; UI blocked by git calls | Sourcetree \"Hangs (not responding) … Unity Large Project\" thread; per search snippet the repo was 90 GB+ and a moderator said that scale isn't routinely tested ([Atlassian community, 2013–2019 era, thread body not loadable](https://community.atlassian.com/forums/Sourcetree-questions/SourceTree-Hangs-not-responding-on-Windows-10-Unity-Large/qaq-p/619773)); \"Source Tree slow on big repositories\" ticket ([SRCTREEWIN-2602](https://jira.atlassian.com/browse/SRCTREEWIN-2602)) | 1, 2, 10 |\n| Missed frames from a web stack doing DOM layout per frame | Zed on Atom: GC pauses and relayouts made frame rate inconsistent ([Zed, 2023](https://zed.dev/blog/videogame)) | 2 |\n| Undo that can't undo a discard | Reflog-only undo skips working tree, stash, branch creation ([lazygit docs](https://github.com/jesseduffield/lazygit/blob/master/docs/Undoing.md)); \"Undo discard files\" open request ([Fork #657](https://github.com/fork-dev/TrackerWin/issues/657), source 2020) | 3 |\n| Keyboard as an afterthought | Fork's \"Keyboard shortcuts\" issue open since 2019, 161 reactions — its top request ([Fork #333](https://github.com/fork-dev/TrackerWin/issues/333)) | 6 |\n| Clutter: everything on screen at once | HN user gave up on Sourcetree, GitKraken and others over too many UI elements in random places ([HN, 2022](https://news.ycombinator.com/item?id=33740619)) | 7, 8 |\n| Hiding the graph | GitHub Desktop \"History graph\" request, 295 reactions, open since 2020 ([desktop #9452](https://github.com/desktop/desktop/issues/9452)) | 12 |\n| Generic \"Are you sure?\" with Yes/No | NN/g's multi-item delete example: no target details, Yes/No labels ([NN/g](https://www.nngroup.com/articles/confirmation-dialog/)) | 5 |\n| Errors in disappearing toasts | Toast errors missed for minutes in testing ([NN/g, 2024](https://www.nngroup.com/articles/indicators-validations-notifications/)) | 11 |\n| Rebase/conflict mode with no visible \"where am I\" | Detached HEAD / staging confusion as concept misfits ([Perez De Rosso & Jackson](https://blog.acolyer.org/2016/10/25/purposes-concepts-misfits-and-a-redesign-of-git/)) | 12 |\n\n## Open / not verified\n\n- `open` — **Name clash:** a \"GitGud\" open-source Git GUI with undo for any action was posted on HN on\n  2026-10-17 ([HN](https://news.ycombinator.com/item?id=50132140), repo `zeuros/gitgud`); a commenter\n  lists other existing gitgud projects. Max should decide whether to rename before going public.\n- `open` — Fluent 2 has no published Compact token set for web; WinUI Compact numbers were not\n  extracted. Arc, Figma and Raycast's keyboard docs were not fetched in this pass.\n- Apple HIG content came from its JSON data endpoint; Atlassian Sourcetree threads are 2013–2019 and\n  were read via search snippets, not opened.\n- Screenshots and annotations: [`shots/ux.json`](shots/ux.json).\n", "spikes": "# Spikes (plan section 4)\n\nRun 2026-11-21 on Max's PC (Windows 11, 28 threads, NVMe; Git 2.45.1, git-lfs 3.5.1, Rust 1.98.1,\nEdge for WebView2-equivalent rendering). Throwaway code, as run, is in [`spikes/`](../../spikes) (paths in\nthe scripts point at the session scratchpad). All numbers are `fact` (measured here, warm cache unless\nstated); verdicts are `Claude's pick`.\n\nTest repos: **rust-lang/rust** (349,307 commits, 64,797 files, 1.2 GB `.git`) and **Unity-Technologies/\nBoatAttack** (Unity, 1,376 files, 124 prefabs, 734 `.meta`, 185 LFS files = 903 MB).\n\n## Summary\n\n| Spike | Verdict | Effect on stack |\n|---|---|---|\n| 4.1 Old prototype | Keep ideas, no code | Confirms `CLAUDE.md` |\n| 4.2 `gix` reads | Fast enough for log/graph, status, diff, blame. Two traps: rename detection is slow, and status doesn't refresh the index | Keep `gix` for reads, with two rules (below) |\n| 4.3 Graph rendering | Webview copes with 349k commits at display refresh. Canvas is steadier than DOM. Lane layout must be lazy | Keep Tauri/WebView2; canvas graph column |\n| 4.4 File watching | `notify` survives a 160k-event storm, no overflow; Unity `Library/` is 98% of reimport noise | Keep `notify`; watch per top-level dir, skip ignored |\n| 4.5 `git` CLI | Progress parses cleanly; prompts fail fast when disabled; kill tree is clean except leftovers | Keep CLI for writes; cancel = kill tree + cleanup |\n| 4.6 Unity + LFS | UnityYAMLMerge works as an automatic driver **only with `--force`**; merges 3 of 5 conflict cases; silently loses data in 1 | Ship the driver + a post-merge check |\n| 4.7 Agent CLI/MCP | One core, two adapters works; proposal under hidden ref leaves Max's index untouched | Keep the design from agents.md §6 |\n\n## 4.1 Old prototype (`5f1257d`, 10 commits, 2025-12-14)\n\n**Question:** what worked, what to keep. **Method:** read the tree at `5f1257d`.\n\n**Numbers:** `git_operations.rs` 708 lines, 17 commands in one file. `RepositoryDetail.svelte` 1,009 lines\n(staging, diff, commit, push, credential form in one component). Two placeholder test specs, no Rust tests.\n\n| Area | What it did | Verdict |\n|---|---|---|\n| Git access | `git2` 0.19 for everything | drop. Pull handled fast-forward only (`\"Merge required (not implemented in MVP)\"`); hooks never ran |\n| Auth | HTTPS PAT typed into a form, saved by `tauri-plugin-store` (plain JSON on disk) | drop. The `git` CLI + Git Credential Manager removes this feature (4.5) |\n| Remote / log / state | hard-coded `origin`; log limit 50, no graph; Svelte 4 stores, re-invoke everything after each action | drop |\n| Diff view | side-by-side, two line-number columns, sticky hunk headers | keep the idea |\n\n## 4.2 `gix` 0.90 reads on rust-lang/rust and BoatAttack\n\n**Question:** do status, diff, blame and log/graph walks work in `gix`, and how fast vs the `git` CLI?\n**Method:** [`spikes/gixbench`](../../spikes/gixbench), release build, vs `git` 2.45.1 doing the same work.\n\n| Operation (rust-lang/rust) | `gix` | `git` CLI | Note |\n|---|---|---|---|\n| Open repo | 20 ms | — | |\n| Status, clean tree, 65k files | 278 ms | 106 ms | First run after checkout: `gix` 6,957 ms (cold FS cache) |\n| **Graph topology, all 349k commits** (ids + parents) | **106 ms** | 448 ms (`log --format=%H %P`) | with commit-graph file |\n| Full walk incl. message + author, 349k | 1,855 ms (commit-graph) / 2,624 ms (none) | 2,367 ms | Only visible rows need metadata |\n| First 500 commits with metadata | 2.3 ms | 44 ms | Opening a repo feels instant |\n| Tree diff HEAD^..HEAD | 1.4 ms | — | |\n| Tree diff HEAD~200..HEAD, **no renames** | 23 ms | 99 ms | 11,631 changes |\n| Tree diff HEAD~200..HEAD, **with rename detection** | **3,588 ms** | 274 ms | `gix` 13× slower |\n| Blame `README.md` (33,628 commits traversed) | 744 ms | 418 ms | |\n| Write commit-graph | — | 2.4 s, once | Not present after clone |\n\n| Operation (BoatAttack, LFS) | `gix` | `git` CLI |\n|---|---|---|\n| Status, clean | 26–31 ms | 41 ms |\n| Status after touching all 185 LFS files (same content, new mtime, as a Unity reimport does) | **1,312–1,441 ms, every call** | 1,902 ms once, then 42 ms |\n\n**Finding:** `gix` status is read-only, so it never writes refreshed stat data back to the index. Each call\nre-hashes every stat-dirty LFS file through the filter. `git status` rewrites the index once, and later\ncalls are cheap again. `gix` still reported 0 false changes and caught a real 1-byte edit, so the LFS filter\nis applied correctly.\n\n**Verdict:**\n- `gix` for log and graph, diff, blame and status.\n- Turn rename detection off for big ranges, or cap it (`diff.renameLimit` style), and run it lazily per file.\n- After a slow status, or when the watcher reports a mass touch, refresh the index once. Either run\n  `git update-index -q --refresh` through the CLI path, or write the index with `gix`. Untested: whether\n  `gix` 0.90 can write the refreshed index.\n- Write the commit-graph on first open, with one confirm (it took 2.4 s here, once).\n\n## 4.3 Commit graph rendering at 349k commits\n\n**Question:** canvas vs virtualised DOM, scroll smoothness, first paint. **Method:**\n[`spikes/graph/bench.html`](../../spikes/graph/bench.html) in a separate Edge window (the same Chromium engine\nas WebView2), 1384×861, occlusion throttling off. Data: rust-lang/rust topo-order log (34 MB TSV). Each run\nlasted 4 s: slow scroll at 2,000 px/s, fast scroll at 30,000 px/s, and a random scrollbar jump every frame.\nThe display refresh was 100 Hz (10 ms frames).\n\n**Finding first:** rust's history is wide. Topo order holds about 100 concurrent lanes on average and 185 at\npeak, which comes to **35M line segments**. Precomputing segments per row does not fit in a JS array\n(RangeError). The working design stores a lane snapshot every 256 rows and replays at most 255 rows per\nframe, then draws only the visible rows. Width is capped at 32 drawn lanes.\n\n| | Canvas | Virtualised DOM (SVG per row) |\n|---|---|---|\n| Parse 349k rows (JS) | 368 ms | 355 ms |\n| Lane layout, checkpoints only | 33 ms | 33 ms |\n| First paint | 5 ms | 3 ms |\n| JS heap | 123 MB | 122 MB |\n| Slow scroll: fps / p95 frame / frames > 17.5 ms | 99.6 / 10.1 ms / 0% | 99.8 / 10.1 ms / 0% |\n| Fast scroll | 99.7 / 10.1 / 0% | 99.9 / 10.1 / 0% |\n| Scrollbar jumps | 99.7 / 10.1 / **0%** | 96.6 / 10.1 / **3.4%** |\n| Render time p95 (script only) | 0.7–1.4 ms | 0.3–4.5 ms |\n\n**Verdict:**\n- WebView2 is not the bottleneck; Tauri stays.\n- Draw the graph column on canvas. Text can be either, but canvas held 0% slow frames on jumps.\n- Compute lanes in Rust (`gix` topology takes 106 ms) and send the webview checkpoints plus visible rows\n  on demand, not the whole history.\n- Cap the drawn width and fold far lanes into an edge marker.\n- `open`: test on a 4K monitor at DPR 2 and on a weaker laptop.\n\n## 4.4 File watching (`notify` 9.0)\n\n**Question:** event latency, and behaviour under storms. **Method:** [`spikes/watchbench`](../../spikes/watchbench),\none recursive watch on the repo root (ReadDirectoryChangesW, 64 KiB buffer).\n\n| Test | Result |\n|---|---|\n| Watch setup on rust (65k files) | 0.2 ms |\n| Single-file write → event | p50 0.30 ms, p95 0.35 ms, max 0.46 ms |\n| `git checkout HEAD~3000` on rust (46,926 files changed, 18 s) | 136,596 events, **0 rescans, 0 errors** |\n| Checkout back (19 s) | 160,651 events, 0 rescans, 0 errors |\n| Simulated Unity reimport on BoatAttack: 20,000 files written to `Library/` + every `Assets/` file touched (7.2 s) | 62,779 events: **Library 61,581 (98%)**, worktree 1,198, `.git` 0 |\n\n**Verdict:**\n- `notify` is reliable on Windows.\n- Don't watch the root recursively. Watch each top-level directory that isn't ignored (skip `Library/`,\n  `Temp/`, `Logs/`, `obj/`), plus `.git/HEAD`, `.git/refs` and `.git/index` for outside git changes.\n- Debounce about 150 ms, then run one `gix` status.\n- Pause the watcher during gitgud's own git operations and refresh once when they finish.\n\n## 4.5 Driving the `git` CLI: progress, credentials, cancel\n\n**Method:** [`spikes/gitproc`](../../spikes/gitproc) spawns `git` with stderr piped, splits on `\\r`/`\\n`,\nparses `phase: NN% (a/b), size | rate`.\n\n| Test | Result |\n|---|---|\n| `clone --progress` rust-lang/rust | 230 progress updates in 15 s. Phase, percent, counts and rate parse cleanly (e.g. `Receiving objects 16% (579112/3619449), 295 MiB, 30.8 MiB/s`) |\n| Cancel: `Child::kill` (git.exe only) | Children exited too (`fatal: early EOF`); 0 orphan processes |\n| Cancel: `taskkill /T /F` | 170–190 ms, 0 orphans |\n| Leftovers after cancel | Cancelled clone left its directory (61 KB to **310 MB**); cancelled fetch left `.git/objects/pack/tmp_pack_*` (128 MB). No `.lock` files seen |\n| HTTPS auth with no helper, `GIT_TERMINAL_PROMPT=0` | Fails in 407 ms: `terminal prompts disabled` |\n| HTTPS with GCM and `GCM_INTERACTIVE=never` | Fails in 589 ms; no window appears |\n| SSH with `BatchMode=yes` | Fails in 427 ms with a readable host-key error |\n| `git lfs pull` progress | Nothing on piped stderr. **`GIT_LFS_PROGRESS=<file>`** writes machine-readable lines (`download 4/183 20086015/49690226 <path>`), 4,920 lines in 8 s |\n| `git lfs pull` cancelled at 8 s, then rerun | 0 files hydrated (LFS downloads everything before checkout); `.git/lfs/incomplete/` remains; rerun took the full 23 s |\n\n**Verdict:**\n- Always set `GIT_TERMINAL_PROMPT=0`.\n- Background fetches also set `GCM_INTERACTIVE=never` and `ssh -o BatchMode=yes`. User-started push and\n  fetch let GCM show its own window.\n- Cancel = kill the process tree, then clean up: delete the clone directory, or delete `tmp_pack_*` newer\n  than when the operation started.\n- Read LFS progress from `GIT_LFS_PROGRESS`.\n- Use Windows Job Objects in production. `taskkill` worked here, but a Job Object also catches grandchildren\n  (`open`).\n\n## 4.6 Unity + LFS (BoatAttack) and UnityYAMLMerge\n\n**Clone / LFS:** clone (no smudge) 5.2 s; `git lfs pull` of 185 files / 903 MB in 23.3 s (about 39 MB/s).\nSourcetree comparison not run: it needs GUI driving, which is still pending (see below).\n\n**Findings on this machine (`fact`):**\n- **Git 2.45.1 breaks LFS clones.** The clone fails with \"active `post-checkout` hook found during\n  `git clone`\". 2.45.2 reverted that change\n  ([release notes](https://github.com/git/git/blob/master/Documentation/RelNotes/2.45.2.adoc)). Fix: upgrade\n  Git (current is 2.56.1). gitgud should check `git --version` at startup and warn on known-bad versions.\n- **rust-lang/rust fails to check out on Windows** without `core.longpaths=true` (\"Filename too long\").\n  gitgud should set it, or offer it, on clone.\n- **`GIT_CURL_VERBOSE=0` is set in your environment.** Git treats any value as \"on\", so every HTTPS\n  operation prints curl traces. Harmless, but noisy, and probably slower.\n- BoatAttack contains `AIcontroller.cs.meta` next to `AiController.cs`, a case mismatch. Windows hides it;\n  case-sensitive filesystems break on it. The `.meta` guard should check case too.\n\n**UnityYAMLMerge (Unity 6000.3.21f1) as a git merge driver.** Method:\n[`spikes/scripts/unitymerge.py`](../../spikes/scripts/unitymerge.py). Each scenario uses two branches that edit\n`ReplayCameras.prefab` (11 GameObjects) or `BaseButton_Finish.prefab` (a prefab instance with overrides).\n\n- Without `--force` the driver **always fails**: git passes temp files with no extension\n  (`.merge_file_XXXX`), and the tool answers \"Don't know how to merge\". Working config:\n  `driver = \"<Unity>/Editor/Data/Tools/UnityYAMLMerge.exe\" merge -h -p --force --fallback none %O %B %A %A`\n  (argument order: base, theirs, ours, dest).\n\n| Scenario | Plain git | With driver |\n|---|---|---|\n| S1 two fields on one Transform (adjacent lines) | conflict | **clean, both kept** |\n| S2 same field, different values | conflict | conflict, **0 markers** (file left as ours) |\n| S3 both add a child GameObject to the same parent | conflict (3 hunks) | **clean, both kept, no duplicate fileIDs** |\n| S4 prefab instance: both add different overrides | conflict | **clean, both kept** |\n| S5 prefab instance: same override, different values | conflict | **clean, theirs silently lost** |\n\n- On a real conflict, `-o <file> --describe` gives structured output, e.g.\n  `571479311832868573.Transform.m_LocalPosition x change to 2.0` for one side and `1.0` for the other.\n  gitgud can resolve the fileID to a GameObject name and show \"BlimpCamera › Transform › Position.x:\n  theirs 2.0 / yours 1.0\" with pick buttons.\n\n**Verdict:**\n- gitgud registers the driver itself: it finds Unity in Hub installs and writes `.git/config` plus\n  `.git/info/attributes`, so no tracked files change.\n- After every clean driver merge, gitgud checks both sides' changes per propertyPath. When both sides\n  changed the same one, it flags the file \"merged, verify\", which catches S5.\n- When there are no markers, it shows the structured conflict list instead of a text editor.\n\n## 4.7 Agent interface: one core, CLI + MCP\n\n**Method:** [`spikes/agentcore`](../../spikes/agentcore). `core.rs` holds all the logic (git CLI only);\n`main.rs` exposes it as a CLI and as an MCP stdio server (`rmcp` 3.11) with three tools: `status`, `propose`,\n`proposals`. There is no commit or approve tool for the agent. The flow was driven by\n[`spikes/scripts/agenttest.py`](../../spikes/scripts/agenttest.py), playing the agent.\n\n1. The \"agent\" edits `Engine.cs` (2 hunks) and adds `Turbo.cs` without a `.meta`.\n2. `status` returns hunk IDs: an FNV hash of the path and hunk body, without line numbers.\n3. Over MCP: initialize, `tools/list`, then `propose` with 2 of the 3 hunks, a message and a \"why\". All\n   round trips together took **177 ms**.\n4. `propose` builds the commit in a **temporary index** (`GIT_INDEX_FILE`: `read-tree HEAD`, `apply --cached\n   --recount`, `write-tree`, `commit-tree`) and stores it at `refs/gitgud/proposals/<id>`. Trailers:\n   `Gitgud-Why`, `Gitgud-Base`.\n5. Risk flag raised: `missing .meta for Assets/Scripts/Boat/Turbo.cs`.\n6. Max's index stays **empty** and the worktree keeps all the edits.\n7. `approve` (CLI, for the human) checks that HEAD hasn't moved and the index is clean, applies the proposal\n   to the real index, then runs **`git commit`**, so hooks and signing run, and deletes the ref.\n8. What's left unstaged is exactly hunk B. Its ID `5c7a403f` stayed the same even though its line numbers\n   shifted (102 → 103).\n\n**Limits found:**\n- A new file only shows in `git diff` after `git add -N`, which touches the index. A real core needs its own\n  untracked-file listing.\n- When HEAD moves, the proposal has to be replayed (`git replay` / cherry-pick) rather than refused.\n- Lock checks need the LFS lock API (not tested; BoatAttack has no lockable patterns).\n\n**Verdict:** the design in agents.md §6 works as built. `rmcp` is easy to adopt (a derive-style\n`#[tool_router]`). Keep the logic in `gitgud-core`, with thin CLI and MCP adapters.\n\n## Not done\n\n- **Hands-on GUI round:** done 2026-11-21 for Fork, Sublime Merge and GitButler; see\n  [handson.md](handson.md). Not run: Sourcetree (Max's work install) and lazygit (terminals are\n  click-only for computer use). Test repo built by\n  [`spikes/scripts/handson_setup.py`](../../spikes/scripts/handson_setup.py).\n- 4K/DPR 2 graph run; `gix` index write-back; Job Object cancel; LFS lock API against a real host.\n", "questions": "# Open questions for Max\n\nCollected 2026-11-21 from all tracks. **All answered by Max on 2026-11-21** (one at a time, with\nClaude's pick as the recommended option). \"Answer\" is Max's choice; where it differs from Claude's\npick, the pick is kept for the record.\n\n## Product and scope\n\n| # | Question | Answer (decided 2026-11-21) | Source |\n|---|---|---|---|\n| Q1 | The name: `zeuros/gitgud` (Git GUI, 2024, 18★) launched on HN 2026-10-17 with \"undo any action\". Rename? | **Keep \"gitgud\" for good**, accepting the clash. (Claude's pick was a working name until going public.) | [HN](https://news.ycombinator.com/item?id=50132140), [repo](https://github.com/zeuros/gitgud) |\n| Q2 | Which host do your Unity repos use? | **Bitbucket and GitHub.** Lock features target both. `open`: confirm Bi
